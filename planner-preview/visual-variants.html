<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f5f8">
  <meta name="description" content="業務管理ボード D案・デジタル手帳型UIのデザイン確認用モック。実データには接続しません。">
  <title>業務管理ボード｜統一レイアウト・4種類のビジュアル比較</title>
  <style>
:root {
  color-scheme:light;
  --bg:#f2f5f8;
  --paper:#fffdf8;
  --paper-blue:#fbfcff;
  --ink:#25374b;
  --sub:#54677c;
  --muted:#78889a;
  --brand:#425b8d;
  --brand-deep:#344b79;
  --line:#dde3ec;
  --line-soft:#e8edf1;
  --lav:#edf0fb;
  --lav-strong:#dde2f8;
  --rose:#fae9ee;
  --mint:#e7f4ed;
  --cream:#fff1db;
  --danger:#9b522d;
  --green:#256d59;
  --shadow:0 18px 60px #39475d1a,0 4px 14px #4c5b6e0b
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at 8% 30%,#e8ecf7 0,transparent 25%),radial-gradient(circle at 96% 7%,#fbe9e9 0,transparent 22%),var(--bg);
  color:var(--ink);
  font:16px/1.55 "Noto Sans CJK JP","Yu Gothic UI","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased
}
button,input {
  font:inherit
}
button {
  cursor:pointer
}
button:focus-visible,input:focus-visible {
  outline:3px solid #8b9dd4;
  outline-offset:3px
}
button:disabled {
  cursor:not-allowed
}
.symbols {
  position:absolute;
  width:0;
  height:0;
  overflow:hidden
}
.ico {
  width:19px;
  height:19px;
  display:inline-block;
  flex:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
  fill:none
}
button {
  color:inherit
}
.app-shell {
  min-height:100vh
}
.topbar {
  height:80px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:26px;
  margin:0 auto;
  max-width:1440px;
  padding:0 58px;
  position:relative
}
.brand {
  display:flex;
  gap:13px;
  align-items:center;
  white-space:nowrap
}
.brand-mark {
  width:46px;
  height:46px;
  border-radius:16px;
  background:#dfe6fb;
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--brand);
  transform:rotate(-6deg);
  box-shadow:inset -5px -4px #cad7f2
}
.brand-mark .ico {
  height:27px;
  width:27px;
  transform:rotate(6deg)
}
.brand strong {
  display:block;
  font-size:18px;
  letter-spacing:.015em;
  font-weight:800
}
.brand small {
  display:block;
  font:700 10px/1.5 system-ui,sans-serif;
  letter-spacing:.17em;
  color:#8c94a7
}
.top-actions {
  display:flex;
  gap:12px;
  align-items:center
}
.global-search {
  width:250px;
  border:1px solid #e1e6ee;
  border-radius:14px;
  background:#ffffffb8;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 12px;
  height:43px;
  color:#8290a5
}
.global-search input {
  width:100%;
  min-width:0;
  color:var(--ink);
  border:0;
  background:none;
  outline:0;
  font-size:14px
}
.global-search input::placeholder {
  color:#9daabc
}
.global-search kbd {
  font-size:10px;
  letter-spacing:-.01em;
  border:1px solid #e0e7ef;
  border-radius:5px;
  padding:2px 5px;
  white-space:nowrap;
  color:#9aa6b5
}
.top-add {
  display:flex;
  align-items:center;
  gap:7px;
  background:var(--brand);
  border:1px solid var(--brand);
  padding:0 16px;
  height:43px;
  border-radius:14px;
  color:#fff;
  font-weight:700;
  font-size:14px;
  box-shadow:0 4px 10px #425b8d25
}
.top-add:hover {
  background:var(--brand-deep)
}
.top-add .ico {
  height:17px;
  width:17px
}
.icon-btn {
  width:43px;
  height:43px;
  border:1px solid #e0e7f0;
  border-radius:14px;
  background:#fffafc;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#596c8c;
  position:relative
}
.notice-dot {
  width:7px;
  height:7px;
  border:2px solid #fff;
  box-sizing:content-box;
  background:#db8a8a;
  border-radius:50%;
  position:absolute;
  top:8px;
  right:8px
}
.user-chip {
  display:flex;
  align-items:center;
  gap:9px;
  border:1px solid #e2e7f0;
  border-radius:15px;
  padding:4px 11px 4px 4px;
  background:#ffffffa9;
  text-align:left
}
.avatar {
  background:#d6eadd;
  border:2px solid #fff;
  border-radius:12px;
  height:34px;
  width:34px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  color:#41735c;
  font-weight:800
}
.user-info {
  font-size:13px;
  font-weight:700;
  min-width:64px;
  line-height:1.4
}
.user-info small {
  display:block;
  font-size:10px;
  color:#97a1ad;
  font-weight:500
}
.user-chip>.ico {
  height:13px;
  width:13px;
  color:#8896a7
}
.add-menu {
  z-index:20;
  position:absolute;
  top:67px;
  right:203px;
  width:210px;
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:var(--shadow);
  padding:9px
}
.add-menu[hidden] {
  display:none
}
.menu-caption {
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  padding:9px
}
.add-menu button {
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:11px;
  border:0;
  border-radius:9px;
  background:none;
  text-align:left;
  font-size:14px
}
.add-menu button:hover {
  background:var(--lav)
}
.workspace {
  max-width:1352px;
  margin:auto;
  padding:6px 26px 24px
}
.mock-notice {
  min-height:38px;
  display:flex;
  align-items:center;
  gap:9px;
  color:#737f93;
  font-size:13px;
  margin:0 0 4px;
  padding:0 20px
}
.mock-notice strong {
  color:#53648c;
  font-weight:700
}
.tiny-glow {
  height:8px;
  width:8px;
  background:#93beae;
  border-radius:100%;
  box-shadow:0 0 0 4px #e7f5eb
}
.mock-notice .version {
  margin-left:auto;
  color:#a2a9bb;
  font-size:11px;
  letter-spacing:.09em
}
.notebook-wrap {
  position:relative;
  padding-top:41px
}
.tab-nav {
  position:absolute;
  top:0;
  left:27px;
  right:27px;
  display:flex;
  align-items:flex-end;
  gap:7px;
  z-index:1
}
.tab {
  height:44px;
  min-width:134px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  white-space:nowrap;
  font-size:14px;
  font-weight:700;
  border:1px solid #d9e0e9;
  border-bottom:0;
  padding:0 19px;
  border-radius:13px 13px 0 0;
  position:relative;
  color:#526079;
  background:#e9ecf4;
  transition:height .15s ease,background .15s ease
}
.tab:before {
  content:"";
  width:6px;
  height:6px;
  background:currentColor;
  opacity:.32;
  border-radius:50%;
  position:absolute;
  left:10px;
  top:10px
}
.tab[data-view=today] {
  background:#e5e8fa
}
.tab[data-view=todo] {
  background:#f6e4ec
}
.tab[data-view=tasks] {
  background:#e1edfa
}
.tab[data-view=schedule] {
  background:#fcf0d7
}
.tab[data-view=notes] {
  background:#e3f2e8
}
.tab.active {
  height:50px;
  z-index:3;
  border-color:#d9e0e9;
  box-shadow:0 -4px 12px #566b9c0c;
  color:var(--ink)
}
.tab.active:after {
  content:"";
  height:7px;
  position:absolute;
  left:0;
  right:0;
  bottom:-3px;
  background:var(--paper);
  z-index:5
}
.tab .ico {
  height:17px;
  width:17px
}
.notebook {
  width:100%;
  min-height:750px;
  background:var(--paper);
  border:1px solid #d9dfe7;
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
  z-index:2
}
.notebook::before {
  content:"";
  position:absolute;
  top:90px;
  bottom:0;
  left:50%;
  width:1px;
  z-index:4;
  background:#e0e3e9;
  box-shadow:-5px 0 9px #b4bdcb21,5px 0 9px #b4bdcb25;
  pointer-events:none
}
.notebook::after {
  content:"";
  position:absolute;
  top:90px;
  bottom:8px;
  left:calc(50% - 5px);
  width:11px;
  z-index:5;
  pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,#d6d9df1b 40%,#c3cbd40f 50%,transparent 90%)
}
.book-header {
  height:93px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 38px 15px;
  border-bottom:1px solid var(--line);
  background:radial-gradient(circle at 7% 15%,#fff6e9 0,transparent 29%),linear-gradient(#fffdfa,#fffdf8)
}
.book-header h1 {
  font-size:26px;
  letter-spacing:-.045em;
  margin:1px 0 0;
  font-weight:800
}
.eyebrow {
  color:#9b8290;
  font-size:11px;
  letter-spacing:.15em;
  font-weight:800
}
.date-tools {
  display:flex;
  align-items:center;
  gap:8px
}
.date-tools button {
  height:38px;
  min-width:38px;
  background:white;
  border:1px solid var(--line);
  border-radius:10px;
  display:inline-flex;
  gap:6px;
  align-items:center;
  justify-content:center;
  padding:0 12px;
  font-size:13px;
  font-weight:700;
  color:#50627b
}
.date-tools .ico {
  height:15px;
  width:15px
}
.date-tools .today-pill {
  background:var(--lav);
  color:var(--brand);
  border-color:#dae1f5
}
.date-tools .view-week {
  margin-left:6px;
  background:#e7f4eb;
  border-color:#d0e5d7;
  color:#477461
}
.book-pages {
  min-height:655px;
  display:grid;
  grid-template-columns:1fr 1fr
}
.page {
  padding:25px 36px 30px;
  min-width:0;
  position:relative
}
.page-left {
  background:linear-gradient(90deg,#fffdf8 97%,#f9faf9)
}
.page-right {
  background:linear-gradient(90deg,#f9fafc,#fffefa 7%)
}
.page-right:before {
  content:"";
  position:absolute;
  top:20px;
  right:24px;
  width:54px;
  height:15px;
  transform:rotate(4deg);
  background:#eddbed8c;
  z-index:0;
  clip-path:polygon(4% 0,100% 0,97% 100%,0% 100%)
}
.page>* {
  position:relative
}
.section-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0 0 13px
}
.section-heading h2 {
  font-size:19px;
  margin:0;
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:800;
  letter-spacing:-.025em
}
.section-heading h2 .ico {
  height:19px;
  width:19px;
  color:#7b88ae
}
.section-heading .mini-count {
  font-size:12px;
  background:#eef0f7;
  color:#72819a;
  border-radius:100px;
  padding:3px 10px;
  font-weight:700
}
.section-link {
  font-size:13px;
  border:none;
  background:transparent;
  color:var(--brand);
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-weight:800;
  padding:5px
}
.section-link .ico {
  height:14px;
  width:14px
}
.section-link:hover {
  text-decoration:underline
}
.section-line {
  height:1px;
  width:100%;
  margin:20px 0;
  background:repeating-linear-gradient(90deg,#d9dfe8 0 5px,transparent 5px 9px)
}
.schedule-list {
  display:flex;
  flex-direction:column;
  gap:2px
}
.schedule-item {
  width:100%;
  min-height:61px;
  display:flex;
  align-items:center;
  gap:17px;
  text-align:left;
  border:1px solid transparent;
  border-radius:11px;
  padding:8px 10px;
  background:transparent;
  position:relative
}
.schedule-item:hover,.schedule-item.selected {
  background:#f1f1fc;
  border-color:#e8e8fb
}
.schedule-time {
  align-self:stretch;
  flex:0 0 58px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  color:#6c7992;
  font-size:13px;
  font-weight:800;
  letter-spacing:.02em
}
.schedule-time:after {
  content:"";
  position:absolute;
  width:3px;
  right:0;
  top:5px;
  bottom:5px;
  border-radius:5px;
  background:#a6b3de
}
.schedule-item:nth-child(2) .schedule-time:after {
  background:#b6d6ca
}
.schedule-item:nth-child(3) .schedule-time:after {
  background:#e9c6b5
}
.schedule-item .item-main {
  min-width:0;
  flex:1
}
.item-main strong {
  display:block;
  font-size:15px;
  font-weight:700;
  line-height:1.45;
  white-space:nowrap;
  text-overflow:ellipsis;
  overflow:hidden
}
.item-main small {
  display:block;
  color:#7e8a9c;
  font-size:12px;
  margin-top:1px
}
.item-tail {
  font-size:12px;
  color:#7b8a9c;
  white-space:nowrap
}
.list-full {
  display:flex;
  justify-content:flex-end;
  margin-top:3px
}
.colored-dot {
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#8e9aca;
  margin-right:5px
}
.daily-progress {
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 2px 10px
}
.mini-progress {
  height:7px;
  background:#f0f0f3;
  overflow:hidden;
  border-radius:10px;
  flex:1
}
.mini-progress>span {
  display:block;
  background:linear-gradient(90deg,#9dc9b9,#bad6ef);
  height:100%;
  width:38%;
  border-radius:10px
}
.daily-progress .progress-label {
  font-size:12px;
  color:#698070;
  font-weight:700;
  white-space:nowrap
}
.todo-rows {
  display:flex;
  flex-direction:column;
  gap:0
}
.todo-item {
  display:flex;
  gap:11px;
  align-items:center;
  padding:9px 8px 9px 4px;
  border-bottom:1px solid #eceef0;
  min-height:50px;
  width:100%;
  background:none;
  border-top:0;
  border-left:0;
  border-right:0;
  text-align:left;
  border-radius:0;
  position:relative
}
.todo-item:hover,.todo-item.selected {
  background:#f6f6fe
}
.todo-check {
  width:21px;
  height:21px;
  flex:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1.8px solid #a8b3c5;
  border-radius:7px;
  color:#6b947a
}
.todo-item.done .todo-check {
  background:#d9eee3;
  border-color:#7ab198
}
.todo-item.done .todo-check:after {
  content:"✓";
  font-size:14px;
  font-weight:800
}
.todo-title {
  font-size:14px;
  font-weight:700;
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.todo-item.done .todo-title {
  text-decoration:line-through;
  color:#8792a2
}
.kind-label {
  font-size:11px;
  border-radius:6px;
  padding:2px 6px;
  font-weight:800;
  white-space:nowrap
}
.kind-label.shared {
  background:#e4e9fb;
  color:#6676ab
}
.kind-label.personal {
  background:#fbe7ec;
  color:#ac788b
}
.deadline {
  color:#7f8b9b;
  font-size:12px;
  white-space:nowrap;
  min-width:32px;
  text-align:right
}
.deadline.overdue {
  color:var(--danger);
  font-weight:800
}
.news-strip {
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid #eee2cb;
  background:#fff9ef;
  border-radius:12px;
  padding:13px 14px;
  margin-top:20px
}
.news-symbol {
  height:35px;
  width:35px;
  border-radius:10px;
  background:#fbe9c8;
  display:grid;
  place-items:center;
  color:#a47e4a
}
.news-strip strong {
  font-size:13px;
  display:block
}
.news-strip small {
  font-size:12px;
  color:#927d6d
}
.news-strip>.ico {
  margin-left:auto;
  color:#aa9679;
  height:17px;
  width:17px
}
.details-eyebrow {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  color:#7c8baa;
  font-size:11px;
  letter-spacing:.15em;
  font-weight:800;
  margin-bottom:14px
}
.details-eyebrow .right-label {
  color:#ab96a7;
  letter-spacing:.04em
}
.detail-title-row {
  display:flex;
  gap:10px;
  justify-content:space-between;
  align-items:flex-start
}
.detail-title {
  font-size:23px;
  line-height:1.43;
  letter-spacing:-.03em;
  font-weight:800;
  margin:0 0 8px;
  min-width:0
}
.detail-subtitle {
  font-size:13px;
  color:#798697;
  margin:0 0 17px
}
.status-badge {
  font-size:12px;
  color:#6f6da0;
  background:#eeeafa;
  white-space:nowrap;
  padding:5px 11px;
  border-radius:30px;
  font-weight:800
}
.status-badge.green {
  background:#dff3e6;
  color:var(--green)
}
.status-badge.amber {
  background:#fbedd4;
  color:#926a37
}
.detail-meta {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
  margin:0 0 19px
}
.meta-item {
  border-radius:10px;
  padding:10px 11px;
  background:#f5f6f9;
  min-height:65px
}
.meta-item span {
  display:block;
  font-size:11px;
  color:#7c879b;
  margin-bottom:3px
}
.meta-item strong {
  display:block;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}
.note-paper {
  position:relative;
  padding:18px 20px 14px 27px;
  border:1px solid #e8e1d6;
  border-radius:11px;
  background:repeating-linear-gradient(to bottom,#fffdf9 0,#fffdf9 30px,#e8edf1 31px,#fffdf9 32px);
  box-shadow:0 4px 14px #6a6a6a08;
  overflow:hidden
}
.note-paper:before {
  content:"";
  position:absolute;
  left:15px;
  top:0;
  bottom:0;
  border-left:1px solid #f0d9dc
}
.note-heading {
  font-size:14px;
  font-weight:800;
  margin-bottom:7px;
  display:flex;
  align-items:center;
  gap:8px;
  line-height:2
}
.note-heading .ico {
  width:16px;
  height:16px;
  color:#a78d91
}
.note-paper p {
  margin:0;
  line-height:2;
  font-size:14px;
  color:#485b6c
}
.note-paper ul {
  margin:4px 0 0;
  padding-left:19px;
  line-height:2.15;
  font-size:14px;
  color:#485b6c
}
.related-label {
  font-size:13px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:7px;
  margin:17px 0 9px
}
.related-label .ico {
  width:16px;
  height:16px;
  color:#8b9ab0
}
.related-box {
  display:flex;
  align-items:center;
  gap:10px;
  min-height:52px;
  border:1px solid #e6ebef;
  border-radius:11px;
  background:#fbfcff;
  padding:10px 12px
}
.related-box .ico {
  color:#8496bc
}
.related-box>div {
  flex:1;
  min-width:0
}
.related-box strong {
  display:block;
  font-size:13px;

  <script>
/**

  {id:'delivery',time:'14:30',title:'周辺機器の納品確認',sub:'システム課 · 30分',status:'予定',desc:'納品数量と管理番号を照合します。',bullets:['納品書と数量の照合','設置場所の確認'],related:'',relatedSub:''}

const tasks = [
  {id:'task1',title:'PC入替の確認リストを更新',category:'端末管理',status:'進行中',owner:'自分',due:'今日',priority:'高',detail:'各部署で確認した端末入替の結果を一覧にまとめ、未対応分を確認します。',bullets:['確認できた端末を反映する','未確認の項目に担当者を記載する','差し戻しの内容を共有する'],schedule:'11:00 PC入替後の動作確認',memo:'端末設定チェック項目',history:'今日 08:45 · 内容を更新'},
  {id:'task2',title:'各部署への連絡事項を整理',category:'連絡調整',status:'確認待ち',owner:'自分',due:'明日',priority:'中',detail:'共有事項と回答期限を整理し、確認が必要な部署へ送ります。',bullets:['連絡対象の整理','回答期限の明記'],schedule:'',memo:'部門別連絡先',history:'昨日 16:20 · 状態を変更'},
  {id:'task3',title:'発注内容の最終確認',category:'物品管理',status:'未着手',owner:'田中',due:'超過',priority:'高',detail:'物品発注内容の確認事項を整理します。',bullets:['数量と規格の確認','納品予定日の調整'],schedule:'14:30 周辺機器の納品確認',memo:'',history:'10/30 17:10 · タスク作成'},
  {id:'task4',title:'定例会議の資料をまとめる',category:'会議',status:'進行中',owner:'佐藤',due:'11/05',priority:'中',detail:'定例会議で共有する進捗資料を作成します。',bullets:['進捗表の更新','議題を確認'],schedule:'09:00 情報システム定例会議',memo:'会議の進め方',history:'昨日 14:30 · 変更を保存'},
  {id:'task5',title:'共有フォルダの整理',category:'運用',status:'完了',owner:'自分',due:'11/02',priority:'低',detail:'共同作業フォルダの構成を整理し、不要な重複を確認しました。',bullets:['旧ファイルの確認','共有先の整理'],schedule:'',memo:'共有フォルダの運用手順',history:'昨日 18:15 · 完了'},
  {id:'task6',title:'業務端末の設定手順を見直す',category:'手順',status:'未着手',owner:'自分',due:'11/06',priority:'中',detail:'端末設定のチェックポイントを整理し、必要な手順を見直します。',bullets:['既存資料の確認','設定手順の見直し'],schedule:'',memo:'端末設定チェック項目',history:'10/31 10:00 · タスク作成'}

  {id:'note1',title:'端末設定チェック項目',category:'手順',pin:true,updated:'今日 08:30',preview:'PC交換時の確認手順と、よくある見落としのメモ',paragraphs:['PC交換作業のあとに確認する基本事項をまとめています。','① 業務アプリへのサインインと画面表示','② プリンタ・スキャナなど周辺機器の接続','③ 共有フォルダとショートカットの確認','④ 確認結果を作業一覧へ記録する'],tip:'更新した内容は共有前に確認すること。'},
  {id:'note2',title:'部門別連絡先',category:'宛先・連絡先',pin:true,updated:'昨日 16:15',preview:'お問い合わせ先の区分・連絡時のポイント',paragraphs:['部署ごとの連絡方法や窓口を整理したメモです。','急ぎの用件は対応区分を明確にして連絡します。','実際の連絡先はモックに含まれていません。'],tip:'個人情報の記載は避けてください。'},
  {id:'note3',title:'会議の進め方',category:'定型情報',pin:false,updated:'11/01 11:40',preview:'議題の準備、決定事項、担当・期限の整理',paragraphs:['会議前に議題と資料を整理します。','決定事項と担当・期限を明示し、次回までの確認事項をまとめます。'],tip:'決定事項の記録は既存の運用に従ってください。'},
  {id:'note4',title:'社内参考リンク集',category:'URL・リンク',pin:false,updated:'10/30 09:10',preview:'よく利用する業務用資料への入口',paragraphs:['よく利用する公開資料のリンクを整理します。','このモックでは実際のリンク先への通信は行いません。'],tip:'URLを開く前に信頼性を確認してください。'},
  {id:'note5',title:'申し送りメモの書き方',category:'その他',pin:false,updated:'10/28 14:00',preview:'相手が判断しやすいメモのまとめ方',paragraphs:['背景、現在の状態、確認事項、次の行動の順に整理します。','長文にしすぎず、結論と担当を分かりやすく記載します。'],tip:'患者情報やパスワードは記載しないでください。'}
];
const todos = [
  {id:'td1',name:'端末設定を最終チェック',kind:'personal',due:'今日',done:false},
  {id:'td2',name:'部署への連絡内容を確認',kind:'shared',due:'今日',done:false},
  {id:'td3',name:'発注書の確認',kind:'personal',due:'超過',done:false},
  {id:'td4',name:'会議資料の下書き',kind:'shared',due:'明日',done:false},
  {id:'td5',name:'朝の動作確認',kind:'personal',due:'完了',done:true}
];
const state = {view:'today',selectToday:'meeting',selectTask:'task1',selectNote:'note1',selectTodo:'td1',filter:'all',search:'',week:false,history:false};
const $ = s=>document.querySelector(s);
const usesDetailDrawer =()=>window.matchMedia('(max-width:1199px)').matches;
function toast(text){const el=$('#toast');el.textContent=text;el.hidden=false;clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>el.hidden=true,3000)}
function titleHead(title,eyebrow,extra=''){return `<header class="book-header"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div><div class="date-tools">${extra}</div></header>`}
function pageShell(left,right){return `<div class="book-pages"><section class="page page-left">${left}</section><aside class="page page-right" aria-label="選択項目の詳細">${right}</aside></div>`}
function nav(){const navBtn=s=>`<button class="tab ${state.view===s.id?'active':''}" data-nav="${s.id}" aria-current="${state.view===s.id?'page':'false'}">${icon(s.icon)}${s.label}</button>`;$('#desktopNav').innerHTML=sections.map(navBtn).join('');$('#mobileNav').innerHTML=sections.map(s=>`<button data-nav="${s.id}" class="${state.view===s.id?'active':''}" aria-current="${state.view===s.id?'page':'false'}">${icon(s.icon)}<span>${s.id==='today'?'今日':s.label}</span></button>`).join('')}
function groupHead(name,ico,count){return `<div class="section-heading"><h2>${icon(ico)}${name}</h2><span class="mini-count">${count}</span></div>`}
function fullLink(text,view){return `<div class="list-full"><button class="section-link" data-nav="${view}">${text} ${icon('arrow')}</button></div>`}
function calendarEntry(s){return `<button class="schedule-item ${state.selectToday===s.id?'selected':''}" data-select="schedule:${s.id}" aria-pressed="${state.selectToday===s.id}"><span class="schedule-time">${s.time}</span><span class="item-main"><strong>${s.title}</strong><small>${s.sub}</small></span><span class="item-tail">${icon('chevron-right')}</span></button>`}
function todoEntry(t){return `<div class="todo-item ${t.done?'done':''} ${state.selectTodo===t.id?'selected':''}"><button type="button" class="todo-check" data-check="${t.id}" aria-label="${t.name}の完了を切替（モック）" aria-pressed="${t.done}"></button><button type="button" class="todo-open" data-select="todo:${t.id}"><span class="todo-title">${t.name}</span></button><span class="kind-label ${t.kind}">${t.kind==='shared'?'共有':'自分'}</span><span class="deadline ${t.due==='超過'?'overdue':''}">${t.due}</span></div>`}
function todayLeft(){if(state.week){return `<div class="section-heading"><h2>${icon('calendar')}11月2日〜8日</h2><span class="mini-count">7日間</span></div><div class="day-compare">${[2,3,4,5,6,7,8].map((d,i)=>`<button class="${d===3?'chosen':''}" data-week-day="${d}">${['月','火','水','木','金','土','日'][i]}<strong>${d}</strong><span>${[2,3,4,2,1,0,0][i]}件</span></button>`).join('')}</div><div class="section-line"></div>${groupHead('11月3日（火）の予定','clock','3件')}${schedules.map(calendarEntry).join('')}${fullLink('予定をすべて見る','schedule')}<div class="section-line"></div>${groupHead('今週の確認事項','check-square','4件')}${todos.filter(t=>!t.done).map(todoEntry).join('')}`}
return `${groupHead('今日の予定','calendar','3件')}
  <div class="schedule-list">${schedules.map(calendarEntry).join('')}</div>${fullLink('予定をすべて見る','schedule')}
  <div class="section-line"></div>${groupHead('次にやること','check-square','未完了 4件')}
  <div class="daily-progress"><span class="mini-progress"><span></span></span><span class="progress-label">今日の進み具合 2 / 5</span></div>
  <div class="todo-rows">${todos.filter(t=>!t.done).map(todoEntry).join('')}</div>
  ${fullLink('すべてのToDo・タスク','todo')}
  <button class="news-strip" data-notice="1" style="width:100%;text-align:left"><span class="news-symbol">${icon('bell')}</span><span><strong>お知らせを確認</strong><small>新しい更新が 2 件あります</small></span>${icon('chevron-right')}</button>`}
function detailTop(section,index){return `<div class="details-eyebrow"><span>${section}</span><span class="right-label">✦ MY WORK JOURNAL · ${index}</span></div>`}
function meta(label,text){return `<div class="meta-item"><span>${label}</span><strong>${text}</strong></div>`}
function related(iconName,title,sub){return title?`<div class="related-box">${icon(iconName)}<div><strong>${title}</strong><small>${sub}</small></div>${icon('chevron-right','link-arrow')}</div>`:`<div class="related-box"><div class="empty-related">関連する項目はありません</div></div>`}
function history(){return `<button class="history-toggle" data-history aria-expanded="${state.history}">コメント・更新履歴を ${state.history?'閉じる':'見る'}${icon('chevron-down')}</button>${state.history?'<div class="history-body"><p><b>今日 08:45</b> · 更新内容を記録</p><p><b>昨日 16:20</b> · 確認事項を追加</p></div>':''}`}
function scheduleDetails(s){return `${detailTop('SELECTED SCHEDULE','01')}<div class="detail-title-row"><h2 class="detail-title">${s.title}</h2><span class="status-badge">${s.status}</span></div><p class="detail-subtitle">${icon('clock')} ${s.time} · ${s.sub}</p><div class="detail-meta">${meta('日付','11月3日（火）')}${meta('担当','システム課')}${meta('種類','予定')}</div><div class="note-paper"><div class="note-heading">${icon('sparkle')} 会議前のメモ</div><p>${s.desc}</p><ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul></div><div class="related-label">${icon('link')}関連するタスク</div>${related('tasks',s.related,s.relatedSub)}<div class="detail-actions"><button class="btn-primary" data-demo="予定の編集">${icon('edit')}予定を編集</button><button class="btn-secondary" data-nav="tasks">${icon('tasks')}タスク一覧へ</button></div>${history()}`}
function taskStateClass(status){return status==='進行中'?'progress':status==='確認待ち'?'wait':status==='完了'?'done':'open'}
function taskDetails(t){return `${detailTop('SELECTED TASK','02')}<div class="detail-title-row"><h2 class="detail-title">${t.title}</h2><span class="status-badge ${t.status==='完了'?'green':''}">${t.status}</span></div><p class="detail-subtitle">${t.category} · 共有タスク</p><div class="detail-meta">${meta('担当',t.owner)}${meta('期限',t.due)}${meta('優先度',t.priority)}</div><div class="note-paper task-detail-note"><div class="note-heading">${icon('note')} 進め方・確認事項</div><p>${t.detail}</p><ul>${t.bullets.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="related-label">${icon('calendar')}関連する予定</div>${related('calendar',t.schedule,'2026年11月3日（火）')}<div class="related-label">${icon('note')}参考メモ</div>${related('note',t.memo,'ノート · 業務メモ')}<div class="detail-actions"><button class="btn-primary" data-demo="タスクの編集">${icon('edit')}タスクを編集</button><button class="btn-secondary" data-demo="コメントの確認">${icon('note')}コメント</button></div>${history()}`}
function noteDetails(n){return `${detailTop('OPEN NOTE','03')}<div class="detail-title-row"><h2 class="detail-title">${n.title}</h2><span class="note-category">${n.category}</span></div><p class="detail-subtitle">${n.pin?'✦ ピン留め · ':''}最終更新：${n.updated}</p><div class="note-paper paper-expanded"><span class="bookmark"></span><div class="note-heading">${icon('note')} 業務メモ</div>${n.paragraphs.map(x=>`<p>${x}</p>`).join('')}</div><div class="note-tip">✎ ${n.tip}</div><div class="section-line"></div><div class="aside-topline">${icon('sparkle')} このメモを使ってできること</div><div class="detail-actions"><button class="btn-primary" data-demo="メモからタスクを作成">${icon('plus')}このメモからタスク作成</button><button class="btn-secondary" data-demo="メモの編集">${icon('edit')}編集</button><button class="btn-secondary" data-copy-note="${n.id}">${icon('copy')}コピー</button></div><p class="fine-note" style="margin-top:20px">※ タスク作成時は既存Classicの入力画面に引き継ぐ想定です。</p>`}
function todoDetails(t){return `${detailTop('SELECTED TODO','04')}<div class="detail-title-row"><h2 class="detail-title">${t.name}</h2><span class="status-badge ${t.done?'green':''}">${t.done?'完了':'未完了'}</span></div><p class="detail-subtitle">${t.kind==='shared'?'共有タスク':'個人ToDo'} · 期限 ${t.due}</p><div class="note-paper"><div class="note-heading">${icon('sparkle')} 次のアクション</div><p>この項目の進捗や詳細を確認します。</p><p>保存・完了操作はClassicの既存処理へ接続する予定です。</p></div><div class="detail-actions"><button class="btn-primary" data-demo="ToDoの編集">${icon('edit')}内容を確認</button></div>`}
function rightContent(){if(state.view==='today'||state.view==='schedule')return scheduleDetails(schedules.find(s=>s.id===state.selectToday)||schedules[0]);if(state.view==='tasks')return taskDetails(tasks.find(t=>t.id===state.selectTask)||tasks[0]);if(state.view==='notes')return noteDetails(notes.find(n=>n.id===state.selectNote)||notes[0]);return todoDetails(todos.find(t=>t.id===state.selectTodo)||todos[0])}
function today(){const header=titleHead(state.week?'今週の手帳':'11月3日（火）の手帳','TUESDAY · NOVEMBER 03, 2026',`<button data-demo="前日へ移動" aria-label="前日">${icon('chevron-left')}</button><button class="today-pill" data-today>今日</button><button data-demo="翌日へ移動" aria-label="翌日">${icon('chevron-right')}</button><button class="view-week" data-week>${state.week?'今日を見る':'今週を見る'}</button>`);return header+pageShell(todayLeft(),rightContent())}
function taskLeft(){const term=state.search.trim().toLowerCase();const filtered=tasks.filter(t=>(state.filter==='all'||(state.filter==='incomplete'&&t.status!=='完了')||(state.filter==='completed'&&t.status==='完了'))&&(!term||`${t.title} ${t.category} ${t.owner} ${t.status}`.toLowerCase().includes(term)));return `<div class="section-heading"><h2>${icon('tasks')}共有タスク</h2><span class="mini-count">全 ${tasks.length} 件</span></div><div class="tool-row"><span class="fine-note">見たいものを、すぐ見つける。</span><label class="search-local">${icon('search')}<input class="localSearch" placeholder="タスクを検索" value="${escapeHtml(state.search)}" aria-label="タスクを検索"></label></div><div class="filters"><button class="filter-pill ${state.filter==='all'?'active':''}" data-filter="all">すべて</button><button class="filter-pill ${state.filter==='incomplete'?'active':''}" data-filter="incomplete">未完了</button><button class="filter-pill ${state.filter==='completed'?'active':''}" data-filter="completed">完了</button><span class="filter-utility">${icon('filter')} 状態・分類</span></div><div class="table-head"><span>タスク名</span><span>状態</span><span>担当</span><span>期限</span></div>${filtered.length?filtered.map(t=>`<button class="task-row ${state.selectTask===t.id?'selected':''}" data-select="task:${t.id}" aria-pressed="${state.selectTask===t.id}"><span><strong>${t.title}</strong><small>${t.category}</small></span><span><span class="state-pill ${taskStateClass(t.status)}">${t.status}</span></span><span class="cell owner">${t.owner}</span><span class="cell ${t.due==='超過'?'overdue':''}">${t.due}</span></button>`).join(''):`<div class="empty-message">${icon('search')}条件に一致するタスクはありません</div>`}<div class="table-footer"><span>${filtered.length} / ${tasks.length} 件を表示</span><button class="section-link" data-demo="タスク一覧の表示切替">ボード表示 ${icon('arrow')}</button></div>`}
function tasksPage(){return titleHead('タスクのページ','WORK LIST · SHARED TASKS',`<button class="today-pill" data-demo="タスクを作成">${icon('plus')} タスクを追加</button>`)+pageShell(taskLeft(),rightContent())}
function notesLeft(){const term=state.search.trim().toLowerCase();const filtered=notes.filter(n=>`${n.title} ${n.category} ${n.preview}`.toLowerCase().includes(term));return `<div class="section-heading"><h2>${icon('note')}業務ノート</h2><span class="mini-count">${notes.length} 件</span></div><div class="tool-row"><span class="fine-note">小さな知識も、ここに。</span><label class="search-local">${icon('search')}<input class="localSearch" placeholder="ノートを探す" value="${escapeHtml(state.search)}" aria-label="ノートを検索"></label></div><div class="filters"><button class="filter-pill active">すべてのメモ</button><button class="filter-pill" data-demo="ピン留めだけを表示">✦ ピン留め</button><span class="filter-utility">${icon('filter')} カテゴリ</span></div><div class="note-list">${filtered.length?filtered.map(n=>`<button class="note-item ${state.selectNote===n.id?'selected':''}" data-select="note:${n.id}" aria-pressed="${state.selectNote===n.id}"><span class="note-item-head"><strong>${n.title}</strong>${n.pin?icon('pin','pin'):''}<span class="note-category">${n.category}</span></span><p>${n.preview}</p></button>`).join(''):`<div class="empty-message">条件に一致するノートはありません</div>`}</div><div class="table-footer"><span>更新した順に表示</span><span>共有メモ</span></div>`}
function notesPage(){return titleHead('ノートのページ','MY MEMO COLLECTION',`<button class="today-pill" data-demo="メモを作成">${icon('plus')} メモを追加</button>`)+pageShell(notesLeft(),rightContent())}
function todoPage(){return titleHead('自分のToDo','MY LITTLE CHECKLIST',`<button class="today-pill" data-demo="個人ToDoを作成">${icon('plus')} ToDoを追加</button>`)+pageShell(`${groupHead('まだやること','check-square','4件')}<div class="todo-rows">${todos.filter(t=>!t.done).map(todoEntry).join('')}</div><div class="section-line"></div>${groupHead('最近完了したこと','check-square','1件')}<div class="todo-rows">${todos.filter(t=>t.done).map(todoEntry).join('')}</div>`,rightContent())}
function schedulePage(){return titleHead('予定のページ','WEEKLY PLANNER · NOVEMBER',`<button class="today-pill" data-demo="予定を追加">${icon('plus')} 予定を追加</button>`)+pageShell(`<div class="section-heading"><h2>${icon('calendar')}今週の予定</h2><span class="mini-count">11/2〜11/8</span></div><div class="day-compare">${[2,3,4,5,6,7,8].map((d,i)=>`<button class="${d===3?'chosen':''}" data-week-day="${d}">${['月','火','水','木','金','土','日'][i]}<strong>${d}</strong><span>${[2,3,4,2,1,0,0][i]}件</span></button>`).join('')}</div><div class="section-line"></div>${groupHead('11月3日（火）','clock','3件')}<div class="schedule-list">${schedules.map(calendarEntry).join('')}</div>`,rightContent())}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){nav();$('#appView').innerHTML=state.view==='today'?today():state.view==='tasks'?tasksPage():state.view==='notes'?notesPage():state.view==='schedule'?schedulePage():todoPage();}
function openMobileSheet(){if(!usesDetailDrawer())return;$('#mobileSheetContent').innerHTML=rightContent();$('#mobileSheet').hidden=false;$('#sheetBackdrop').hidden=false;document.body.style.overflow='hidden';$('#closeSheet').focus()}
function closeMobileSheet(){if($('#mobileSheet').hidden)return;$('#mobileSheet').hidden=true;$('#sheetBackdrop').hidden=true;document.body.style.overflow=''}
function select(type,id){state.history=false;if(type==='schedule')state.selectToday=id;if(type==='task')state.selectTask=id;if(type==='note')state.selectNote=id;if(type==='todo')state.selectTodo=id;render();openMobileSheet()}
function navigate(view){state.view=view;state.search='';state.filter='all';state.history=false;state.week=false;closeMobileSheet();$('#addMenu').hidden=true;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target){if(!e.target.closest('#addMenu'))$('#addMenu').hidden=true;return}if(target.dataset.nav){navigate(target.dataset.nav);return}if(target.dataset.select){const [type,id]=target.dataset.select.split(':');select(type,id);return}if(target.dataset.check){const t=todos.find(x=>x.id===target.dataset.check);if(t){t.done=!t.done;render();toast('チェック状態を変更しました（画面内のみ・保存されません）')}return}if(target.dataset.demo){toast(`${target.dataset.demo}：デザインモックのため保存・画面遷移は行いません`);return}if(target.dataset.filter){state.filter=target.dataset.filter;render();return}if(target.dataset.week!==undefined){state.week=!state.week;render();return}if(target.dataset.today!==undefined){state.week=false;render();return}if(target.dataset.weekDay){toast('このモックでは11月3日の表示のみ確認できます');return}if(target.dataset.history!==undefined){state.history=!state.history;if(!$('#mobileSheet').hidden){$('#mobileSheetContent').innerHTML=rightContent()}else render();return}if(target.dataset.copyNote){const n=notes.find(x=>x.id===target.dataset.copyNote);if(n){const text=n.paragraphs.join('\n');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>toast('メモをコピーしました')).catch(()=>toast('コピーできませんでした'))}else toast('この環境ではコピーに対応していません')}return}if(target.dataset.notice){toast('未読のお知らせ 2 件（サンプル表示）');return}if(!target.closest('#addMenu'))$('#addMenu').hidden=true});
$('#addBtn').addEventListener('click',e=>{e.stopPropagation();$('#addMenu').hidden=!$('#addMenu').hidden});
$('#addMenu').addEventListener('click',e=>{const button=e.target.closest('button');if(button){toast(`${button.textContent.trim()}を追加：実際の保存は行いません`);$('#addMenu').hidden=true}});
$('#noticeBtn').addEventListener('click',()=>toast('未読のお知らせが 2 件あります（サンプル）'));
$('#userBtn').addEventListener('click',()=>toast('表示設定・ルーム設定は本番Classicの既存機能と接続予定です'));
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){state.view='tasks';state.search=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.classList.contains('localSearch')){const value=e.target.value;const caret=e.target.selectionStart;state.search=value;render();const newInput=$('.localSearch');if(newInput){newInput.focus();newInput.setSelectionRange(caret,caret)}}});
$('#closeSheet').addEventListener('click',closeMobileSheet);$('#sheetBackdrop').addEventListener('click',closeMobileSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMobileSheet();$('#addMenu').hidden=true}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}});
const fromUrl=new URLSearchParams(location.search).get('view');if(sections.some(s=>s.id===fromUrl))state.view=fromUrl;
render();

</script>


<script>
/* Presentation-only visual switch; does not touch business data or Firebase. */
(()=>{
  const valid=new Set(['base','blue','cafe','glass']);
  const pick=(new URLSearchParams(location.search)).get('skin');
  const choose=skin=>{
    if(!valid.has(skin))return;
    document.documentElement.dataset.skin=skin;
    document.querySelectorAll('[data-skin-select]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.skinSelect===skin)));
  };
  document.querySelectorAll('[data-skin-select]').forEach(btn=>btn.addEventListener('click',()=>choose(btn.dataset.skinSelect)));
  choose(valid.has(pick)?pick:'base');
})();
</script>
</body>
</html>
