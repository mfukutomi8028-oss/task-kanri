  <dialog id="scheduleCopyDialog" class="dialog schedule-copy-dialog">
    <form id="scheduleCopyForm" method="dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">COPY SCHEDULE</p>
          <h2>予定をコピー</h2>
        </div>
        <button id="closeScheduleCopyDialog" class="icon-button" type="button">×</button>
      </div>

      <div class="schedule-copy-source">
        <small>コピー元</small>
        <strong id="scheduleCopySourceTitle"></strong>
        <span id="scheduleCopySourceTime"></span>
      </div>

      <div class="form-grid schedule-copy-grid">
        <label class="wide">コピー方法
          <select id="scheduleCopyMethod">
            <option value="once">1回だけ（日付指定）</option>
            <option value="dates">複数の日付を指定</option>
            <option value="daily">毎日 / N日ごと</option>
            <option value="weekdays">平日（月〜金）</option>
            <option value="weekly">毎週（曜日指定）</option>
            <option value="monthlyDay">毎月（日付指定）</option>
            <option value="monthlyNth">毎月（第n / 最終曜日）</option>
            <option value="monthEnd">毎月（月末）</option>
            <option value="lastWeekday">毎月（最終平日）</option>
            <option value="yearly">毎年（同じ月日）</option>
          </select>
        </label>

        <label id="scheduleCopyStartRow">開始日
          <input id="scheduleCopyStartDate" type="date" />
        </label>

        <label id="scheduleCopyIntervalRow">間隔
          <span class="schedule-copy-inline">
            <input id="scheduleCopyInterval" type="number" min="1" max="36" value="1" />
            <span id="scheduleCopyIntervalUnit">日ごと</span>
          </span>
        </label>

        <div id="scheduleCopyWeekdayRow" class="wide schedule-copy-option" hidden>
          <span class="mini-label">曜日</span>
          <div class="weekday-checks schedule-copy-weekdays">
            <label><input type="checkbox" data-copy-weekday value="1" />月</label>
            <label><input type="checkbox" data-copy-weekday value="2" />火</label>
            <label><input type="checkbox" data-copy-weekday value="3" />水</label>
            <label><input type="checkbox" data-copy-weekday value="4" />木</label>
            <label><input type="checkbox" data-copy-weekday value="5" />金</label>
            <label><input type="checkbox" data-copy-weekday value="6" />土</label>
            <label><input type="checkbox" data-copy-weekday value="0" />日</label>
          </div>
        </div>

        <label id="scheduleCopyMonthDayRow" hidden>毎月の日付
          <input id="scheduleCopyMonthDay" type="number" min="1" max="31" value="1" />
        </label>

        <div id="scheduleCopyNthRow" class="wide schedule-copy-nth" hidden>
          <label>週
            <select id="scheduleCopyNth">
              <option value="1">第1</option>
              <option value="2">第2</option>
              <option value="3">第3</option>
              <option value="4">第4</option>
              <option value="5">第5</option>
              <option value="last">最終</option>
            </select>
          </label>
          <label>曜日
            <select id="scheduleCopyNthWeekday">
              <option value="1">月曜日</option>
              <option value="2">火曜日</option>
              <option value="3">水曜日</option>
              <option value="4">木曜日</option>
              <option value="5">金曜日</option>
              <option value="6">土曜日</option>
              <option value="0">日曜日</option>
            </select>
          </label>
        </div>

        <div id="scheduleCopyDatesRow" class="wide schedule-copy-option" hidden>
          <span class="mini-label">コピーする日</span>
          <div class="schedule-copy-date-adder">
            <input id="scheduleCopyDateInput" type="date" />
            <button id="scheduleCopyAddDate" class="ghost-button" type="button">＋ 日付を追加</button>
          </div>
          <div id="scheduleCopyDateList" class="schedule-copy-date-list" aria-live="polite"></div>
        </div>

        <div id="scheduleCopyEndRow" class="wide schedule-copy-end" hidden>
          <label>終了条件
            <select id="scheduleCopyEndMode">
              <option value="count">回数で終了</option>
              <option value="date">終了日まで</option>
            </select>
          </label>
          <label id="scheduleCopyCountRow">コピー件数
            <input id="scheduleCopyCount" type="number" min="1" max="200" value="4" />
          </label>
          <label id="scheduleCopyEndDateRow" hidden>終了日
            <input id="scheduleCopyEndDate" type="date" />
          </label>
        </div>
      </div>

      <div class="schedule-copy-preview">
        <div>
          <small>作成予定</small>
          <strong id="scheduleCopyPreviewSummary">コピー先を指定してください</strong>
        </div>
        <div id="scheduleCopyPreviewDates" class="schedule-copy-preview-dates"></div>
        <p id="scheduleCopyPreviewNote"></p>
      </div>

      <div class="dialog-actions">
        <button id="scheduleCopyBack" class="ghost-button" type="button">戻る</button>
        <button id="scheduleCopySubmit" class="primary-button" type="submit">コピーする</button>
      </div>
    </form>
  </dialog>
