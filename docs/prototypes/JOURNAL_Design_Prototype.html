<!doctype html>
<html lang="ja" data-theme="linen">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOURNAL | 業務管理ボード UIデザイン</title>
<style>
:root {
 --bg:#eceae4; --surface:#f4f1ea; --paper:#fffef9; --ink:#242b32; --muted:#526068; --accent:#2f6170;
 --accent-soft:#e7f0ef; --tab:#dedbd3; --line:#dedbd1; --header:#243942; --header-text:#ffffff;
 --tag-bg:#f0f1ed; --note:#f7f3e9; --note-edge:#e1dacd; --ring:#c8bca8; --shadow:rgba(40,45,48,.13);
 --serif:"Noto Serif CJK JP","Yu Mincho",serif; --sans:"Noto Sans CJK JP","Yu Gothic",system-ui,sans-serif;
 --danger:#b64240; --danger-soft:#fcebe7; --orange:#9b6420; --orange-soft:#f9efdf; --success:#336d50;
 --round:8px; --card-round:10px; --page-gap:0px;
}
html[data-theme="margin"] {
 --bg:#e9eee7; --surface:#e9ede4; --paper:#fffdf6; --ink:#263633; --muted:#56665b; --accent:#2e6c5f;
 --accent-soft:#e3eee5; --tab:#dfe8d8; --line:#d9dfd2; --header:#30463f; --tag-bg:#ecf1e6;
 --note:#fff0d8; --note-edge:#e9d9be; --ring:#b98f79; --shadow:rgba(53,70,61,.12);
 --round:15px; --card-round:17px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 14px/1.55 var(--sans);background:radial-gradient(ellipse at 10% 10%,rgba(255,255,255,.72),transparent 34%),var(--bg);min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #db9b47;outline-offset:3px}
.topbar{background:var(--header);color:var(--header-text);border-bottom:1px solid rgba(255,255,255,.16)}
.topbar-inner{max-width:1450px;margin:auto;padding:14px 24px;min-height:74px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap;min-width:0}
.brand-mark{height:42px;width:42px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.46);border-radius:11px}
.brand-mark svg{height:24px;width:24px}
.brand-copy{line-height:1.25}
.brand-name{font-weight:800;font-size:14px;letter-spacing:.025em}
.brand-sub{font-size:10px;letter-spacing:.18em;opacity:.72;margin-top:3px}
.top-divider{width:1px;height:36px;background:rgba(255,255,255,.23);flex-shrink:0}
.top-journal{display:flex;align-items:center;gap:11px}
.top-journal strong{font:600 22px/1 var(--serif);letter-spacing:.08em}
.top-journal span{font-size:11px;opacity:.75;white-space:nowrap}
.top-spacer{flex:1}
.date-nav{display:flex;align-items:center;gap:10px;white-space:nowrap;border:1px solid rgba(255,255,255,.24);border-radius:28px;padding:3px 7px}
.date-nav strong{font-size:12px;font-weight:600}
.icon-button{border:none;background:transparent;color:inherit;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px}
.icon-button:hover{background:rgba(127,127,127,.12)}
.topbar .icon-button:hover{background:rgba(255,255,255,.17)}
.ico{display:inline-block;width:18px;height:18px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none;vertical-align:middle}
.ico.sm{width:15px;height:15px}
.ico.lg{width:23px;height:23px}
.top-tools{display:flex;align-items:center;gap:4px}
.search-box{border-radius:11px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;gap:6px;padding:0 10px;height:37px;color:rgba(255,255,255,.88)}
.search-box input{background:transparent;border:0;outline:0;width:140px;color:white;font-size:12px}
.search-box input::placeholder{color:rgba(255,255,255,.75)}
.user-avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:11px;font-weight:800;border:1px solid rgba(255,255,255,.23)}
.theme-select{background:rgba(255,255,255,.14);color:white;border:1px solid rgba(255,255,255,.27);padding:7px 24px 7px 11px;border-radius:10px;outline-offset:2px;font-size:12px;font-weight:700}
.theme-select option{background:white;color:#263633}
.utility-bell{position:relative}
.utility-bell:after{content:"";height:6px;width:6px;border-radius:50%;background:#ebaa8a;position:absolute;top:6px;right:7px}
.main-wrap{max-width:1320px;margin:auto;padding:8px 20px 24px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 5px 8px}
.intro-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.intro-label strong{letter-spacing:.06em;color:var(--ink)}
.intro-meta{font-size:11px;color:var(--muted)}
.main-nav{display:flex;align-items:end;gap:5px;padding:0 18px 0 20px;overflow-x:auto;scrollbar-width:none;position:relative;z-index:2}
.main-nav::-webkit-scrollbar{display:none}
.nav-tab{display:flex;align-items:center;justify-content:center;gap:8px;flex:0 0 auto;min-width:108px;padding:13px 17px 11px;color:var(--muted);font-weight:700;background:var(--tab);border:1px solid var(--line);border-bottom:0;border-radius:13px 13px 0 0;box-shadow:0 -2px 8px rgba(0,0,0,.025)}
.nav-tab .ico{width:16px;height:16px}
.nav-tab[data-page="today"]{min-width:125px}
.nav-tab.is-active{background:var(--paper);color:var(--accent);padding-top:15px;border-color:var(--line);box-shadow:0 -5px 14px rgba(28,44,44,.06);transform:translateY(1px);z-index:1}
html[data-theme="margin"] .nav-tab:not(.is-active){border-color:transparent}
html[data-theme="margin"] .nav-tab[data-page="week"]{background:#efdcd2}
html[data-theme="margin"] .nav-tab[data-page="todos"]{background:#e7e0ed}
html[data-theme="margin"] .nav-tab[data-page="tasks"]{background:#f1dfb8}
html[data-theme="margin"] .nav-tab[data-page="schedule"]{background:#e8ddd5}
html[data-theme="margin"] .nav-tab[data-page="memo"]{background:#dce6dc}
html[data-theme="margin"] .nav-tab.is-active{background:var(--paper)}
.nav-new{margin-left:auto;border:0;border-radius:13px 13px 0 0;background:var(--accent);color:white;display:flex;align-items:center;justify-content:center;gap:6px;min-width:113px;padding:13px 15px;font-weight:700}
.book{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:682px;background:var(--paper);border:1px solid var(--line);border-radius:7px 15px 17px 7px;box-shadow:0 10px 14px var(--shadow),0 28px 50px rgba(41,46,43,.095);overflow:hidden;isolation:isolate}
.book:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;background-image:linear-gradient(90deg,rgba(110,97,80,.034),transparent 12%,transparent 88%,rgba(110,97,80,.03));z-index:-1}
.paper{position:relative;padding:27px 35px 24px;min-width:0;min-height:680px}
.paper-left{border-right:1px solid var(--line)}
.paper-left:after{content:"";pointer-events:none;position:absolute;right:0;top:0;bottom:0;width:16px;background:linear-gradient(90deg,transparent,rgba(55,46,37,.055))}
.paper-right:before{content:"";pointer-events:none;position:absolute;left:0;top:0;bottom:0;width:16px;background:linear-gradient(90deg,rgba(55,46,37,.05),transparent)}
.binding{pointer-events:none;position:absolute;z-index:2;left:calc(50% - 8px);top:15%;height:70%;display:flex;flex-direction:column;justify-content:space-around;opacity:.65}
.binding span{width:16px;height:10px;border:2px solid var(--ring);border-radius:50%;box-shadow:1px 1px 2px rgba(0,0,0,.07)}
html[data-theme="linen"] .binding{opacity:.34}
html[data-theme="margin"] .binding span{width:18px;height:12px}
html[data-theme="margin"] .paper-right:after{content:"";position:absolute;width:72px;height:15px;right:46px;top:7px;border-radius:2px;transform:rotate(4deg);background:#e5b9a4;opacity:.43;pointer-events:none}
.paper-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.17em;color:var(--accent);font-weight:800;display:flex;align-items:center;gap:7px}
.page-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.date-heading{display:flex;align-items:baseline;gap:18px;margin-top:7px;margin-bottom:6px}
.date-heading h1{font:500 44px/1.3 var(--serif);letter-spacing:-.05em;margin:0;white-space:nowrap}
.date-heading h1 span{font-size:15px;margin:0 6px 0 2px;letter-spacing:0}
.date-heading h1 small{font:500 17px/1.2 var(--sans);letter-spacing:0;margin-left:4px}
.date-heading .today-mark{font-weight:800;font-size:10px;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(50,100,90,.1);border-radius:99px;padding:4px 10px;white-space:nowrap}
.hero-sub{margin:0 0 14px;color:var(--muted);font-size:12px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:23px 0 12px}
.section-heading h2{font-weight:800;font-size:17px;line-height:1.35;margin:0;display:flex;align-items:center;gap:9px}
.section-heading .eyebrow{font-size:10px;letter-spacing:.08em;color:var(--muted)}
.section-heading .sub-count{font-size:11px;font-weight:700;color:var(--muted);margin-left:6px}
.section-heading .heading-actions{display:flex;align-items:center;gap:5px}
.action{border:1px solid var(--line);background:var(--paper);padding:7px 10px;min-height:32px;display:inline-flex;align-items:center;gap:5px;border-radius:9px;color:var(--accent);font-weight:700;font-size:11px}
.action:hover{background:var(--accent-soft)}
.action-primary{background:var(--accent);color:white;border-color:var(--accent)}
.action-primary:hover{background:var(--header)}
.muted-link{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:11px;padding:7px 3px;display:inline-flex;align-items:center;gap:5px}
.timeline{position:relative;padding:2px 0}
.schedule-row{display:grid;grid-template-columns:50px 17px minmax(0,1fr) auto;align-items:center;column-gap:11px;min-height:66px;border-bottom:1px solid var(--line);position:relative}
.schedule-row:last-child{border-bottom:0}
.schedule-time{font-weight:800;font-size:13px;letter-spacing:.01em}
.timeline-track{display:flex;align-items:center;justify-content:center;height:100%;position:relative}
.timeline-track:before{content:"";background:var(--line);width:1px;height:calc(100% + 1px);position:absolute;top:0;left:50%}
.timeline-track:after{content:"";height:8px;width:8px;border:2px solid var(--accent);background:var(--paper);border-radius:50%;position:relative}
.schedule-name{font-weight:700;font-size:12.5px;line-height:1.45}
.schedule-sub{font-size:10px;color:var(--muted);margin-top:3px}
.sem-tag{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;align-self:center;border-radius:6px;padding:4px 8px;font-weight:700;font-size:10px;line-height:1.3;color:var(--accent);background:var(--accent-soft)}
.sem-tag.orange{color:var(--orange);background:var(--orange-soft)}
.sem-tag.red{color:var(--danger);background:var(--danger-soft)}
.sem-tag.gray{color:var(--muted);background:var(--tag-bg)}
.overline{height:1px;background:var(--line);margin-top:10px}
.weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.day-tile{border:1px solid var(--line);background:rgba(255,255,255,.18);border-radius:10px;min-height:64px;padding:7px 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;color:var(--ink)}
.day-tile b{font-size:10px;color:var(--muted);font-weight:700}
.day-tile strong{font-family:var(--serif);font-size:17px;font-weight:500;line-height:1.15}
.day-tile .dot{width:4px;height:4px;background:var(--accent);border-radius:50%;display:block}
.day-tile.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.day-tile.active b{color:var(--accent)}
.day-tile.weekend b{color:#a25a51}
.week-foot{font-size:10px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:5px}
.page-number{font-family:var(--serif);font-size:12px;color:var(--muted)}
.page-bottom{display:flex;align-items:center;justify-content:space-between;color:var(--muted);margin-top:22px;padding-top:11px;border-top:1px solid var(--line);font-size:10px}
.metric-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--card-round);margin:14px 0 18px;overflow:hidden}
.metric{padding:10px 11px;background:rgba(255,255,255,.13);border-right:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:4px}
.metric:last-child{border:0}
.metric .name{font-size:10px;color:var(--muted)}
.metric strong{font:700 21px/1.3 var(--serif)}
.metric.alert strong{color:var(--danger)}
.todo-list{display:flex;flex-direction:column}
.todo-row{display:flex;align-items:center;gap:11px;padding:10px 2px;min-height:52px;border-bottom:1px solid var(--line)}
.todo-check{height:22px;width:22px;border:1.7px solid var(--accent);background:transparent;color:transparent;border-radius:5px;display:grid;place-items:center;padding:0;flex-shrink:0}
.todo-row.is-done .todo-check{color:white;background:var(--accent)}
.todo-row .todo-main{min-width:0;flex:1}
.todo-row .todo-title{font-size:12.5px;font-weight:700;line-height:1.4}
.todo-row .todo-meta{font-size:10px;color:var(--muted);margin-top:3px}
.todo-row.is-done .todo-title{text-decoration:line-through;color:var(--muted);font-weight:400}
.todo-row .sem-tag{margin-left:auto}
.urgent-flag{display:inline-flex;align-items:center;gap:4px;color:var(--danger);font-size:10px;font-weight:800}
.memo-box{padding:14px 16px 13px;background:var(--note);border:1px solid var(--note-edge);border-radius:var(--card-round);margin-top:9px;position:relative}
html[data-theme="margin"] .memo-box:before{content:"";position:absolute;width:38px;height:14px;top:-8px;left:22px;transform:rotate(-8deg);background:#b7cbb7;opacity:.75}
.memo-box p{margin:7px 0 0;font-size:12px;color:var(--ink);line-height:1.65}
.memo-box .memo-label{font-size:10px;letter-spacing:.12em;font-weight:800;color:var(--accent)}
.memo-box .memo-meta{margin-top:10px;font-size:10px;color:var(--muted)}
.highlight-rule{background:linear-gradient(transparent 70%,rgba(171,143,100,.2) 70%)}
.small-note{font-size:11px;color:var(--muted);line-height:1.6}
.week-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.week-card{border:1px solid var(--line);border-radius:var(--card-round);padding:13px;background:rgba(255,255,255,.18);min-height:102px}
.week-card strong{font-size:12px;display:flex;align-items:center;justify-content:space-between}
.week-card p{font-size:11px;margin:8px 0 0;color:var(--muted)}
.list-issue{display:flex;align-items:center;gap:11px;padding:13px 4px;border-bottom:1px solid var(--line)}
.issue-number{font:500 20px/1 var(--serif);color:var(--accent);min-width:25px}
.issue-content{flex:1}
.issue-content strong{font-size:12.5px}
.issue-content p{margin:4px 0 0;color:var(--muted);font-size:11px}
.detail-card{border:1px solid var(--line);border-radius:var(--card-round);padding:17px;background:rgba(255,255,255,.18);margin-top:14px}
.detail-card h3{margin:0 0 11px;font-size:16px}
.detail-row{display:grid;grid-template-columns:93px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}
.detail-row:last-child{border-bottom:0}
.detail-row b{font-weight:600;color:var(--muted)}
.detail-row span{font-weight:700}
.paper-list{display:flex;flex-direction:column}
.paper-item{padding:15px 8px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center}
.paper-item .item-block{flex:1}
.paper-item strong{font-size:12.5px}
.paper-item p{margin:5px 0 0;font-size:11px;color:var(--muted)}
.paper-item.selected{background:var(--accent-soft);border-radius:var(--round);border-bottom:0;margin-bottom:2px}
.tag-chip{display:inline-block;font-size:10px;color:var(--accent);background:var(--accent-soft);padding:4px 7px;border-radius:5px}
.category-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.category-tabs button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:7px 11px;border-radius:8px;font-size:11px}
.category-tabs button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.design-footer{max-width:1320px;margin:10px auto 25px;padding:0 26px;font-size:10px;line-height:1.5;color:var(--muted);display:flex;gap:12px;justify-content:space-between}
.mobile-bottom{display:none}
.mobile-hint{display:none}
html[data-theme="margin"] .date-heading h1{font-weight:600}
html[data-theme="margin"] .section-heading h2:after{content:"";height:5px;width:21px;background:#d1ac84;border-radius:99px;transform:rotate(-6deg)}
html[data-theme="margin"] .day-tile{border-radius:13px}
html[data-theme="margin"] .memo-box{transform:rotate(-.4deg)}
html[data-theme="margin"] .todo-check{border-radius:7px}
html[data-theme="margin"] .metric{background:rgba(237,243,231,.25)}
@media (max-width:1160px){
 .topbar-inner{gap:11px;padding:13px 17px}
 .top-journal span{display:none}
 .search-box input{width:85px}
 .paper{padding:25px 24px}
 .nav-tab{min-width:92px;padding-left:12px;padding-right:12px}
 .main-wrap{padding:6px 14px 20px}
 .schedule-row{column-gap:6px}
 .schedule-name{font-size:12px}
}
@media (max-width:840px){
 .brand-sub,.top-divider,.search-box,.top-journal span,.intro-meta{display:none}
 .brand-name{font-size:12px}
 .topbar-inner{min-height:61px}
 .top-journal strong{font-size:18px}
 .date-nav{display:none}
 .paper{padding:20px}
 .date-heading h1{font-size:32px}
 .date-heading h1 small{font-size:13px}
 .metric{padding:8px}
 .metric strong{font-size:18px}
 .section-heading h2{font-size:15px}
 .nav-tab{min-width:81px;font-size:12px;padding:11px}
 .nav-new{min-width:86px;font-size:12px}
}
@media (max-width:700px){
 body{font-size:14px}
 .topbar-inner{height:61px;padding:8px 13px;gap:9px}
 .brand-mark{height:32px;width:32px;border-radius:9px}
 .brand-mark svg{width:20px;height:20px}
 .brand-name{font-size:11px;white-space:nowrap}
 .top-journal strong{font-size:17px}
 .top-tools{margin-left:auto;gap:0}
 .top-tools .desktop-icon,.user-avatar{display:none}
 .theme-select{padding:6px 5px;border-radius:8px;font-size:11px;max-width:71px}
 .icon-button{width:33px;height:33px}
 .main-wrap{padding:8px 11px 92px}
 .topline{padding:4px 4px 10px}
 .intro-label{font-size:10px}
 .intro-meta{display:none}
 .main-nav{padding:0 8px;gap:4px;margin-bottom:0}
 .nav-tab{min-width:68px;padding:10px 9px 9px;gap:4px;border-radius:10px 10px 0 0;font-size:11px}
 .nav-tab .ico{display:none}
 .nav-tab[data-page="today"]{min-width:71px}
 .nav-new{display:none}
 .book{display:block;border-radius:5px 12px 13px 5px;min-height:0;box-shadow:0 8px 14px var(--shadow),0 14px 30px rgba(40,50,45,.045)}
 .binding{display:none}
 .paper{padding:19px 19px 18px;min-height:auto}
 .paper-left{border-right:0}
 .paper-left:after,.paper-right:before,.paper-right:after{display:none}
 .paper-right{border-top:1px dashed var(--line);padding-top:13px}
 .paper-kicker{font-size:9px}
 .date-heading{margin-top:6px;margin-bottom:3px}
 .date-heading h1{font-size:36px}
 .date-heading h1 span{font-size:13px;margin-right:4px}
 .date-heading h1 small{font-size:13px}
 .hero-sub{font-size:11px;margin-bottom:8px}
 .section-heading{margin:15px 0 8px}
 .section-heading h2{font-size:15px}
 .schedule-row{grid-template-columns:45px 14px minmax(0,1fr) auto;min-height:52px;column-gap:6px}
 .schedule-time{font-size:12px}
 .schedule-name{font-size:11.5px}
 .schedule-sub{font-size:9px}
 .sem-tag{font-size:9px;padding:4px 5px}
 .schedule-row.mobile-optional{display:none}
 .weekdays{gap:4px;margin-top:10px}
 .day-tile{min-height:53px}
 .day-tile strong{font-size:15px}
 .day-tile b{font-size:9px}
 .week-foot{font-size:9px}
 .metric-strip{margin:5px 0 9px}
 .metric{padding:8px}
 .metric .name{font-size:9px}
 .metric strong{font-size:17px}
 .todo-row{min-height:48px;padding:9px 1px}
 .todo-title{font-size:11.5px!important}
 .todo-row .todo-meta{font-size:9px}
 .todo-check{height:21px;width:21px}
 .memo-box{padding:12px 13px}
 .paper-right .paper-kicker,.paper-left .page-bottom{display:none}
 .paper-right .page-bottom{margin-top:15px}

 el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true;},2800);
}
function setPage(next){
 page=routes[next]?next:'today';render();try{var url=new URL(location.href);url.searchParams.set('page',page);history.replaceState(null,'',url.href);}catch(e){}
 window.scrollTo({top:0,behavior:'instant'});
}
function setTheme(next){
 theme=next==='margin'?'margin':'linen';render();try{var url=new URL(location.href);url.searchParams.set('theme',theme);history.replaceState(null,'',url.href);}catch(e){}
}
function render(){
 document.documentElement.dataset.theme=theme;
 byId('themeSelect').value=theme;
 byId('themeName').textContent=theme==='margin'?'Margin':'Linen';
 byId('themeTagline').textContent=theme==='margin'?'少し遊び心のある、仕事の手帳':'仕事を整える、大人の手帳';
 var output=routes[page]();
 byId('leftPageContent').innerHTML=output[0];
 byId('rightPageContent').innerHTML=output[1];
 document.querySelectorAll('[data-page]').forEach(function(b){
  var active=b.dataset.page===page;
  b.classList.toggle('is-active',active);
  if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
 });
 document.title='JOURNAL '+(theme==='margin'?'Margin':'Linen')+' / '+pageNames[page]+' - 業務管理ボード';
}
byId('brandIcon').innerHTML=icon('book');
byId('searchIcon').innerHTML=icon('search',true);
byId('introIcon').innerHTML=icon('book',true);
byId('bellButton').innerHTML=icon('bell');
byId('settingsButton').innerHTML=icon('settings');
byId('navPrev').innerHTML=icon('left');
byId('navNext').innerHTML=icon('right');
document.querySelectorAll('[data-icon]').forEach(function(el){el.innerHTML=icon(el.dataset.icon);});
bindEvents();render();
})();
</script>
