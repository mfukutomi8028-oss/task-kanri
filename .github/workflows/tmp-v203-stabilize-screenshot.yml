name: Temporary Ver.203 visual regression stabilization

on:
  push:
    branches:
      - refactor/mobile-schedule-label-v203

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mobile-schedule-label-v203
      - name: Stabilize schedule screenshot date
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/workspace-density-v188.spec.mjs')
          text = p.read_text(encoding='utf-8')
          anchor = '''async function stabilizeTodayActivityTimestamp(page) {\n  await page.evaluate(() => {\n    const node = document.querySelector('#todayView .activity-empty p');\n    if (!node) return;\n    const text = String(node.textContent || '');\n    if (text.startsWith('最終確認：')) node.textContent = '最終確認：09/12 00:00';\n  });\n}\n\n'''
          addition = '''async function stabilizeScheduleDateLabel(page) {\n  await page.evaluate(() => {\n    const node = document.querySelector('#scheduleView .schedule-date-v176 .schedule-range-label');\n    if (!node) return;\n    node.textContent = String(node.textContent || '')\n      .replace(/\\b\\d{4}-\\d{2}-\\d{2}\\b/g, '2026-09-12')\n      .replace(/\\b\\d{2}-\\d{2}\\b/g, '09-12')\n      .replace(/\\b\\d{1,2}\\/\\d{1,2}\\b/g, '09/12');\n  });\n}\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one Today stabilizer anchor, got {text.count(anchor)}')
          if 'stabilizeScheduleDateLabel' in text:
              raise SystemExit('schedule date stabilizer already present')
          text = text.replace(anchor, anchor + addition, 1)
          shot_anchor = '''    await assertNoHorizontalOverflow(page, `${viewport.name} schedule`);\n    await expect(scheduleHead).toHaveScreenshot(\n'''
          shot_new = '''    await assertNoHorizontalOverflow(page, `${viewport.name} schedule`);\n    await stabilizeScheduleDateLabel(page);\n    await expect(scheduleHead).toHaveScreenshot(\n'''
          if text.count(shot_anchor) != 1:
              raise SystemExit(f'expected one schedule screenshot anchor, got {text.count(shot_anchor)}')
          text = text.replace(shot_anchor, shot_new, 1)
          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/tmp-v203-stabilize-screenshot.yml').unlink()
      - name: Commit stabilization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/workspace-density-v188.spec.mjs .github/workflows/tmp-v203-stabilize-screenshot.yml
          git commit -m "test: stabilize schedule visual date across days"
          git push origin HEAD:refactor/mobile-schedule-label-v203
