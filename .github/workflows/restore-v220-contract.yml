name: Restore Ver220 release contract
on:
  push:
    branches: [cleanup/stable-today-retirement-v220]
    paths: [.github/workflows/restore-v220-contract.yml]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/stable-today-retirement-v220
          fetch-depth: 0
      - name: Restore main contract and apply only stable-retirement delta
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          original = subprocess.check_output(['git','show','origin/main:test-harness/release-contract.test.mjs'], text=True)
          before = """  assert.ok(scripts.indexOf(consolidatedName) < scripts.indexOf('stable-fixes-v108.js'),\n    'sidebar v181 must remain at the former sidebar-script position before legacy foundation patches');"""
          after = """  assert.ok(scripts.indexOf(consolidatedName) < scripts.indexOf('date-keyboard-fix-v127.js'),\n    'sidebar v181 must remain before the active foundation patches after stable retirement');\n  assert.ok(!scripts.includes('stable-fixes-v108.js'), 'retired stable must not remain dynamically active');\n  assert.ok(!required.includes('stable-fixes-v108.js'), 'retired stable must not remain required');\n  assert.ok(fs.existsSync(path.join(ROOT, 'stable-fixes-v108.js')), 'retired stable remains physically available for cached manifests');"""
          if original.count(before) != 1:
              raise SystemExit('expected one stable order contract target')
          Path('test-harness/release-contract.test.mjs').write_text(original.replace(before, after), encoding='utf-8')
      - name: Commit restored contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-harness/release-contract.test.mjs
          git rm .github/workflows/restore-v220-contract.yml
          git commit -m "Ver.220 release contractを既存網維持で更新"
          git push origin HEAD:cleanup/stable-today-retirement-v220
