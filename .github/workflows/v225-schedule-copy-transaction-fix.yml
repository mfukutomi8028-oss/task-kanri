name: Ver225 fix schedule copy transaction scope

on:
  push:
    branches:
      - feature/schedule-copy-v225

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply focused transaction fix
        run: |
          python .github/scripts/v225-fix-schedule-copy.py
          node --check app.js
          git diff --check

      - name: Commit verified fix and remove temporary files
        run: |
          rm .github/workflows/v225-schedule-copy-transaction-fix.yml
          rm .github/scripts/v225-fix-schedule-copy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Ver.225 予定コピーtransactionを予定コレクションに限定"
          git push origin HEAD:feature/schedule-copy-v225
