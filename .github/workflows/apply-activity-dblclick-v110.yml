name: Apply activity double-click and version v110

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-activity-dblclick-v110.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply activity double-click and version update
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('app.js')
          source = app_path.read_text(encoding='utf-8')

          old = '''function bindActivityItemActions(root) {
            root.querySelectorAll("[data-activity-task]").forEach(button => {
              button.addEventListener("click", () => {
                const task = state.tasks.find(item => item.id === button.dataset.activityTask);
                if (!task) return;
                if (elements.activityDialog?.open) elements.activityDialog.close();
                // 今日ビューを維持したまま、通常のタスクカードと同じ詳細表示だけを行う。
                selectTask(task.id);
              });
            });
          '''

          new = '''function bindActivityItemActions(root) {
            root.querySelectorAll("[data-activity-task]").forEach(button => {
              button.addEventListener("click", () => {
                if (button.__activityClickTimer) clearTimeout(button.__activityClickTimer);
                button.__activityClickTimer = setTimeout(() => {
                  button.__activityClickTimer = null;
                  const task = state.tasks.find(item => item.id === button.dataset.activityTask);
                  if (!task) return;
                  if (elements.activityDialog?.open) elements.activityDialog.close();
                  selectTask(task.id);
                }, 220);
              });

              button.addEventListener("dblclick", event => {
                event.preventDefault();
                event.stopPropagation();
                if (button.__activityClickTimer) {
                  clearTimeout(button.__activityClickTimer);
                  button.__activityClickTimer = null;
                }
                const task = state.tasks.find(item => item.id === button.dataset.activityTask);
                if (!task) return;
                if (elements.activityDialog?.open) elements.activityDialog.close();
                openTaskEditorById(task.id);
              });
            });
          '''

          if old not in source:
              raise SystemExit('Target activity handler was not found.')
          app_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('?v=108', '?v=110')
          index = index.replace('app.js?v=109', 'app.js?v=110')
          index = index.replace('Ver.108', 'Ver.110')
          index_path.write_text(index, encoding='utf-8')

          config_path = Path('config.js')
          config = config_path.read_text(encoding='utf-8')
          config = config.replace('// v108:', '// v110:', 1)
          config = config.replace('const VERSION = "108";', 'const VERSION = "110";', 1)
          config = config.replace('mobile-base-v108', 'mobile-base-v110')
          config = config.replace('stable-v108', 'stable-v110')
          config_path.write_text(config, encoding='utf-8')

          stable_path = Path('stable-fixes-v108.js')
          stable = stable_path.read_text(encoding='utf-8')
          stable = stable.replace('// v108:', '// v110:', 1)
          stable = stable.replace('const VERSION = "108";', 'const VERSION = "110";', 1)
          stable_path.write_text(stable, encoding='utf-8')

          mobile_path = Path('mobile-fixes.js')
          mobile = mobile_path.read_text(encoding='utf-8')
          mobile = mobile.replace('// v108:', '// v110:', 1)
          mobile = mobile.replace('const VERSION = "108";', 'const VERSION = "110";', 1)
          mobile_path.write_text(mobile, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html config.js stable-fixes-v108.js mobile-fixes.js
          git commit -m "Add activity double-click editing and bump to v110"
          git push
