name: Ver225 apply schedule canonical patch
on:
  push:
    branches:
      - cleanup/schedule-today-lock-canonical-v225
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate Today schedule lifecycle into app
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '  startScheduleReminderWatcher();\n  showUserDialogIfNeeded();',
              '  startScheduleReminderWatcher();\n  startScheduleTodayLifecycle();\n  showUserDialogIfNeeded();',
              'init lifecycle hook'
          )

          replace_once(
              '    renderScheduleView(getFilteredSchedules());',
              '    syncScheduleTodayAnchor({ renderIfChanged: false });\n    renderScheduleView(getFilteredSchedules());',
              'schedule render anchor sync'
          )

          replace_once(
              '<button type="button" class="schedule-range ${state.scheduleRange === "week" ? "active" : ""}" data-schedule-range="week">7日間</button>',
              '<button type="button" class="schedule-range ${state.scheduleRange === "week" ? "active" : ""}" data-schedule-range="week" title="今日から7日間を表示します">7日間</button>',
              'week label title'
          )

          replace_once(
              '''      state.scheduleRange = button.dataset.scheduleRange;
      if (state.scheduleRange !== "month" && state.scheduleDisplayMode === "calendar") state.scheduleDisplayMode = "list";
      localStorage.setItem(scheduleRangeKey(), state.scheduleRange);
      localStorage.setItem(scheduleDisplayModeKey(), state.scheduleDisplayMode);
      render();''',
              '''      state.scheduleRange = button.dataset.scheduleRange;
      if (state.scheduleRange === "today") {
        state.scheduleAnchor = todayISO();
        localStorage.setItem(scheduleAnchorKey(), state.scheduleAnchor);
      }
      if (state.scheduleRange !== "month" && state.scheduleDisplayMode === "calendar") state.scheduleDisplayMode = "list";
      localStorage.setItem(scheduleRangeKey(), state.scheduleRange);
      localStorage.setItem(scheduleDisplayModeKey(), state.scheduleDisplayMode);
      render();''',
              'range handler today anchor'
          )

          old_move = '''function moveScheduleAnchor(direction) {
  if (direction === "today") {
    state.scheduleAnchor = todayISO();
  } else {
    const base = getScheduleAnchorDate();
    if (state.scheduleRange === "month") {
      state.scheduleAnchor = toISODate(addMonths(startOfMonth(base), direction === "next" ? 1 : -1));
    } else if (state.scheduleRange === "week") {
      state.scheduleAnchor = toISODate(addDays(base, direction === "next" ? 7 : -7));
    } else {
      state.scheduleAnchor = toISODate(addDays(base, direction === "next" ? 1 : -1));
    }
  }
  localStorage.setItem(scheduleAnchorKey(), state.scheduleAnchor);
  render();
}'''

          new_move = '''function syncScheduleTodayAnchor(options = {}) {
  const { renderIfChanged = true } = options;
  if (state.layout !== "schedule" || state.scheduleRange !== "today") return false;
  const today = todayISO();
  if (state.scheduleAnchor === today) return false;
  state.scheduleAnchor = today;
  localStorage.setItem(scheduleAnchorKey(), state.scheduleAnchor);
  if (renderIfChanged) render();
  return true;
}

function startScheduleTodayLifecycle() {
  const sync = () => syncScheduleTodayAnchor();
  window.addEventListener("pageshow", sync);
  window.addEventListener("focus", sync);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) sync();
  });
  setInterval(sync, 60 * 1000);
}

function moveScheduleAnchor(direction) {
  if (state.scheduleRange === "today" && ["prev", "next"].includes(direction)) {
    syncScheduleTodayAnchor();
    return;
  }
  if (direction === "today") {
    state.scheduleAnchor = todayISO();
  } else {
    const base = getScheduleAnchorDate();
    if (state.scheduleRange === "month") {
      state.scheduleAnchor = toISODate(addMonths(startOfMonth(base), direction === "next" ? 1 : -1));
    } else if (state.scheduleRange === "week") {
      state.scheduleAnchor = toISODate(addDays(base, direction === "next" ? 7 : -7));
    } else {
      state.scheduleAnchor = toISODate(addDays(base, direction === "next" ? 1 : -1));
    }
  }
  localStorage.setItem(scheduleAnchorKey(), state.scheduleAnchor);
  render();
}'''
          replace_once(old_move, new_move, 'moveScheduleAnchor canonicalization')

          path.write_text(text, encoding='utf-8')

          Path('schedule-today-lock-v129.js').write_text('''// Ver.225: Schedule Today lifecycle is canonical in app.js.\n// This compatibility shell remains active for one release so cached loaders stay harmless.\n(function installScheduleTodayLockCompatibilityV129() {\n  window.__WB_SCHEDULE_TODAY_LOCK_V129__ = Object.freeze({\n    version: "225",\n    retired: true\n  });\n})();\n''', encoding='utf-8')
          PY

          node --check app.js
          node --check schedule-today-lock-v129.js

      - name: Remove temporary workflow and commit product code
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v225-inspect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js schedule-today-lock-v129.js .github/workflows/v225-inspect.yml
          git diff --cached --check
          git commit -m "Ver.225 Schedule Today固定をapp.js正本へ統合"
          git push origin HEAD:cleanup/schedule-today-lock-canonical-v225
