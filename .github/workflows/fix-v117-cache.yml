name: Fix v117 cache references

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-v117-cache.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update cache references
        run: sed -i 's/v=116/v=117/g' index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update asset cache references to v117"
          git push
