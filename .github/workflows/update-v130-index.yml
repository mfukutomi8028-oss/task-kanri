name: Update index to v130

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-v130-index.yml

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update static version and cache references
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace("?v=122", "?v=130")
          text = text.replace("Ver.122", "Ver.130")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update static site references to v130"
          git push
