name: Apply Ver.252 Firebase module retry

on:
  push:
    branches:
      - fix/firebase-module-retry-v252
    paths:
      - .github/workflows/apply-v252-firebase-module-retry.yml
      - test-harness/apply-v252-firebase-module-retry-v2.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/firebase-module-retry-v252
          fetch-depth: 1
      - name: Apply guarded patch
        run: python test-harness/apply-v252-firebase-module-retry-v2.py
      - name: Commit product changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comment-reactions-v191.js tests/comment-reaction-firebase-retry-audit-v255.spec.mjs test-harness/firebase-module-retry-v255.test.mjs test-harness/comment-reaction-offline-v253.test.mjs test-harness/reaction-reconnect-v254.test.mjs release-manifest.js patch-responsibilities.json
          git commit -m "fix: recover Firebase module imports after transient failure"
          git push origin HEAD:fix/firebase-module-retry-v252
