name: Resize left menu mine icon v122

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/resize-mine-menu-v122.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Resize only left menu mine icon
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('mine-icon-fix-v121.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('width: 44px !important;', 'width: 40px !important;')
          css = css.replace('height: 44px !important;', 'height: 40px !important;')
          css = css.replace('min-width: 44px !important;', 'min-width: 40px !important;')
          css = css.replace('min-height: 44px !important;', 'min-height: 40px !important;')
          css = css.replace('max-width: 44px !important;', 'max-width: 40px !important;')
          css = css.replace('max-height: 44px !important;', 'max-height: 40px !important;')
          css = css.replace('/* v121:', '/* v122:', 1)
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('?v=121', '?v=122')
          index = index.replace('Ver.121', 'Ver.122')
          index_path.write_text(index, encoding='utf-8')

          for filename in ['config.js', 'stable-fixes-v108.js', 'mobile-fixes.js']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace('// v121:', '// v122:', 1)
              text = text.replace('const VERSION = "121";', 'const VERSION = "122";', 1)
              text = text.replace('mobile-base-v121', 'mobile-base-v122')
              text = text.replace('stable-v121', 'stable-v122')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mine-icon-fix-v121.css index.html config.js stable-fixes-v108.js mobile-fixes.js
          git commit -m "Shrink left menu mine icon and bump to v122"
          git push
