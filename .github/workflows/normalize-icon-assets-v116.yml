name: Normalize icon assets and bump v116

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/normalize-icon-assets-v116.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Clean icon backgrounds and update styles
        run: |
          python - <<'PY'
          from collections import deque
          from pathlib import Path
          from PIL import Image

          ICONS = [
              "assets/nav-today-v87.png",
              "assets/nav-task-v87.png",
              "assets/nav-schedule-v87.png",
              "assets/summary-mine.png",
              "assets/nav-star-v87.png",
              "assets/nav-done.png",
              "assets/summary-open.png",
              "assets/summary-overdue.png",
              "assets/summary-today.png",
          ]

          def color_distance(a, b):
              return ((a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2) ** 0.5

          def belongs_to_corner_background(pixel, seed):
              if pixel[3] == 0:
                  return True
              rgb = pixel[:3]
              seed_rgb = seed[:3]
              distance = color_distance(rgb, seed_rgb)
              if max(seed_rgb) <= 70:
                  return max(rgb) <= 120 and distance <= 105
              if min(seed_rgb) >= 185:
                  return min(rgb) >= 145 and distance <= 120
              return distance <= 82

          def clear_corner_background(image):
              image = image.convert("RGBA")
              pixels = image.load()
              width, height = image.size
              removed = set()
              corners = [(0, 0), (width - 1, 0), (0, height - 1), (width - 1, height - 1)]

              for corner in corners:
                  seed = pixels[corner]
                  if seed[3] <= 8:
                      continue
                  queue = deque([corner])
                  visited = {corner}
                  while queue:
                      x, y = queue.popleft()
                      if not belongs_to_corner_background(pixels[x, y], seed):
                          continue
                      removed.add((x, y))
                      for nx, ny in (
                          (x - 1, y), (x + 1, y), (x, y - 1), (x, y + 1),
                          (x - 1, y - 1), (x + 1, y - 1), (x - 1, y + 1), (x + 1, y + 1),
                      ):
                          if 0 <= nx < width and 0 <= ny < height and (nx, ny) not in visited:
                              visited.add((nx, ny))
                              queue.append((nx, ny))

              for x, y in removed:
                  r, g, b, _ = pixels[x, y]
                  pixels[x, y] = (r, g, b, 0)

              return image, len(removed)

          for filename in ICONS:
              path = Path(filename)
              if not path.exists():
                  print(f"skip missing: {filename}")
                  continue
              with Image.open(path) as source:
                  cleaned, removed_count = clear_corner_background(source)
                  cleaned.save(path, format="PNG", optimize=True)
              print(f"{filename}: cleared {removed_count} edge-connected background pixels")

          style_path = Path("style.css")
          style = style_path.read_text(encoding="utf-8")
          marker = "/* v116: normalize all menu and summary image icons */"
          block = r'''

/* v116: normalize all menu and summary image icons */
.sidebar .nav .nav-item .nav-icon,
.sidebar .nav .nav-filter .nav-icon,
.summary-grid .summary-card .summary-icon.icon-image {
  display: inline-grid !important;
  place-items: center !important;
  width: 48px !important;
  height: 48px !important;
  min-width: 48px !important;
  min-height: 48px !important;
  overflow: visible !important;
  background: transparent !important;
  border: 0 !important;
}

.sidebar .nav .nav-item[data-layout] .nav-icon > img,
.sidebar .nav .nav-filter[data-filter] .nav-icon > img,
.summary-grid .summary-card .summary-icon.icon-image > img {
  width: 44px !important;
  height: 44px !important;
  min-width: 44px !important;
  min-height: 44px !important;
  max-width: 44px !important;
  max-height: 44px !important;
  object-fit: contain !important;
  object-position: center center !important;
  background: transparent !important;
  border: 0 !important;
  border-radius: 0 !important;
  clip-path: none !important;
  -webkit-clip-path: none !important;
  mask: none !important;
  -webkit-mask: none !important;
  transform: none !important;
  margin: auto !important;
  display: block !important;
  image-rendering: auto !important;
}
'''
          if marker not in style:
              style += block
          style_path.write_text(style, encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = index.replace("?v=115", "?v=116")
          index = index.replace("Ver.115", "Ver.116")
          index_path.write_text(index, encoding="utf-8")

          for filename in ["config.js", "stable-fixes-v108.js", "mobile-fixes.js"]:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = text.replace("// v115:", "// v116:", 1)
              text = text.replace('const VERSION = "115";', 'const VERSION = "116";', 1)
              text = text.replace("mobile-base-v115", "mobile-base-v116")
              text = text.replace("stable-v115", "stable-v116")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit normalized icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.png style.css index.html config.js stable-fixes-v108.js mobile-fixes.js
          git commit -m "Normalize all icon backgrounds and bump to v116"
          git push
