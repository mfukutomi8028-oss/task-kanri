name: Ver219 apply canonical Today renderer

on:
  push:
    branches:
      - refactor/stable-today-retirement-v219

permissions:
  contents: write

jobs:
  patch-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stable-today-retirement-v219
          fetch-depth: 0
      - name: Apply audited app.js replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'const openTasks = state.tasks.filter(t => !isCompletedStatus(t.status));',
                  'const openTasks = state.tasks.filter(t => !isCompletedStatus(t.status) && normalizeText(t.status) !== normalizeText("保留") && (!scopeHasMine() || isCurrentUserOrGroupAssignee(t.assignee)));',
                  'Today openTasks canonical filter',
              ),
              (
                  '.filter(s => !scopeHasMine() || s.assignee === getCurrentUser())',
                  '.filter(s => !scopeHasMine() || isCurrentUserOrGroupAssignee(s.assignee))',
                  'Today schedule mine filter',
              ),
              (
                  'const spare = openTasks.filter(t => !t.dueDate && !isUnsortedTask(t)).sort(compareSmartTasks).slice(0, 10);',
                  'const spare = openTasks.filter(t => !t.dueDate && !isUnsortedTask(t) && normalizeText(t.status) !== normalizeText("確認待ち")).sort(compareSmartTasks).slice(0, 10);',
                  'Today spare waiting exclusion',
              ),
          ]
          for before, after, label in replacements:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one target, got {count}')
              source = source.replace(before, after, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Remove temporary patch workflow and commit
        run: |
          git rm .github/workflows/ver219-apply-today-canonical.yml
          git add app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Ver.219 Today意味論をapp.jsへ統合"
          git push origin HEAD:refactor/stable-today-retirement-v219
