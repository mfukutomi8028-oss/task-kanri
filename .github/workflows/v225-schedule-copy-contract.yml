name: Ver225 finalize schedule copy contract
on:
  push:
    branches:
      - feature/schedule-copy-v225
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update responsibility inventory and stabilize browser case
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/v225-contract.py
          python /tmp/v225-contract.py
          node --test test-harness/version-source-v194.test.mjs test-harness/patch-responsibility.test.mjs
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v225-schedule-copy-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Ver.225 スケジュールコピーの責務台帳と回帰契約を更新"
          git push origin HEAD:feature/schedule-copy-v225
