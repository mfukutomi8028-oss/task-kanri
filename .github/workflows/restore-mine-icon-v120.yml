name: Restore original mine icon and bump v120

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-mine-icon-v120.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Restore only the mine icon reference
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('assets/summary-mine-menu.png?v=119', 'assets/summary-mine.png?v=120')
          index = index.replace('?v=119', '?v=120')
          index = index.replace('Ver.119', 'Ver.120')
          index_path.write_text(index, encoding='utf-8')

          for filename in ['config.js', 'stable-fixes-v108.js', 'mobile-fixes.js']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace('// v119:', '// v120:', 1)
              text = text.replace('const VERSION = "119";', 'const VERSION = "120";', 1)
              text = text.replace('mobile-base-v119', 'mobile-base-v120')
              text = text.replace('stable-v119', 'stable-v120')
              path.write_text(text, encoding='utf-8')

          menu_icon = Path('assets/summary-mine-menu.png')
          if menu_icon.exists():
              menu_icon.unlink()
          PY

      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html config.js stable-fixes-v108.js mobile-fixes.js assets/summary-mine-menu.png
          git commit -m "Restore pre-adjustment mine icon and bump to v120"
          git push
