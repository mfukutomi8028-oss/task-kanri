name: Apply Ver.222 Today canonical render

on:
  push:
    branches:
      - cleanup/today-canonical-render-v222
    paths:
      - .github/workflows/apply-v222-today-canonical.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Canonicalize Today render in app.js
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.js')
          source = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              source = source.replace(old, new, 1)

          replace_once('  renderSummary();\n', '  renderSummary();\n  renderScheduleNotificationSidebar();\n', 'renderCore hook')

          pattern = r'(function renderNotificationPermissionButton\(\) \{.*?\n\})\n\n'
          matches = list(re.finditer(pattern, source, flags=re.S))
          if len(matches) != 1:
              raise SystemExit(f'notification renderer: expected exactly 1 match, found {len(matches)}')
          sidebar = '\n\nfunction renderScheduleNotificationSidebar() {\n  const connection = elements.connectionPill;\n  if (!connection) return;\n\n  let host = document.getElementById("scheduleNotificationSidebarV220");\n  if (!host) {\n    host = document.createElement("div");\n    host.id = "scheduleNotificationSidebarV220";\n    host.className = "schedule-notification-sidebar-v220";\n    host.setAttribute("aria-label", "予定通知");\n    connection.insertAdjacentElement("afterend", host);\n  } else if (connection.nextElementSibling !== host) {\n    connection.insertAdjacentElement("afterend", host);\n  }\n\n  host.innerHTML = renderNotificationPermissionButton();\n  host.querySelector("[data-enable-schedule-notifications]")?.addEventListener("click", requestScheduleNotificationPermission);\n}\n\n'
          source = re.sub(pattern, lambda match: match.group(1) + sidebar, source, count=1, flags=re.S)

          old_actions = '      <div class="activity-actions">\n        ${renderNotificationPermissionButton()}\n        <button class="ghost-button activity-read-button" type="button" data-mark-activity-read ${unreadCount ? "" : "disabled"}>確認済みにする</button>\n      </div>'
          new_actions = '      <div class="activity-actions">\n        <button class="ghost-button activity-read-button" type="button" data-mark-activity-read ${unreadCount ? "" : "disabled"}>確認済みにする</button>\n        <span class="today-action-divider-v220" aria-hidden="true"></span>\n        <button class="ghost-button today-compact-action-v176" type="button" data-layout-jump="schedule">スケジュールを見る</button>\n        <button class="primary-button today-compact-action-v176" type="button" data-new-task>＋ 新しいタスク</button>\n      </div>'
          replace_once(old_actions, new_actions, 'Today action row')

          old_head = '\n    <section class="today-head today-head-after-activity">\n      <div>\n        <h3>今日やること</h3>\n        <p>${formatDateForDisplay(today)}の予定・期限・未整理をまとめて確認できます。</p>\n      </div>\n      <div class="today-head-actions">\n        <button class="ghost-button" type="button" data-layout-jump="schedule">スケジュールを見る</button>\n        <button class="primary-button" type="button" data-new-task>＋ 新しいタスク</button>\n      </div>\n    </section>\n'
          replace_once(old_head, '\n', 'redundant Today head')

          replace_once('  root.querySelector("[data-enable-schedule-notifications]")?.addEventListener("click", requestScheduleNotificationPermission);\n', '', 'Today-root notification binding')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify and commit app.js
        shell: bash
        run: |
          node --check app.js
          git diff --check
          git diff -- app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Ver.222 Today描画をapp正本へ統合 [skip ci]"
          git push
