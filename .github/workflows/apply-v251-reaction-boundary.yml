name: Apply Ver.251 reaction boundary patch

on:
  push:
    branches:
      - fix/comment-reaction-connection-boundary-v251
    paths:
      - .github/workflows/apply-v251-reaction-boundary.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/comment-reaction-connection-boundary-v251
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply guarded patch
        run: node test-harness/apply-v251-reaction-boundary.mjs

      - name: Verify patch scope and syntax
        run: |
          git diff --check
          node --check comment-reactions-v191.js
          node --check release-manifest.js
          node --test test-harness/comment-reply-offline-v252.test.mjs
          git diff --name-only

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comment-reactions-v191.js release-manifest.js patch-responsibilities.json test-harness/comment-reply-offline-v252.test.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Ver.251: guard reaction writes outside shared online mode"
          git push origin HEAD:fix/comment-reaction-connection-boundary-v251

# retrigger after historical release-contract fix
