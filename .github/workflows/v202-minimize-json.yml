name: Ver.202 one-shot JSON minimizer
on:
  push:
    branches:
      - refactor/today-owner-v202
permissions:
  contents: write
jobs:
  minimize:
    if: ${{ !contains(github.event.head_commit.message, '[v202-json]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/today-owner-v202
          fetch-depth: 0
      - name: Minimize responsibility JSON diff
        run: node .github/scripts/v202-minimize-json.cjs
      - name: Remove one-shot helpers and commit
        run: |
          rm .github/scripts/v202-minimize-json.cjs
          rm .github/workflows/v202-minimize-json.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "[v202-json] minimize responsibility metadata diff"
          git push origin HEAD:refactor/today-owner-v202
