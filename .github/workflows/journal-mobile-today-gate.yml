name: JOURNAL V598 day entry focused gate (temporary)
on:
  push:
    branches: [design/journal-mobile-today-entry-v598-20261115]
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: New V598 mobile week-to-day tests
        run: npx playwright test tests/journal-display-v367.spec.mjs --grep 'JOURNAL V598' --retries=0 --reporter=line
      - name: Capture failure for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v598-mobile-focus-test-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 2
