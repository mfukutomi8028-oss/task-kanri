name: Ver223 ledger scope fix

on:
  push:
    branches:
      - cleanup/schedule-canonical-render-v223

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/schedule-canonical-render-v223
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('patch-responsibilities.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['priorityCandidates'][0]['scope'] = ['core-view-density-v188.js']
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/v223-ledger-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch-responsibilities.json .github/workflows/v223-ledger-fix.yml
          git commit -m "Ver.223次候補scope契約を補正"
          git push origin HEAD:cleanup/schedule-canonical-render-v223
