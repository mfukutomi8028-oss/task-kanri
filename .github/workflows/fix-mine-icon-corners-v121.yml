name: Fix mine icon white corners v121

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-mine-icon-corners-v121.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Fix only left menu mine icon corners
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('mine-icon-fix-v121.css')
          css_path.write_text('''/* v121: hide only the white canvas corners of the left-menu mine icon */
          .sidebar .nav .nav-filter[data-filter="mine"] .nav-icon {
            display: inline-grid !important;
            place-items: center !important;
            width: 48px !important;
            height: 48px !important;
            min-width: 48px !important;
            min-height: 48px !important;
            overflow: hidden !important;
            border-radius: 15px !important;
            background: transparent !important;
            border: 0 !important;
          }

          .sidebar .nav .nav-filter[data-filter="mine"] .nav-icon > img {
            width: 44px !important;
            height: 44px !important;
            min-width: 44px !important;
            min-height: 44px !important;
            max-width: 44px !important;
            max-height: 44px !important;
            display: block !important;
            margin: auto !important;
            object-fit: contain !important;
            object-position: center center !important;
            overflow: hidden !important;
            border-radius: 14px !important;
            clip-path: inset(1px round 13px) !important;
            -webkit-clip-path: inset(1px round 13px) !important;
            background: transparent !important;
            border: 0 !important;
            box-shadow: none !important;
            filter: none !important;
            opacity: 1 !important;
            mix-blend-mode: normal !important;
            transform: none !important;
          }
          ''', encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="mine-icon-fix-v121.css?v=121" />'
          if 'mine-icon-fix-v121.css' not in index:
              index = index.replace(
                  '<link rel="stylesheet" href="style.css?v=120" />',
                  '<link rel="stylesheet" href="style.css?v=121" />\n' + link,
                  1,
              )
          index = index.replace('?v=120', '?v=121')
          index = index.replace('Ver.120', 'Ver.121')
          index_path.write_text(index, encoding='utf-8')

          for filename in ['config.js', 'stable-fixes-v108.js', 'mobile-fixes.js']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace('// v120:', '// v121:', 1)
              text = text.replace('const VERSION = "120";', 'const VERSION = "121";', 1)
              text = text.replace('mobile-base-v120', 'mobile-base-v121')
              text = text.replace('stable-v120', 'stable-v121')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mine-icon-fix-v121.css index.html config.js stable-fixes-v108.js mobile-fixes.js
          git commit -m "Hide left menu mine icon white corners and bump to v121"
          git push
