name: Ver225 fix schedule copy room cache
on:
  push:
    branches:
      - feature/schedule-copy-v225
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Warm room transaction cache before schedule copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old_start = '''  return executeWrite("schedule-copy", source.id, () => transactionRoom(root => {
    const currentSource = root.schedules?.[source.id];'''
          new_start = '''  return executeWrite("schedule-copy", source.id, async () => {
    // Schedule subscriptions are child-scoped. Warm the room-level cache before
    // starting a room transaction so a fresh remote session cannot treat a
    // visible source schedule as missing on the transaction's first local pass.
    if (state.connectionMode !== "local-only") await get(state.roomRef);
    return transactionRoom(root => {
      const currentSource = root.schedules?.[source.id];'''
          old_end = '''    return root;
  }, affectedPaths));
}'''
          new_end = '''      return root;
    }, affectedPaths);
  });
}'''
          if s.count(old_start) != 1:
              raise SystemExit(f'start anchor expected once, got {s.count(old_start)}')
          if s.count(old_end) != 1:
              raise SystemExit(f'end anchor expected once, got {s.count(old_end)}')
          s = s.replace(old_start, new_start, 1).replace(old_end, new_end, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check app.js
          git diff --check
      - name: Remove workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v225-schedule-copy-room-cache-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Ver.225 共同編集直後の予定コピー競合を防止"
          git push origin HEAD:feature/schedule-copy-v225
