name: Ver225 fix schedule copy room cache
on:
  push:
    branches:
      - feature/schedule-copy-v225
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Warm room transaction cache before schedule copy
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('app.js'); s=p.read_text(encoding='utf-8'); a='  return executeWrite(\"schedule-copy\", source.id, () => transactionRoom(root => {\\n    const currentSource = root.schedules?.[source.id];'; b='  return executeWrite(\"schedule-copy\", source.id, async () => {\\n    // Schedule subscriptions are child-scoped. Warm the room-level cache before\\n    // starting a room transaction so a fresh remote session cannot treat a\\n    // visible source schedule as missing on the transaction first local pass.\\n    if (state.connectionMode !== \"local-only\") await get(state.roomRef);\\n    return transactionRoom(root => {\\n      const currentSource = root.schedules?.[source.id];'; c='    return root;\\n  }, affectedPaths));\\n}'; d='      return root;\\n    }, affectedPaths);\\n  });\\n}'; assert s.count(a)==1, f'start anchor {s.count(a)}'; assert s.count(c)==1, f'end anchor {s.count(c)}'; p.write_text(s.replace(a,b,1).replace(c,d,1),encoding='utf-8')"
          node --check app.js
          git diff --check
      - name: Remove workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v225-schedule-copy-room-cache-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Ver.225 共同編集直後の予定コピー競合を防止"
          git push origin HEAD:feature/schedule-copy-v225
