name: Capture icon visual baseline

on:
  push:
    branches:
      - chore/icon-css-consolidation-v177
    paths:
      - tests/icon-visual.spec.mjs
      - .github/workflows/capture-icon-baseline.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture current visual baselines
        run: npx playwright test tests/icon-visual.spec.mjs --update-snapshots

      - name: Commit generated baselines
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/icon-visual.spec.mjs-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "test: capture icon visual baselines [baseline-generated]"
            git push origin HEAD:chore/icon-css-consolidation-v177
          fi
