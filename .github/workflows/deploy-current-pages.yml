name: Deploy current main to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            ./ _site/

          python - <<'PY'
          from pathlib import Path

          marker = "/* v113: item icon images fit fully inside their existing frames */"
          block = r'''

/* v113: item icon images fit fully inside their existing frames */
.nav-icon img,
.summary-icon.icon-image img,
.summary-icon img {
  width: 100% !important;
  height: 100% !important;
  object-fit: contain !important;
  transform: scale(0.94) !important;
  transform-origin: center center !important;
  display: block !important;
}
'''

          style_path = Path("_site/style.css")
          style = style_path.read_text(encoding="utf-8")
          if marker not in style:
              style += block
          style_path.write_text(style, encoding="utf-8")

          index_path = Path("_site/index.html")
          index = index_path.read_text(encoding="utf-8")
          index = index.replace("?v=112", "?v=113")
          index = index.replace("Ver.112", "Ver.113")
          index_path.write_text(index, encoding="utf-8")

          for filename in ["config.js", "stable-fixes-v108.js", "mobile-fixes.js"]:
              path = Path("_site") / filename
              text = path.read_text(encoding="utf-8")
              text = text.replace("// v112:", "// v113:", 1)
              text = text.replace('const VERSION = "112";', 'const VERSION = "113";', 1)
              text = text.replace("mobile-base-v112", "mobile-base-v113")
              text = text.replace("stable-v112", "stable-v113")
              path.write_text(text, encoding="utf-8")
          PY

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy current main
        id: deployment
        uses: actions/deploy-pages@v4
