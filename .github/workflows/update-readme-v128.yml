name: Update README through v128

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-readme-v128.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append consolidated release notes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          marker = "## v91〜v100 更新内容（まとめ）"
          if marker in text:
              print("README is already updated")
              raise SystemExit(0)

          addition = r'''


## 現在のバージョン

- **Ver.128**
- PC・スマホの両方に対応しています。
- GitHub Pages + Firebase Realtime Database による共同編集を継続しています。


## v91〜v100 更新内容（まとめ）

- サイト内で使用するブランド画像を整理し、ブラウザタブ・メニュー・通知で統一しやすい構成へ改善しました。
- PC版とスマホ版で表示が崩れにくいよう、各画面の余白・幅・配置を継続的に調整しました。
- 共有ルーム名がタイトルや操作部と重なりにくいレスポンシブ配置へ改善しました。
- キャッシュ更新番号を使い、古いCSS・JavaScript・画像が残りにくい構成を維持しました。


## v101〜v108 更新内容（まとめ）

- スマホ版に固定ヘッダー、メニュー、作成メニュー、状態切替タブなどの操作性改善を追加しました。
- スマホのボード表示で状態セクションを切り替えやすくし、横方向・縦方向のスクロール挙動を調整しました。
- 基本状態（未着手・対応中・確認待ち・保留・完了）を誤って削除できないよう保護しました。
- 今日ビューで「保留」や空き時間内の「確認待ち」を適切に除外するよう整理しました。
- 再帰的な画面監視により操作が重くなる問題を解消し、PCでは共通の安定補正のみ、スマホではスマホ補正後に共通補正を読み込む構成へ整理しました。
- 画面を固めない軽量な監視・再描画方式へ変更し、安定性を優先しました。


## v109〜v118 更新内容（まとめ）

- 「自分の担当」絞り込みを、タスクだけでなくスケジュールや今日ビュー内の各表示にも一貫して反映するよう改善しました。
- 現在ユーザーの担当に加え、システム課・共有ルームなどの共通担当も「自分の担当」として扱えるよう整理しました。
- 今日ビューのお知らせから対象タスクを開く操作を改善し、通常クリックと編集操作を分けました。
- スケジュール通知・15分前通知で使用するアイコンをブランド画像へ統一しました。
- スマホ版で共有ルーム名とページタイトルが重ならないよう、表示位置と折り返しを調整しました。


## v119〜v125 更新内容（まとめ）

- 左メニューの「自分の担当」「スター」「完了」アイコンについて、サイズ・余白・外枠・立体感を調整しました。
- 「自分の担当」は元の画像を維持しつつ、左メニューだけ白い四隅が見えないようCSSで補正しました。
- タスク集計内の「自分の担当」アイコンには左メニュー用補正が影響しないよう対象を限定しました。
- 「スター」は他の絞り込みアイコンに合わせ、左上の反射と右下の陰影を使った立体的なフチへ調整しました。
- スター中央が上下で分離して見える直線的な光沢を削除し、放射状の反射と陰影へ変更しました。


## v126 更新内容

- タスクの期限日とスケジュールの開始・終了日時で、カレンダー選択に加えてキーボード入力を再度利用できるようにしました。
- 以前の4桁年制限が入力途中にも実行され、キー入力を妨げていた問題を修正しました。
- 日付入力欄に残っていた `readonly` や不適切な `maxlength` の影響を解除しました。


## v127 更新内容

- 年・月・日を独立した入力欄として扱う日付入力UIを追加しました。
- スケジュールでは年・月・日・時・分を個別に入力できるようにしました。
- 日の欄で `2` の次に `8` を入力すると `28` になるよう、2桁入力が完了するまで値を確定しない方式に変更しました。
- 区切り文字入力、左右キー移動、バックスペース移動、数字だけの貼り付けに対応しました。
- 内部の保存形式は従来の `YYYY-MM-DD` / `YYYY-MM-DDTHH:mm` を維持しています。
- カレンダーボタンからの入力も引き続き利用できます。


## v128 更新内容

- スケジュール追加・編集画面で、開始日時・終了日時の年欄だけが横幅を占有する問題を修正しました。
- 年・月・日・時・分の各入力欄を固定幅にし、フォーム共通CSSの `width: 100%` が上書きしないよう指定を強化しました。
- 日時入力欄がダイアログの外へはみ出し、画面全体が右側へスクロールする問題を修正しました。
- 隠して保持しているブラウザ標準の日時入力欄を1pxに制限し、レイアウトを押し広げないようにしました。
- キーボード入力とカレンダー入力の両方を維持しています。


## README更新ルール

- 今後、システムのバージョンを更新する場合は、コード・CSS・画像などの変更と同じタイミングでREADMEの更新履歴も追記します。
- READMEには、利用者が確認できる変更点、不具合修正、操作方法への影響、現在のバージョンを記載します。
- 軽微な内部整理だけの場合も、動作や保守性に意味のある変更であれば更新区間のまとめへ記録します。
- GitHubへ反映した際は、READMEの更新漏れがないことも確認します。
'''

          path.write_text(text.rstrip() + addition + "\n", encoding="utf-8")
          PY
      - name: Commit README
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Document updates through v128"
          git push
