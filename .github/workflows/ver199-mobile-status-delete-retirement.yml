name: Ver.199 guarded mobile status-delete retirement

on:
  push:
    branches:
      - refactor/mobile-status-delete-v199

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove only mobile duplicate status-delete guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mobile-fixes.js')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''  function isProtectedDeleteStatus(status) {\n    return PROTECTED_DELETE_STATUSES.some(item => isSameStatus(item, status));\n  }\n\n''',
                  ''
              ),
              (
                  '''  function patchStatusManager() {\n    document.querySelectorAll("[data-delete-status]").forEach(button => {\n      const status = button.getAttribute("data-delete-status") || "";\n      if (!isProtectedDeleteStatus(status)) return;\n      button.disabled = true;\n      button.setAttribute("aria-disabled", "true");\n      button.title = `${status}は基本状態のため削除できません`;\n    });\n  }\n\n''',
                  ''
              ),
              (
                  '''\n      const deleteButton = event.target?.closest?.("[data-delete-status]");\n      if (!deleteButton) return;\n      const status = deleteButton.getAttribute("data-delete-status") || "";\n      if (!isProtectedDeleteStatus(status)) return;\n      event.preventDefault();\n      event.stopPropagation();\n      alert(`${status}は基本状態のため削除できません。`);''',
                  ''
              ),
              (
                  '''    patchMobileBoardTabs();\n    patchStatusManager();\n    patchTodayView();''',
                  '''    patchMobileBoardTabs();\n    patchTodayView();'''
              )
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one mobile-fixes.js match, found {count}: {old[:100]!r}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify unrelated mobile responsibilities remain
        shell: bash
        run: |
          grep -q 'function patchMobileBoardTabs()' mobile-fixes.js
          grep -q 'function patchTodayView()' mobile-fixes.js
          grep -q 'function patchDateInputs' mobile-fixes.js
          grep -q 'function patchScheduleRangeButtons()' mobile-fixes.js
          grep -q 'const PROTECTED_DELETE_STATUSES' mobile-fixes.js
          ! grep -q 'function isProtectedDeleteStatus' mobile-fixes.js
          ! grep -q 'function patchStatusManager' mobile-fixes.js
          ! grep -q '\[data-delete-status\]' mobile-fixes.js

      - name: Remove one-off workflow
        run: rm .github/workflows/ver199-mobile-status-delete-retirement.yml

      - name: Commit guarded refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-fixes.js .github/workflows/ver199-mobile-status-delete-retirement.yml
          git commit -m "Ver.199: retire duplicate mobile status delete guard"
          git push origin HEAD:${GITHUB_REF_NAME}
