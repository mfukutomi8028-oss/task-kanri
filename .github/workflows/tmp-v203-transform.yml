name: Temporary Ver.203 scoped transform

on:
  push:
    branches:
      - refactor/mobile-schedule-label-v203

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mobile-schedule-label-v203
      - name: Apply exact Ver.203 transform
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          mobile = Path('mobile-fixes.js')
          text = mobile.read_text(encoding='utf-8')
          old_fn = '''  function patchScheduleRangeButtons() {\n    document.querySelectorAll('[data-schedule-range="week"]').forEach(button => {\n      if (button.textContent.trim() !== "7日間") button.textContent = "7日間";\n      button.title = "今日から7日間を表示します";\n    });\n  }\n\n'''
          if text.count(old_fn) != 1:
              raise SystemExit(f'mobile-fixes.js: patchScheduleRangeButtons matches={text.count(old_fn)}')
          if text.count('    patchScheduleRangeButtons();\n') != 1:
              raise SystemExit('mobile-fixes.js: expected one patchScheduleRangeButtons call')
          text = text.replace('// Ver.202: スマホ版の操作性改善。native日付制約とToday最終可視性は stable-fixes-v108.js が所有する。',
                              '// Ver.203: スマホ版の操作性改善。native日付制約とToday最終可視性は stable-fixes-v108.js、スケジュール7日間ラベルは schedule-today-lock-v129.js が所有する。', 1)
          text = text.replace(old_fn, '', 1)
          text = text.replace('    patchScheduleRangeButtons();\n', '', 1)
          if 'function patchScheduleRangeButtons' in text or 'patchScheduleRangeButtons();' in text:
              raise SystemExit('mobile-fixes.js: schedule label patch remains')
          if 'function resetScheduleAnchorBeforeRollingWeek' not in text:
              raise SystemExit('mobile-fixes.js: unrelated schedule anchor helper unexpectedly missing')
          mobile.write_text(text, encoding='utf-8')

          manifest = Path('release-manifest.js')
          m = manifest.read_text(encoding='utf-8')
          replacements = [
              ('// Ver.202 のリリース正本。', '// Ver.203 のリリース正本。'),
              ('installFirstPaintGuardV202', 'installFirstPaintGuardV203'),
              ("const VERSION = '202';", "const VERSION = '203';"),
              ("const bootClass = 'wb-first-paint-v202';", "const bootClass = 'wb-first-paint-v203';"),
              ("guardStyle.id = 'wb-first-paint-style-v202';", "guardStyle.id = 'wb-first-paint-style-v203';"),
              ('window.__WB_LEGACY_ICON_OBSERVER_V202__', 'window.__WB_LEGACY_ICON_OBSERVER_V203__'),
              ('version: "202"', 'version: "203"'),
          ]
          for old, new in replacements:
              if m.count(old) != 1:
                  raise SystemExit(f'release-manifest.js: expected 1 match for {old!r}, got {m.count(old)}')
              m = m.replace(old, new, 1)
          manifest.write_text(m, encoding='utf-8')

          test = Path('test-harness/version-source-v194.test.mjs')
          t = test.read_text(encoding='utf-8')
          if "const mobile = fs.readFileSync(new URL('../mobile-fixes.js', import.meta.url), 'utf8');" not in t:
              anchor = "const stable = fs.readFileSync(new URL('../stable-fixes-v108.js', import.meta.url), 'utf8');\n"
              if t.count(anchor) != 1:
                  raise SystemExit('version-source: stable read anchor mismatch')
              t = t.replace(anchor, anchor + "const mobile = fs.readFileSync(new URL('../mobile-fixes.js', import.meta.url), 'utf8');\n", 1)
          for old, new in [
              ("test('Ver.202 manifest is the release-version source and preserves foundation script order'", "test('Ver.203 manifest is the release-version source and preserves foundation script order'"),
              ("/version:\\s*[\"']202[\"']/", "/version:\\s*[\"']203[\"']/"),
              ("/const VERSION = [\"']202[\"']/", "/const VERSION = [\"']203[\"']/"),
          ]:
              if t.count(old) != 1:
                  raise SystemExit(f'version-source: expected one {old!r}, got {t.count(old)}')
              t = t.replace(old, new, 1)
          needle = "  assert.match(scheduleLock, /observer\\.observe\\(view, \\{ childList: true, subtree: true \\}\\)/);\n"
          addition = "  assert.doesNotMatch(mobile, /function patchScheduleRangeButtons\\s*\\(/);\n  assert.doesNotMatch(mobile, /patchScheduleRangeButtons\\(\\);/);\n"
          if addition not in t:
              if t.count(needle) != 1:
                  raise SystemExit('version-source: schedule observer assertion anchor mismatch')
              t = t.replace(needle, needle + addition, 1)
          test.write_text(t, encoding='utf-8')

          Path('.github/workflows/tmp-v203-transform.yml').unlink()
      - name: Commit transformed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-fixes.js release-manifest.js test-harness/version-source-v194.test.mjs .github/workflows/tmp-v203-transform.yml
          git commit -m "Ver.203: retire duplicate mobile schedule label patch"
          git push origin HEAD:refactor/mobile-schedule-label-v203
