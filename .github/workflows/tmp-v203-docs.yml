name: Temporary Ver.203 docs transform

on:
  push:
    branches:
      - refactor/mobile-schedule-label-v203

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mobile-schedule-label-v203
      - name: Update Ver.203 responsibility docs exactly
        shell: python
        run: |
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Machine-readable inventory
          one('patch-responsibilities.json', '"baselineRelease": "202"', '"baselineRelease": "203"')
          one('patch-responsibilities.json',
              'Ver.202でmobile側のToday状態除外・storage fallback・auto-hidden markerを退役し、状態除外とmine/groupを含む最終可視性をstable単独所有へ統一。',
              'Ver.202でmobile側のToday状態除外・storage fallback・auto-hidden markerを退役し、状態除外とmine/groupを含む最終可視性をstable単独所有へ統一。Ver.203でmobile側の7日間ラベル補正を退役し、schedule-today-lock-v129.jsをスケジュール範囲ラベルの単独正本へ統一。')
          one('patch-responsibilities.json',
              '"goal": "Ver.202でToday重複を退役したため、次はschedule-today-lock-v129.jsとmobile-fixes.jsに残る7日間表示補正の重複を監査し、schedule側を正本としてmobile側補正を退役できるか確認する。モバイル状態タブ・ヘッダー・メニュー・body-wide Observerは同時に変更しない。"',
              '"goal": "Ver.203でスケジュール7日間ラベルの重複を解消したため、次はstable-fixes-v108.jsのpatchStatusTabAutoScrollとmobile-fixes.jsの状態タブスクロール処理の所有境界を監査する。ヘッダー・メニュー・body-wide Observerは同時に変更しない。"')
          one('patch-responsibilities.json',
              '"precondition": "Ver.202のstatic contract 67件、通常ブラウザ67件、Firebase Emulator 19件がgreenで、release-manifestがVer.202、mainのRegressionとPagesが成功していること。"',
              '"precondition": "Ver.203のstatic contract 67件、通常ブラウザ68件、Firebase Emulator 19件がgreenで、release-manifestがVer.203、mainのRegressionとPagesが成功していること。"')

          # Human responsibility map
          one('PATCH_RESPONSIBILITY_MAP.md', '# パッチ責務マップ（Ver.202 基準）', '# パッチ責務マップ（Ver.203 基準）')
          one('PATCH_RESPONSIBILITY_MAP.md',
              '動的CSS **21本**、動的JS **34本**とロード順は変更していません。',
              'Ver.203では `mobile-fixes.js` に残っていた `7日間` ラベル補正を退役し、既にVer.196から責務を持つ `schedule-today-lock-v129.js` をスケジュール範囲ラベルの単独正本にしました。430px幅でも同じラベルとツールチップが維持されることを専用ブラウザ契約で固定しています。\n\n動的CSS **21本**、動的JS **34本**とロード順は変更していません。')
          one('PATCH_RESPONSIBILITY_MAP.md',
              '| 基盤・旧安定化ロジック | 高 | **Ver.202でToday状態除外のmobile重複を退役し、最終可視性をstable単独所有へ統一** |',
              '| 基盤・旧安定化ロジック | 高 | **Ver.203でmobileの7日間ラベル重複を退役し、schedule-today-lockを単独正本へ統一** |')
          one('PATCH_RESPONSIBILITY_MAP.md', '## Ver.194〜201 基盤JavaScript整理', '## Ver.194〜203 基盤JavaScript整理')
          one('PATCH_RESPONSIBILITY_MAP.md',
              '- Ver.202: mobile側のToday状態除外・snapshot読取・auto-hidden markerを退役し、状態除外＋mine/groupをstable単独所有へ統一',
              '- Ver.202: mobile側のToday状態除外・snapshot読取・auto-hidden markerを退役し、状態除外＋mine/groupをstable単独所有へ統一\n- Ver.203: mobile側の `patchScheduleRangeButtons()` を退役し、`7日間` 文言とツールチップを `schedule-today-lock-v129.js` 単独所有へ統一')
          one('PATCH_RESPONSIBILITY_MAP.md',
              '- `backup/ver201-before-today-owner`: `abeae4c79b887557a4077eb848173fce4b9a946e`',
              '- `backup/ver201-before-today-owner`: `abeae4c79b887557a4077eb848173fce4b9a946e`\n- `backup/ver202-before-mobile-schedule-overlap`: `8907773d063aef5e69c6215e2f847ed9617e1582`')
          one('PATCH_RESPONSIBILITY_MAP.md',
              'Todayの重複所有はVer.202で解消した。次は `schedule-today-lock-v129.js` と `mobile-fixes.js` に残る7日間表示補正の重複を監査し、schedule側へ正本化できるかを安全網先行で確認する。モバイル状態タブ・ヘッダー・メニュー・body-wide Observerの整理は別工程とする。',
              'Today・native日付・スケジュール7日間ラベルの重複所有はVer.203までに解消した。次は `stable-fixes-v108.js` の `patchStatusTabAutoScroll()` と `mobile-fixes.js` の状態タブスクロール処理を監査し、モバイル状態タブのスクロール所有を整理できるか安全網先行で確認する。ヘッダー・メニュー・body-wide Observerは別工程とする。')

          # Regression guide
          one('REGRESSION_TESTS.md', '# 回帰テスト基盤（Ver.202）', '# 回帰テスト基盤（Ver.203）')
          one('REGRESSION_TESTS.md',
              'このテスト群は、業務管理ボードの整理・改修で既存挙動や見た目を壊さないための安全網です。Ver.202ではVer.201で固定したToday最終可視性を維持したまま、mobile側の重複状態除外を退役し、stableをToday可視性の単独正本にします。',
              'このテスト群は、業務管理ボードの整理・改修で既存挙動や見た目を壊さないための安全網です。Ver.203ではmobile側の重複 `7日間` ラベル補正を退役し、`schedule-today-lock-v129.js` をスケジュール範囲ラベルの単独正本にします。')
          one('REGRESSION_TESTS.md', '- release versionが **202** であること', '- release versionが **203** であること')
          one('REGRESSION_TESTS.md',
              '- `schedule-today-lock-v129.js` が `7日間` 表示を所有すること',
              '- `schedule-today-lock-v129.js` が `7日間` 表示とツールチップを単独所有し、`mobile-fixes.js` に `patchScheduleRangeButtons()` が残っていないこと')
          one('REGRESSION_TESTS.md',
              '構造・契約テストは **67件**です。Ver.202では既存Today所有境界テストをstable単独所有契約へ更新し、件数は増やしません。',
              '構造・契約テストは **67件**です。Ver.203では既存schedule所有契約にmobile側退役確認を追加し、件数は増やしません。')
          one('REGRESSION_TESTS.md',
              'Ver.202では430px幅の最終可視性契約を維持し、mobileの旧 `data-workboard-auto-hidden` markerが付かないことも確認します。',
              'Ver.203ではVer.202のToday最終可視性契約を維持したうえで、430px幅で `7日間` 文言と「今日から7日間を表示します」ツールチップがschedule正本だけで復元される専用契約を追加します。')
          one('REGRESSION_TESTS.md', '通常UI件数は **67件**です。', '通常UI件数は **68件**です。')
          one('REGRESSION_TESTS.md', '## Ver.202で変更するもの', '## Ver.203で変更するもの')
          one('REGRESSION_TESTS.md',
              '- `mobile-fixes.js` のToday専用状態定数・storage snapshot読取・status fallback・`patchTodayView()` を退役\n- `data-workboard-auto-hidden` markerを退役\n- stableをToday状態除外＋mine/group＋最終可視性の単独正本へ統一\n- `release-manifest.js` をVer.202へ更新\n- static/browser契約と責務台帳をVer.202へ更新',
              '- `mobile-fixes.js` の `patchScheduleRangeButtons()` と `patchAll()` からの呼出しを退役\n- `schedule-today-lock-v129.js` を `7日間` 文言・ツールチップの単独正本として維持\n- `release-manifest.js` をVer.203へ更新\n- 430pxのscheduleラベル実ブラウザ契約と責務台帳をVer.203へ更新')
          one('REGRESSION_TESTS.md', '## Ver.202で変更しないもの', '## Ver.203で変更しないもの')
          one('REGRESSION_TESTS.md',
              '- `stable-fixes-v108.js` のToday判定意味論\n- mine/group担当者ルール\n- `date-keyboard-fix-v127.js`\n- モバイル状態タブ・ヘッダー・メニュー・スケジュール表示\n- dynamic CSS/JSの個数とロード順\n- Firebase書込経路\n- body-wide MutationObserver',
              '- `stable-fixes-v108.js` のToday判定意味論とnative日付制約\n- mine/group担当者ルール\n- `date-keyboard-fix-v127.js`\n- `schedule-today-lock-v129.js` のToday固定・prev/next制御\n- モバイル状態タブ・ヘッダー・メニュー\n- `resetScheduleAnchorBeforeRollingWeek()` の扱い（別責務として今回は変更しない）\n- dynamic CSS/JSの個数とロード順\n- Firebase書込経路\n- body-wide MutationObserver')
          one('REGRESSION_TESTS.md',
              'つまりVer.202は、**Todayの重複状態除外を退役し、既存の最終可視性意味論をstable単独所有へ整理する版**です。',
              'つまりVer.203は、**モバイル側の重複スケジュールラベル補正だけを退役し、schedule専用パッチへ表示責務を一本化する版**です。')
          one('REGRESSION_TESTS.md',
              '現在は **19件**です。Ver.202でもFirebase書込JavaScriptを変更しませんが、安全網として全件を継続実行します。',
              '現在は **19件**です。Ver.203でもFirebase書込JavaScriptを変更しませんが、安全網として全件を継続実行します。')
          one('REGRESSION_TESTS.md',
              '- `backup/ver201-before-today-owner`: `abeae4c79b887557a4077eb848173fce4b9a946e`',
              '- `backup/ver201-before-today-owner`: `abeae4c79b887557a4077eb848173fce4b9a946e`\n- `backup/ver202-before-mobile-schedule-overlap`: `8907773d063aef5e69c6215e2f847ed9617e1582`')
          one('REGRESSION_TESTS.md',
              'Ver.202がgreenになった後は、`schedule-today-lock-v129.js` と `mobile-fixes.js` に残る7日間表示補正の重複を監査します。Todayと日付は正本化済みなので、body-wide MutationObserver削減はさらにその後の独立工程とします。',
              'Ver.203がgreenになった後は、stable/mobile双方が触るモバイル状態タブの水平スクロール責務を監査します。ヘッダー・メニュー・body-wide MutationObserver削減はさらに後の独立工程とします。')

          Path('.github/workflows/tmp-v203-docs.yml').unlink()
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch-responsibilities.json PATCH_RESPONSIBILITY_MAP.md REGRESSION_TESTS.md .github/workflows/tmp-v203-docs.yml
          git commit -m "docs: record Ver.203 schedule label ownership"
          git push origin HEAD:refactor/mobile-schedule-label-v203
