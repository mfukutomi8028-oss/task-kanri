name: Apply Ver227 Baseline

on:
  push:
    branches:
      - feature/schedule-copy-validation-ux-v227
    paths:
      - .github/workflows/apply-v227-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/schedule-copy-validation-ux-v227
      - name: Update baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('patch-responsibilities.json')
          s = p.read_text(encoding='utf-8')
          old = '"baselineRelease": "226"'
          assert old in s
          p.write_text(s.replace(old, '"baselineRelease": "227"', 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch-responsibilities.json
          git commit -m "Ver.227 責務台帳baselineを更新 [skip ci]"
          git push origin HEAD:feature/schedule-copy-validation-ux-v227
