name: Apply activity detail fix v109

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-activity-detail-fix-v109.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch activity task click behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("app.js")
          source = app_path.read_text(encoding="utf-8")

          old = '''function bindActivityItemActions(root) {
            root.querySelectorAll("[data-activity-task]").forEach(button => {
              button.addEventListener("click", () => {
                const task = state.tasks.find(item => item.id === button.dataset.activityTask);
                if (!task) return;
                if (elements.activityDialog?.open) elements.activityDialog.close();
                state.layout = "tasks";
                state.taskLayout = "list";
                elements.searchInput.value = task.title;
                state.scope = makeScope(isCurrentUserOrGroupAssignee(task.assignee), isCompletedStatus(task.status));
                render();
                selectTask(task.id);
              });
            });
          '''

          new = '''function bindActivityItemActions(root) {
            root.querySelectorAll("[data-activity-task]").forEach(button => {
              button.addEventListener("click", () => {
                const task = state.tasks.find(item => item.id === button.dataset.activityTask);
                if (!task) return;
                if (elements.activityDialog?.open) elements.activityDialog.close();
                // 今日ビューを維持したまま、通常のタスクカードと同じ詳細表示だけを行う。
                selectTask(task.id);
              });
            });
          '''

          if old not in source:
              raise SystemExit("Target activity task handler was not found; no changes made.")

          app_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          if 'app.js?v=108' not in index:
              raise SystemExit("Expected app.js cache version was not found.")
          index_path.write_text(index.replace('app.js?v=108', 'app.js?v=109', 1), encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Fix activity task click to open detail in place"
          git push
