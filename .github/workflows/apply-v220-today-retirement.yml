name: Apply Ver220 Today canonical renderer

on:
  push:
    branches:
      - cleanup/stable-today-retirement-v220
    paths:
      - .github/workflows/apply-v220-today-retirement.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/stable-today-retirement-v220
          fetch-depth: 0
      - name: Apply exact audited replacements
        shell: python
        run: |
          from pathlib import Path
          path = Path('app.js')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'const openTasks = state.tasks.filter(t => !isCompletedStatus(t.status));',
                  'const openTasks = state.tasks.filter(t => !isCompletedStatus(t.status) && normalizeText(t.status) !== normalizeText("保留") && (!scopeHasMine() || isCurrentUserOrGroupAssignee(t.assignee)));',
                  'Today openTasks'
              ),
              (
                  '.filter(s => !scopeHasMine() || s.assignee === getCurrentUser())',
                  '.filter(s => !scopeHasMine() || isCurrentUserOrGroupAssignee(s.assignee))',
                  'Today schedule mine predicate'
              ),
              (
                  'const spare = openTasks.filter(t => !t.dueDate && !isUnsortedTask(t)).sort(compareSmartTasks).slice(0, 10);',
                  'const spare = openTasks.filter(t => !t.dueDate && !isUnsortedTask(t) && normalizeText(t.status) !== normalizeText("確認待ち")).sort(compareSmartTasks).slice(0, 10);',
                  'Today spare'
              )
          ]
          for before, after, label in replacements:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 target, got {count}')
              source = source.replace(before, after, 1)
          path.write_text(source, encoding='utf-8')
      - name: Commit canonical Today renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git rm .github/workflows/apply-v220-today-retirement.yml
          git commit -m "Ver.220 Today描画をapp.js正本へ統合"
          git push origin HEAD:cleanup/stable-today-retirement-v220
