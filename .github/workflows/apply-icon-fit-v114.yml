name: Apply icon fit v114

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-icon-fit-v114.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply icon fit and version update
        run: |
          python - <<'PY'
          from pathlib import Path

          style_path = Path("style.css")
          style = style_path.read_text(encoding="utf-8")
          marker = "/* v114: show the complete double border of item icons */"
          block = "\n\n/* v114: show the complete double border of item icons */\n.nav-item .nav-icon > img,\n.summary-card .summary-icon.icon-image > img,\n.summary-card .summary-icon > img {\n  width: 90% !important;\n  height: 90% !important;\n  max-width: 90% !important;\n  max-height: 90% !important;\n  object-fit: contain !important;\n  object-position: center center !important;\n  transform: none !important;\n  margin: auto !important;\n  display: block !important;\n}\n"
          if marker not in style:
              style += block
          style_path.write_text(style, encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = index.replace("?v=112", "?v=114").replace("?v=113", "?v=114")
          index = index.replace("Ver.112", "Ver.114").replace("Ver.113", "Ver.114")
          index_path.write_text(index, encoding="utf-8")

          for filename in ["config.js", "stable-fixes-v108.js", "mobile-fixes.js"]:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = text.replace("// v112:", "// v114:", 1).replace("// v113:", "// v114:", 1)
              text = text.replace('const VERSION = "112";', 'const VERSION = "114";', 1)
              text = text.replace('const VERSION = "113";', 'const VERSION = "114";', 1)
              text = text.replace("mobile-base-v112", "mobile-base-v114").replace("mobile-base-v113", "mobile-base-v114")
              text = text.replace("stable-v112", "stable-v114").replace("stable-v113", "stable-v114")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css index.html config.js stable-fixes-v108.js mobile-fixes.js
          git commit -m "Show complete icon borders and bump to v114"
          git push
