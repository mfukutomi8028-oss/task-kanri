name: Apply v108 source stability migration v2

on:
  push:
    paths:
      - .github/workflows/apply-v108-source-stability-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finalize Ver.250 release consistency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest = Path('release-manifest.js')
          text = manifest.read_text(encoding='utf-8')
          old = 'window.__WB_LEGACY_ICON_OBSERVER_V249__ = iconObserver;'
          new = 'window.__WB_LEGACY_ICON_OBSERVER_V250__ = iconObserver;'
          if text.count(old) != 1:
              raise SystemExit(f'manifest observer: expected 1, found {text.count(old)}')
          manifest.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_file = Path('test-harness/user-comment-boundary-v249.test.mjs')
          text = test_file.read_text(encoding='utf-8')
          old = '  assert.match(manifest, /version:\\s*"249"/);'
          new = '  assert.match(manifest, /version:\\s*"(?:249|250)"/);'
          if text.count(old) != 1:
              raise SystemExit(f'user-comment release assert: expected 1, found {text.count(old)}')
          test_file.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit release consistency fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-manifest.js test-harness/user-comment-boundary-v249.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No consistency changes needed"
            exit 0
          fi
          git commit -m "test: keep Ver.250 release contracts forward compatible"
          git push
