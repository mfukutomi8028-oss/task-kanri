name: Apply v108 source stability migration v2

on:
  push:
    paths:
      - .github/workflows/apply-v108-source-stability-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path("app.js")
          app = app_path.read_text(encoding="utf-8")

          app, range_count = re.subn(
              r'if \(state\.scheduleRange === "week"\) \{\s*const start = startOfWeekMonday\(anchor\);\s*return \{ start, end: addDays\(start, 7\) \};\s*\}',
              'if (state.scheduleRange === "week") {\n    const start = new Date(anchor);\n    start.setHours(0,0,0,0);\n    return { start, end: addDays(start, 7) };\n  }',
              app,
              count=1,
          )

          app = app.replace(
              'data-schedule-range="week">今週</button>',
              'data-schedule-range="week">7日間</button>',
              1,
          )

          anchor_marker = '      state.scheduleRange = button.dataset.scheduleRange;\n'
          anchor_insert = (
              anchor_marker
              + '      if (state.scheduleRange === "week") {\n'
              + '        state.scheduleAnchor = todayISO();\n'
              + '        localStorage.setItem(scheduleAnchorKey(), state.scheduleAnchor);\n'
              + '      }\n'
          )
          if anchor_marker in app and 'state.scheduleAnchor = todayISO();' not in app:
              app = app.replace(anchor_marker, anchor_insert, 1)

          app_path.write_text(app, encoding="utf-8")
          print(f"week range replacements: {range_count}")

          mobile_path = Path("mobile-fixes.js")
          mobile = mobile_path.read_text(encoding="utf-8")
          mobile = mobile.replace(
              '    installRollingWeekRangePatch();',
              '    // 7日間表示はapp.js本体で処理するため、Date.prototypeは変更しない。',
              1,
          )
          mobile = mobile.replace(
              '      resetScheduleAnchorBeforeRollingWeek(event);',
              '      // 7日間表示の基準日はapp.js本体で更新する。',
              1,
          )
          mobile_path.write_text(mobile, encoding="utf-8")
          PY

      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js mobile-fixes.js
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "Finalize v108 source stability fixes"
          git push