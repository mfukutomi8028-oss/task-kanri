name: Apply v108 source stability migration v2

on:
  push:
    paths:
      - .github/workflows/apply-v108-source-stability-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update legacy reply browser contract for Ver.250
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/comment-replies-v215.spec.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  expect(storedReply?.text).toContain('[[wb-reply:root-old-v215]]');"
          new = "  expect(storedReply?.text).toBe('ローカル返信を保存します');\n  expect(storedReply?.replyTo).toBe('root-old-v215');"
          if text.count(old) != 1:
              raise SystemExit(f'legacy reply assertion: expected 1, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit browser contract update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/comment-replies-v215.spec.mjs
          git diff --cached --check
          git commit -m "test: expect structured local replies in Ver.250"
          git push
