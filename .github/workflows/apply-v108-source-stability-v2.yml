name: Apply v108 source stability migration v2

on:
  push:
    paths:
      - .github/workflows/apply-v108-source-stability-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finalize Ver.250 offline reply release files
        shell: bash
        run: python scripts/finalize-v250-offline-reply.py

      - name: Commit release metadata and contract updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-manifest.js patch-responsibilities.json test-harness/user-comment-boundary-v249.test.mjs test-harness/notification-idempotency-v250.test.mjs test-harness/comment-reply-boundary-v251.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No release finalization changes needed"
            exit 0
          fi
          git commit -m "release: finalize Ver.250 offline reply contracts"
          git push
