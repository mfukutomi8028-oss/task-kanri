name: Apply v108 source stability migration v2

on:
  push:
    paths:
      - .github/workflows/apply-v108-source-stability-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply guarded Ver.250 offline reply patch
        shell: bash
        run: python scripts/patch-v250-offline-reply.py

      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js comment-reactions-v191.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "fix: preserve offline reply semantics"
          git push
