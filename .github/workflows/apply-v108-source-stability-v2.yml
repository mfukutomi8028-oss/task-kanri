name: Apply v108 source stability migration v2

on:
  push:
    paths:
      - .github/workflows/apply-v108-source-stability-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Ver.256 audit responsibility checkpoint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('patch-responsibilities.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          group = next(item for item in data['groups'] if item.get('id') == 'user-and-comments')
          note = (' Ver.256監査では、transient Firebase module失敗後のretry generationでreactionとreplyを近接実行しても、'
                  '同一pending firebasePromiseを共有してmodule取得・initializeApp・getDatabaseを1回に集約し、各writerのtransactionは1回ずつだけ実行されることをProtocol・Browser・Firebase Emulatorで固定した。'
                  '実RTDB Emulator監査ではmodule lifecycleを観測可能stubで固定しつつrunTransactionをEmulator実データへ接続し、revision 10→12、reaction 1件・reply 1件のみが保持されることを確認した。')
          if 'Ver.256監査では' not in group.get('reason', ''):
              group['reason'] = group.get('reason', '') + note
          data['priorityCandidates'] = [{
              'order': 1,
              'scope': ['comment-reactions-v191.js'],
              'goal': 'Ver.257監査：Firebase module取得成功後の初期化失敗→再試行境界。module import自体は成功した後にinitializeAppまたはgetDatabaseが一時失敗してもretry generationを不要に進めず、firebasePromiseだけを解放して同一module instanceから次回操作が回復し、reaction/replyのexpected-base transaction・single-flight・ghost state防止を維持するかをProtocol・Browserで確認する。監査段階では製品runtimeを変更しない。',
              'precondition': 'Ver.256監査のPR RegressionがProtocol・Browser・Firebase Emulatorすべてgreenでmainへmerge済み、main RegressionとPagesがgreen、release manifest / baselineReleaseが252で一致していること。'
          }]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit audit inventory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patch-responsibilities.json
          if git diff --cached --quiet; then
            echo "No inventory changes needed"
            exit 0
          fi
          git commit -m "docs: record Ver.256 Firebase single-flight audit"
          git push
