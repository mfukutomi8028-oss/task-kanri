name: Normalize Ver.187 workspace density baseline

on:
  push:
    branches:
      - refactor/workspace-density-v188

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: refactor/workspace-density-v188
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare exact Ver.187 worktree
        run: |
          git worktree add /tmp/ver187 509718dbaa2fcda1406cdc4ea117bdb073171fc6
          cp tests/workspace-density-v188.spec.mjs /tmp/ver187/tests/workspace-density-v188.spec.mjs
      - name: Install Ver.187 dependencies
        working-directory: /tmp/ver187
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: /tmp/ver187
        run: npx playwright install --with-deps chromium
      - name: Generate normalized baselines from Ver.187 product code
        working-directory: /tmp/ver187
        run: npx playwright test tests/workspace-density-v188.spec.mjs --update-snapshots
      - name: Copy normalized baseline images
        run: |
          rm -rf tests/workspace-density-v188.spec.mjs-snapshots
          cp -R /tmp/ver187/tests/workspace-density-v188.spec.mjs-snapshots tests/
      - name: Commit baseline images only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/workspace-density-v188.spec.mjs-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit"
            exit 0
          fi
          git commit -m "test: normalize Ver.187 workspace density baselines"
          git push origin HEAD:refactor/workspace-density-v188
