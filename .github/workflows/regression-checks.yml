name: Regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Fetch latest main for release collision check
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin main
          echo "WORK_BOARD_PR_BASE_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
      - name: Protocol and release-contract tests
        run: npm run test:protocol
      - name: Cross-check PowerShell release entrypoint
        shell: pwsh
        run: ./release-check.ps1

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression smoke tests
        run: npm run test:ui -- --shard=${{ matrix.shard }}/2
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # These isolated candidate-rule checks protect a future Auth rollout.
  # They operate on synthetic data in localhost Emulators, never live Firebase.
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Java for Firebase RTDB and Auth Emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Isolated Ver.568 candidate authorization rules
        run: npm run test:rules:v568
      - name: Ver.577 isolated lossless-schema read-only Rules
        run: npm run test:rules:v577
      - name: Ver.573 isolated Admin Auth and RTDB emulators
        run: npm run test:admin:v573

  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Java for Firebase RTDB Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Firebase Emulator write tests
        run: npm run test:firebase
      - name: Upload emulator report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-report-${{ github.run_id }}
          path: |
            playwright-report/
            firebase-debug.log
            database-debug.log
          if-no-files-found: ignore
          retention-days: 7

  regression:
    needs: [protocol, browser, authorization, firebase]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm all regression suites passed
        env:
          PROTOCOL_RESULT: ${{ needs.protocol.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          AUTHORIZATION_RESULT: ${{ needs.authorization.result }}
          FIREBASE_RESULT: ${{ needs.firebase.result }}
        run: |
          test "$PROTOCOL_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          test "$AUTHORIZATION_RESULT" = "success"
          test "$FIREBASE_RESULT" = "success"
