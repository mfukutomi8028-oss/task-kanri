name: Regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Protocol and release-contract tests
        run: npm run test:protocol
      - name: Cross-check PowerShell release entrypoint
        shell: pwsh
        run: ./release-check.ps1

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression smoke tests
        run: npm run test:ui
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Java for Firebase RTDB Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Firebase Emulator write tests
        run: npm run test:firebase
      - name: Upload emulator report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-report-${{ github.run_id }}
          path: |
            playwright-report/
            firebase-debug.log
            database-debug.log
          if-no-files-found: ignore
          retention-days: 7

  regression:
    needs: [protocol, browser, firebase]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm all regression suites passed
        env:
          PROTOCOL_RESULT: ${{ needs.protocol.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          FIREBASE_RESULT: ${{ needs.firebase.result }}
        run: |
          test "$PROTOCOL_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          test "$FIREBASE_RESULT" = "success"
