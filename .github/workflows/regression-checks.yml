name: Regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # An uncancelled full safety net after the daily parallel development window.
  schedule:
    - cron: '0 18 * * *' # 03:00 JST

permissions:
  contents: read

concurrency:
  # PR and main runs may be superseded. A nightly/manual full run has a
  # separate key and is never cancelled by new commits to main.
  group: regression-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      browser: ${{ steps.select.outputs.browser }}
      firebase: ${{ steps.select.outputs.firebase }}
      authorization: ${{ steps.select.outputs.authorization }}
      full_browser: ${{ steps.select.outputs.full_browser }}
      journal_parallel: ${{ steps.select.outputs.journal_parallel }}
      shard_count: ${{ steps.select.outputs.shard_count }}
      shards: ${{ steps.select.outputs.shards }}
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - name: Checkout change base and head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine required checks (fail closed when base is unavailable)
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/work-board-changed.txt"
          : > "$changed"
          if [[ "$EVENT_NAME" == 'pull_request' || "$EVENT_NAME" == 'push' ]]; then
            if [[ "$EVENT_NAME" == 'pull_request' ]]; then base="$PR_BASE_SHA"; else base="$PUSH_BASE_SHA"; fi
            if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              git diff --name-only "$base" HEAD > "$changed"
            else
              echo 'Diff base unavailable: force full integration verification' >&2
              echo '.github/workflows/regression-checks.yml' > "$changed"
            fi
          fi
          node test-harness/ci-scope-v590.mjs "$changed" "$EVENT_NAME" >> "$GITHUB_OUTPUT"
      - name: Explain check selection
        env:
          MODE: ${{ steps.select.outputs.mode }}
          TARGETS: ${{ steps.select.outputs.targets }}
          RUN_FIREBASE: ${{ steps.select.outputs.firebase }}
          RUN_AUTH: ${{ steps.select.outputs.authorization }}
        shell: bash
        run: |
          {
            echo '## CI verification scope'
            echo "Mode: $MODE"
            echo "Browser tests: ${TARGETS:-all or skipped}"
            echo "Firebase required: $RUN_FIREBASE"
            echo "Authorization required: $RUN_AUTH"
          } >> "$GITHUB_STEP_SUMMARY"

  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Restore npm downloads for the committed, integrity-checked package-lock.json.
      # npm ci removes stale node_modules and fails on a manifest/lockfile mismatch.
      - name: Restore npm package cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Fetch latest main for release collision check
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin main
          echo "WORK_BOARD_PR_BASE_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          echo "WORK_BOARD_PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
      - name: Protocol and release-contract tests
        shell: bash
        run: npm run test:protocol 2>&1 | tee protocol-results.log
      - name: Cross-check PowerShell release entrypoint
        shell: pwsh
        run: ./release-check.ps1
      - name: Upload Protocol failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-report-${{ github.run_id }}
          path: protocol-results.log
          if-no-files-found: ignore
          retention-days: 7

  browser:
    needs: scope
    if: ${{ needs.scope.outputs.browser == 'true' }}
    # Playwright 1.55 requires a supported OS; keep fonts and snapshots stable.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Restore npm downloads for the committed, integrity-checked package-lock.json.
      # npm ci removes stale node_modules and fails on a manifest/lockfile mismatch.
      - name: Restore npm package cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression (targeted PR/main or full daily)
        shell: bash
        env:
          FULL_BROWSER: ${{ needs.scope.outputs.full_browser }}
          JOURNAL_PARALLEL: ${{ needs.scope.outputs.journal_parallel }}
          TARGETS: ${{ needs.scope.outputs.targets }}
        run: |
          set -euo pipefail
          if [[ "$FULL_BROWSER" == 'true' ]]; then
            npm run test:ui -- --fully-parallel --shard=${{ matrix.shard }}/${{ needs.scope.outputs.shard_count }} 2>&1 | tee browser-results.log
          else
            read -r -a selected <<< "$TARGETS"
            if [[ ${#selected[@]} -eq 0 ]]; then echo 'Targeted checks must not be empty' >&2; exit 1; fi
            if [[ "$JOURNAL_PARALLEL" == 'true' ]]; then
              # JOURNAL's large single spec is split at individual test boundaries.
              npx playwright test "${selected[@]}" --fully-parallel --shard=${{ matrix.shard }}/${{ needs.scope.outputs.shard_count }} 2>&1 | tee browser-results.log
            else
              npx playwright test "${selected[@]}" 2>&1 | tee browser-results.log
            fi
          fi
      - name: Summarize browser test failures
        if: failure()
        run: node test-harness/ci-failure-digest.mjs browser-results.log "Browser shard ${{ matrix.shard }}/${{ needs.scope.outputs.shard_count }}"
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            browser-results.log
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

  # These isolated candidate-rule checks protect a future Auth rollout.
  # They operate on synthetic data in localhost Emulators, never live Firebase.
  authorization:
    needs: scope
    if: ${{ needs.scope.outputs.authorization == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Java for Firebase RTDB and Auth Emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Restore npm downloads for the committed, integrity-checked package-lock.json.
      # npm ci removes stale node_modules and fails on a manifest/lockfile mismatch.
      - name: Restore npm package cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Isolated Ver.568 candidate authorization rules
        run: npm run test:rules:v568
      - name: Ver.577 isolated lossless-schema read-only Rules
        run: npm run test:rules:v577
      - name: Ver.573 isolated Admin Auth and RTDB emulators
        run: npm run test:admin:v573
      - name: Ver.580 local Auth UI with real demo Emulators
        run: npm run test:auth:ui:v580
      - name: Ver.582 synthetic migration persistence and rollback
        run: npm run test:migration:v582

  firebase:
    needs: scope
    if: ${{ needs.scope.outputs.firebase == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Java for Firebase RTDB Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Restore npm downloads for the committed, integrity-checked package-lock.json.
      # npm ci removes stale node_modules and fails on a manifest/lockfile mismatch.
      - name: Restore npm package cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Firebase Emulator write tests
        shell: bash
        run: npm run test:firebase 2>&1 | tee firebase-results.log
      - name: Summarize emulator test failures
        if: failure()
        run: node test-harness/ci-failure-digest.mjs firebase-results.log "Firebase Emulator"
      - name: Upload emulator report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-report-${{ github.run_id }}
          path: |
            playwright-report/
            firebase-results.log
            test-results/**/error-context.md
            firebase-debug.log
            database-debug.log
          if-no-files-found: ignore
          retention-days: 7

  regression:
    needs: [scope, protocol, browser, authorization, firebase]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize and enforce selected required checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          MODE: ${{ needs.scope.outputs.mode }}
          NEED_BROWSER: ${{ needs.scope.outputs.browser }}
          NEED_AUTHORIZATION: ${{ needs.scope.outputs.authorization }}
          NEED_FIREBASE: ${{ needs.scope.outputs.firebase }}
          PROTOCOL_RESULT: ${{ needs.protocol.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          AUTHORIZATION_RESULT: ${{ needs.authorization.result }}
          FIREBASE_RESULT: ${{ needs.firebase.result }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## 回帰テスト結果'
            echo "対象コミット: \`$GITHUB_SHA\`"
            echo "検査モード: $MODE"
            echo ''
            echo '| テスト | 必要性 | 結果 |'
            echo '| --- | --- | --- |'
            printf '| Protocol | 必須 | %s |\n' "$PROTOCOL_RESULT"
            printf '| Browser | %s | %s |\n' "$NEED_BROWSER" "$BROWSER_RESULT"
            printf '| 認証・権限 | %s | %s |\n' "$NEED_AUTHORIZATION" "$AUTHORIZATION_RESULT"
            printf '| Firebase Emulator | %s | %s |\n' "$NEED_FIREBASE" "$FIREBASE_RESULT"
            echo ''
            echo 'skipped は不要な検査として意図的に省略した場合のみ正常です。'
            echo '全項目の実検証は毎日03:00 JSTまたは手動実行で行います。'
            echo "ログ：[Actions実行詳細]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SCOPE_RESULT" != success || "$PROTOCOL_RESULT" != success ]]; then
            echo 'Required scope or Protocol checks failed' >&2; exit 1
          fi
          for entry in "browser:$NEED_BROWSER:$BROWSER_RESULT" "authorization:$NEED_AUTHORIZATION:$AUTHORIZATION_RESULT" "firebase:$NEED_FIREBASE:$FIREBASE_RESULT"; do
            IFS=: read -r label required actual <<< "$entry"
            if [[ "$required" == true && "$actual" != success ]]; then
              echo "::error title=Regression $label::$label required but ended in $actual"; exit 1
            fi
            if [[ "$required" == false && "$actual" != skipped ]]; then
              echo "::error title=Unexpected $label::$label should be skipped, got $actual"; exit 1
            fi
          done
