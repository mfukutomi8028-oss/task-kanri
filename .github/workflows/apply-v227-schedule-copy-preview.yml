name: Apply Ver.227 schedule copy preview UX

on:
  push:
    branches:
      - feature/schedule-copy-preview-ux-v227
    paths:
      - .github/workflows/apply-v227-schedule-copy-preview.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: feature/schedule-copy-preview-ux-v227
          fetch-depth: 0

      - name: Apply Ver.227 migration
        run: python .github/scripts/apply-v227-schedule-copy-preview.py

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html ui-schedule-copy-v225.css tests/schedule-copy-v225.spec.mjs release-manifest.js test-harness/version-source-v194.test.mjs patch-responsibilities.json REGRESSION_TESTS.md
          git diff --cached --quiet && exit 0
          git commit -m "Ver.227 コピー前の全件確認と重複可視化を追加 [skip ci]"
          git push origin HEAD:feature/schedule-copy-preview-ux-v227
