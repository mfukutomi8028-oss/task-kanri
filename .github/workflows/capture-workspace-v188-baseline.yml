name: Capture Ver.187 workspace density baseline

on:
  push:
    branches:
      - refactor/workspace-density-v188

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/workspace-density-v188
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture workspace density baselines
        run: npx playwright test tests/workspace-density-v188.spec.mjs --update-snapshots
      - name: Commit baseline images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/workspace-density-v188.spec.mjs-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit"
            exit 0
          fi
          git commit -m "test: capture Ver.187 workspace density baselines"
          git push origin HEAD:refactor/workspace-density-v188
