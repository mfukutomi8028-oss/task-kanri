name: Temporary Ver.239 app patch

on:
  push:
    branches:
      - cleanup/task-quick-status-canonical-v239

permissions:
  contents: write

jobs:
  patch-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/task-quick-status-canonical-v239
      - name: Apply canonical quick-status patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          helper = '''function renderQuickTaskStatusControl(task) {
            const statuses = getStatusList();
            return `<div class="detail-status-control-v146">
              <div class="detail-status-label-v146">
                <strong>状態を変更</strong>
                <span>編集画面を開かずに更新</span>
              </div>
              <select class="detail-status-select-v146" data-quick-task-status data-operation-key="${escapeHtml(operationKey('task-status', task.id))}" aria-label="タスクの状態を変更">
                ${statuses.map(status => `<option value="${escapeHtml(status)}" ${status === task.status ? "selected" : ""}>${escapeHtml(status)}</option>`).join("")}
              </select>
            </div>`;
          }

          async function handleQuickTaskStatusChange(task, select) {
            const previousStatus = task.status;
            const targetStatus = normalizeStatus(select.value);
            if (!targetStatus || targetStatus === previousStatus) {
              select.value = previousStatus;
              return;
            }

            if (isCompletedStatus(targetStatus)) {
              // Completion keeps the existing memo-confirmation path. Reset first so
              // cancelling the prompt leaves the visible control on the real status.
              select.value = previousStatus;
              await completeTaskWithMemo(task.id);
              return;
            }

            const result = await changeStatus(task.id, targetStatus);
            if (!result?.ok && select.isConnected) select.value = previousStatus;
          }

          '''

          marker = 'function renderDetail() {'
          if text.count(marker) != 1:
            raise SystemExit(f'expected one renderDetail marker, found {text.count(marker)}')
          text = text.replace(marker, helper + marker, 1)

          meta = '    <div class="task-meta">${statusBadge(task.status)}${priorityBadge(task.priority)}${categoryBadge(task.category)}${task.pinned ? `<span class="badge priority-中">固定</span>` : ""}${task.recurrence && task.recurrence !== "none" ? `<span class="badge recurrence-badge">${escapeHtml(describeRecurrence(task))}</span>` : ""}</div>\n    ${detailAlerts(task)}'
          replacement = '    <div class="task-meta">${statusBadge(task.status)}${priorityBadge(task.priority)}${categoryBadge(task.category)}${task.pinned ? `<span class="badge priority-中">固定</span>` : ""}${task.recurrence && task.recurrence !== "none" ? `<span class="badge recurrence-badge">${escapeHtml(describeRecurrence(task))}</span>` : ""}</div>\n    ${renderQuickTaskStatusControl(task)}\n    ${detailAlerts(task)}'
          if text.count(meta) != 1:
            raise SystemExit(f'expected one detail meta block, found {text.count(meta)}')
          text = text.replace(meta, replacement, 1)

          bind = '  elements.detailBody.querySelector(\'[data-action="edit"]\')?.addEventListener("click", () => openTaskDialog(task));'
          bind_replacement = '  const quickStatusSelect = elements.detailBody.querySelector(\'[data-quick-task-status]\');\n  quickStatusSelect?.addEventListener("change", () => handleQuickTaskStatusChange(task, quickStatusSelect));\n' + bind
          if text.count(bind) != 1:
            raise SystemExit(f'expected one detail edit binding, found {text.count(bind)}')
          text = text.replace(bind, bind_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY
          node --check app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "実装: Ver.239 クイック状態変更をapp正本へ統合 [ver239-patched]"
          git push origin HEAD:cleanup/task-quick-status-canonical-v239
