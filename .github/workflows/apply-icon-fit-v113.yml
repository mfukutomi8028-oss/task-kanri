name: Apply icon fit adjustment v113

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-icon-fit-v113.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Slightly reduce item icon images
        run: |
          python - <<'PY'
          from pathlib import Path

          style_path = Path("style.css")
          style = style_path.read_text(encoding="utf-8")
          marker = "/* v113: item icon images fit fully inside their existing frames */"
          block = r'''

/* v113: item icon images fit fully inside their existing frames */
.nav-icon img,
.summary-icon.icon-image img,
.summary-icon img {
  width: 100% !important;
  height: 100% !important;
  object-fit: contain !important;
  transform: scale(0.94) !important;
  transform-origin: center center !important;
  display: block !important;
}
'''
          if marker not in style:
              style += block
          style_path.write_text(style, encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = index.replace("?v=112", "?v=113")
          index = index.replace("Ver.112", "Ver.113")
          index_path.write_text(index, encoding="utf-8")

          config_path = Path("config.js")
          config = config_path.read_text(encoding="utf-8")
          config = config.replace("// v112:", "// v113:", 1)
          config = config.replace('const VERSION = "112";', 'const VERSION = "113";', 1)
          config = config.replace("mobile-base-v112", "mobile-base-v113")
          config = config.replace("stable-v112", "stable-v113")
          config_path.write_text(config, encoding="utf-8")

          stable_path = Path("stable-fixes-v108.js")
          stable = stable_path.read_text(encoding="utf-8")
          stable = stable.replace("// v112:", "// v113:", 1)
          stable = stable.replace('const VERSION = "112";', 'const VERSION = "113";', 1)
          stable_path.write_text(stable, encoding="utf-8")

          mobile_path = Path("mobile-fixes.js")
          mobile = mobile_path.read_text(encoding="utf-8")
          mobile = mobile.replace("// v112:", "// v113:", 1)
          mobile = mobile.replace('const VERSION = "112";', 'const VERSION = "113";', 1)
          mobile_path.write_text(mobile, encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css index.html config.js stable-fixes-v108.js mobile-fixes.js
          git commit -m "Slightly reduce item icons and bump to v113"
          git push
