name: Ver225 inspect schedule copy foundations
on:
  push:
    branches:
      - feature/schedule-copy-v225
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show schedule persistence snippets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          lines = Path('app.js').read_text(encoding='utf-8').splitlines()
          needles = [
            'function normalizeSchedule',
            'function openScheduleDialog',
            'function saveScheduleFromForm',
            'function generateScheduleId',
            'function deleteSchedule',
            'scheduleDialog',
            'scheduleId',
            'persistSchedule',
            'transactionRecord(\'schedules\'',
          ]
          hits=[]
          for i,line in enumerate(lines,1):
              if any(n in line for n in needles): hits.append(i)
          ranges=[]
          for i in hits:
              a=max(1,i-18); b=min(len(lines),i+80)
              if ranges and a <= ranges[-1][1]+3:
                  ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
              else:
                  ranges.append((a,b))
          for a,b in ranges:
              print(f'--- app.js lines {a}-{b} ---')
              for n in range(a,b+1): print(f'{n:05d}: {lines[n-1]}')
          print('--- style recurrence/copy-related candidates ---')
          css = Path('style.css').read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(css,1):
              if any(n in line for n in ['dialog-actions','form-grid','weekday-checks','recurrence-options','schedule-dialog']):
                  print(f'{i:05d}: {line}')
          PY
