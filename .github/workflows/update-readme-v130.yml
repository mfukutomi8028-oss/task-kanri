name: Update README to v130

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-readme-v130.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("> **現在のバージョン：Ver.129**", "> **現在のバージョン：Ver.130**")

          file_line = "- `activity-dialog-v130.css`：お知らせ一覧ダイアログの余白・カード・レスポンシブ表示補正"
          anchor = "- `mine-icon-fix-v121.css`：左メニューの絞り込みアイコン補正"
          if file_line not in text and anchor in text:
              text = text.replace(anchor, anchor + "\n" + file_line)

          section = '''## v130 更新内容

- お知らせの「すべて見る」で開く一覧ダイアログに、外周・見出し・一覧間の十分な余白を追加しました。
- お知らせカードを1列表示に統一し、件名・変更内容・担当・状態・優先度・期限・更新日時を読み分けやすく再配置しました。
- 件名や変更内容を1行省略せず折り返して表示し、長いタスク名や変更内容も確認しやすくしました。
- タスクとスケジュールを左側のアクセント色で区別し、カードのホバー・影・枠を調整しました。
- スマホでは変更種別、日時、件名、変更内容、基本情報を縦方向へ整理して表示します。
- `index.html`に残っていた固定の`Ver.122`と`?v=122`を`Ver.130`へ更新しました。
- 今後はバージョン更新時に、`index.html`の固定表記・キャッシュ番号、`config.js`、READMEを必ず同じバージョンへ更新します。

'''
          marker = "## README更新ルール"
          if "## v130 更新内容" not in text and marker in text:
              text = text.replace(marker, section + marker)

          rule = "- バージョン更新時は、`index.html`の固定バージョン表記とすべての`?v=`、`config.js`の`VERSION`、READMEの現在バージョンを同じ番号へ揃えます。"
          if rule not in text:
              text = text.replace("- 中間版や不具合があった版も、欠番にせず経緯が分かる形で記録します。", "- 中間版や不具合があった版も、欠番にせず経緯が分かる形で記録します。\n" + rule)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit README update
        run: |
          if git diff --quiet -- .github/README.md; then
            echo "No README changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/README.md
          git commit -m "Document Ver.130 notification dialog and versioning"
          git push
