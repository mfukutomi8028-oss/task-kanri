name: Bump to v117 after mine icon restore

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bump-v117.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update version references
        run: |
          sed -i 's/v116/v117/g; s/Ver\.116/Ver.117/g; s/const VERSION = "116"/const VERSION = "117"/g' index.html config.js stable-fixes-v108.js mobile-fixes.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html config.js stable-fixes-v108.js mobile-fixes.js
          git commit -m "Restore mine icon border and bump to v117"
          git push
