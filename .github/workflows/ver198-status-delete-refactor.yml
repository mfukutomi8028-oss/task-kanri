name: Ver.198 guarded status-delete refactor

on:
  push:
    branches:
      - refactor/status-delete-canonical-v198

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact app.js replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'function isCompletedStatus(status) {\n  return normalizeText(status) === normalizeText(COMPLETED_STATUS);\n}\nfunction getDefaultOpenStatus() {',
                  'function isCompletedStatus(status) {\n  return normalizeText(status) === normalizeText(COMPLETED_STATUS);\n}\nfunction isProtectedDeleteStatus(status) {\n  return DEFAULT_STATUSES.some(item => normalizeText(item) === normalizeText(status));\n}\nfunction getDefaultOpenStatus() {'
              ),
              (
                  '    const protectedStatus = isCompletedStatus(status);',
                  '    const nameLocked = isCompletedStatus(status);\n    const deleteProtected = isProtectedDeleteStatus(status);\n    const deleteAttributes = deleteProtected\n      ? `disabled aria-disabled="true" title="${escapeHtml(status)}は基本状態のため削除できません"`\n      : (statuses.length <= 1 ? "disabled" : "");'
              ),
              ('${protectedStatus ? "is-protected" : ""}', '${nameLocked ? "is-protected" : ""}'),
              ('${protectedStatus ? "readonly" : ""}', '${nameLocked ? "readonly" : ""}'),
              ('${protectedStatus ? `<span class="protected-chip">固定</span>` : `<button class="mini-button" type="button" data-save-status="${escapeHtml(status)}">保存</button>`}', '${nameLocked ? `<span class="protected-chip">固定</span>` : `<button class="mini-button" type="button" data-save-status="${escapeHtml(status)}">保存</button>`}'),
              ('${protectedStatus || statuses.length <= 1 ? "disabled" : ""}', '${deleteAttributes}'),
              (
                  'async function deleteStatus(name) {\n  if (isCompletedStatus(name)) return toast("完了は削除できません", true);',
                  'async function deleteStatus(name) {\n  if (isProtectedDeleteStatus(name)) {\n    const message = isCompletedStatus(name) ? "完了は削除できません" : `${name}は基本状態のため削除できません`;\n    return toast(message, true);\n  }'
              )
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one app.js match, found {count}: {old[:100]!r}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Remove one-off workflow
        run: rm .github/workflows/ver198-status-delete-refactor.yml

      - name: Commit guarded refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/ver198-status-delete-refactor.yml
          git commit -m "Ver.198: move core status delete protection into app"
          git push origin HEAD:${GITHUB_REF_NAME}
