name: Capture Ver.186 workflow visual baseline

on:
  push:
    branches:
      - refactor/workflow-css-v186

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/workflow-css-v186
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture workflow baselines
        run: npx playwright test tests/workflow-inbox-archive-visual.spec.mjs --update-snapshots
      - name: Commit baseline images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/workflow-inbox-archive-visual.spec.mjs-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit"
            exit 0
          fi
          git commit -m "test: capture Ver.185 workflow visual baselines"
          git push origin HEAD:refactor/workflow-css-v186
