          body[data-wb-design="signal"] .signal-today-overview {min-width:0;border:1px solid var(--signal-border);border-radius:17px;background:var(--signal-card);overflow:hidden;box-shadow:var(--signal-shadow)}
          body[data-wb-design="signal"] .signal-today-overview > h3 {font-size:13px;padding:12px 16px;margin:0;color:var(--signal-muted);border-bottom:1px solid var(--signal-border)}
          body[data-wb-design="signal"] .signal-today-overview dl {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:0}
