          s+='''
          /* SIGNAL D3: 既存ノードと保存済み表示順を使い、カードを複製しない。 */
          body[data-wb-design="signal"].today-mode:not(.work-memo-mode-v167) .hero { min-height:88px !important;padding:18px 24px !important; }
          body[data-wb-design="signal"] #todayView[data-signal-today-composition="d3"] .today-grid {display:grid;grid-template-columns:minmax(0,1.16fr) minmax(320px,.84fr);gap:20px;align-items:start}
          body[data-wb-design="signal"] :is(.signal-today-primary,.signal-today-context) {display:flex;flex-direction:column;gap:18px;min-width:0}
          body[data-wb-design="signal"] .signal-today-shared {grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;min-width:0}
          body[data-wb-design="signal"] .signal-today-shared-title {grid-column:1/-1;margin:4px 0 0;color:var(--signal-text);font-size:17px}
