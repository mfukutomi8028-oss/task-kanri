              await page.reload({waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.WORK_BOARD_ASSETS_READY===true&&window.WORK_BOARD_APPEARANCE_VERSION==='536');
              expect(await order()).toEqual(custom);
              await page.locator('[data-today-panel-id="overdue"] .today-panel-shift-v531').first().click();
              const moved=['overdue','spare','schedule','due-today','unsorted'];expect(await order()).toEqual(moved);
              const saved=await savedOrder();
              await settings(page,width);await page.locator('input[name="wbPreferenceDesign"][value="classic"]').check();await page.locator('#wbCloseSettings').click();
              await expect(page.locator('.signal-today-overview')).toHaveCount(0);expect(await order()).toEqual(moved);expect(await savedOrder()).toBe(saved);
              await page.reload({waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.WORK_BOARD_ASSETS_READY===true&&window.WORK_BOARD_APPEARANCE_VERSION==='536');
              expect(await order()).toEqual(moved);expect(await data()).toEqual(originalData);
              console.log('SIGNAL_D3_TODAY_V536 '+JSON.stringify({width,height,defaultCounts:[1,2,2,2],filteredCounts:[1,2,1,1],savedOrder:moved}));
            });
          }
          '''
          p.write_text(s)
          PY
          git diff --check
          node --check app.js
          node --check tests/appearance-v536.spec.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Static regression
        run: npm run test:protocol
      - name: Browser acceptance
        run: npx playwright test tests/appearance-v536.spec.mjs tests/workspace-personal-order-v531.spec.mjs tests/today-sidebar-filters-v375.spec.mjs tests/app-lifecycle-listener-singleton-v508.spec.mjs --retries=0 --workers=1
      - name: Preserve tested candidate blobs (no branch updates)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,base64,hashlib,subprocess,urllib.request
          from pathlib import Path
          names=['app.js','ui-preferences-v536.js','ui-design-d3l-v535.css','test-harness/today-sidebar-filters-v375.test.mjs','tests/appearance-v536.spec.mjs']
          result={}
          for name in names:
            data=Path(name).read_bytes()
            expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(request,timeout=30) as response: actual=json.load(response)['sha']
            assert actual==expected
            result[name]=actual
          Path('candidate-blobs.json').write_text(json.dumps(result,indent=2))
          subprocess.run(['git','diff','--binary','--output=candidate.patch'],check=True)
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-d3-candidate-${{ github.run_id }}
          path: |
            candidate-blobs.json
            candidate.patch
            playwright-report/
            test-results/
          retention-days: 3
