name: SIGNAL secondary screen acceptance
on:
  push:
    branches: [qa/signal-d3-today-composition-20261027]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 41004b4e081aa42a2526933a7cb40a0def5d05c4
          persist-credentials: false
      - name: Apply scoped presentation candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          light='body[data-wb-design="signal"]'
          dark=light+'[data-wb-tone="midnight"]'
          css='\n/* SIGNAL：主要画面と詳細・編集の表示を整合。保存処理とDOM構造は変更しない。 */\n'
          def rule(scope,selector,declarations):
            global css
            css+=scope+' '+selector+' {'+declarations+'}\n'
          rule(light,'.main > .hero','min-height:88px !important;padding:18px 24px !important')
          rule(light,'.hero::after','display:none')
          rule(light,'.main :is(.todo-tools-v145,.task-control-row,.schedule-head,.work-memo-tools-v167)','border-radius:14px;box-shadow:var(--signal-shadow)')
          rule(light,'.main :is(.work-memo-view-v167,.work-memo-grid-v167)','background:transparent !important')
          rule(light,'.main .work-memo-view-v167','padding-top:0')
          rule(light,'.main .summary-card > div','min-width:0')
          rule(light,'.main .summary-card .summary-icon.icon-image','width:40px !important;height:40px !important;min-width:40px !important;flex:0 0 40px !important')
          rule(light,'.main .summary-card','gap:10px')
          cards=':is(#boardView .task-card,#timelineView .timeline-task)'
          rule(dark,cards,'background:var(--signal-subtle) !important;color:var(--signal-text) !important')
          for state,color in [('.overdue','var(--signal-danger-soft)'),('.due-today:not(.overdue)','#413d2b'),('.stale:not(.overdue):not(.due-today)','#39334d'),('.pinned:not(.overdue):not(.due-today):not(.stale)','#203c46')]:
            rule(dark,cards+state,'background:'+color+' !important')
          rule(dark,'.main :is(.task-title,.timeline-task-line strong,.task-table td > strong,.dashboard-head h3,.dashboard-panel h4,.dashboard-kpi strong,.count-label strong,.schedule-main strong,.work-memo-card-head-v167 h4)','color:var(--signal-text) !important')
          rule(dark,'.main :is(.due-line,.column-head em,.column-empty,.add-status-column p,.task-table small,.timeline-toolbar p,.timeline-row-label em,.dashboard-head p,.dashboard-kpi small,.dashboard-kpi > span,.count-label > span,.dashboard-empty,.schedule-time,.schedule-main p,.work-memo-meta-v167)','color:var(--signal-muted) !important')
          rule(dark,'.main :is(.add-status-column,.timeline-toolbar,.timeline-corner,.timeline-undated,.dashboard-head,.dashboard-kpi,.schedule-day-head,.schedule-card,.dashboard-panel,.work-memo-card-v167)','background:var(--signal-card) !important;border-color:var(--signal-border) !important;color:var(--signal-text) !important')
          rule(dark,'.main :is(.add-status-column > button,.timeline-actions > button,.timeline-move-button,.calendar-schedule,.work-memo-category-v167,.work-memo-tags-v167 > span,.work-memo-pin-v167,.work-memo-move-v531)','background:var(--signal-subtle) !important;color:var(--signal-text) !important;border-color:var(--signal-border) !important')
          rule(dark,'.main :is(.calendar-schedule span,.work-memo-drag-v531)','color:var(--signal-muted) !important')
          rule(dark,'.main :is(.work-memo-card-v167.is-pinned,.work-memo-pin-v167.active)','border-color:var(--signal-primary) !important')
          rule(dark,'.main .user-badge','background:var(--signal-primary-soft) !important;color:var(--signal-text) !important')
          rule(dark,'.main .task-table :is(th,td)','border-color:var(--signal-border) !important')
          rule(dark,'.main .dashboard-kpi.danger strong','color:var(--signal-danger) !important')
          rule(dark,'#scheduleView .calendar-cell.saturday .calendar-date','color:#a8caff !important')
          rule(dark,'#scheduleView .calendar-cell.holiday .calendar-date','color:var(--signal-danger) !important')
          dialogs=':is(#taskDialog,.detail-panel,#scheduleDialog,#workMemoDialogV167,#userManageDialog,#statusManageDialog,#categoryManageDialog)'
          rule(light,':is(#taskDialog,#scheduleDialog,#workMemoDialogV167)','border-radius:18px;border:1px solid var(--signal-border)')
          rule(dark,dialogs,'background:var(--signal-card) !important;color:var(--signal-text) !important')
          rule(dark,dialogs+' :is(.dialog-head,.dialog-actions,.template-row,.task-dialog-view-tabs-v319)','background:var(--signal-card) !important;color:var(--signal-text) !important;border-color:var(--signal-border) !important')
          rule(dark,dialogs+' :is(h2,h3,h4,label,.detail-title,.field-card strong,.description,.detail-status-label-v146 strong)','color:var(--signal-text) !important')
          rule(dark,dialogs+' :is(input:not([type=checkbox]):not([type=radio]):not([type=color]),select,textarea)','background:var(--signal-subtle) !important;color:var(--signal-text) !important;border-color:var(--signal-border) !important')
          rule(dark,dialogs+' :is(input,textarea)::placeholder','color:var(--signal-muted);opacity:1')
          rule(dark,dialogs+' :is(.ghost-button,.icon-button,.task-dialog-view-tab-v319)','background:var(--signal-subtle) !important;color:var(--signal-text) !important;border-color:var(--signal-border) !important')
          rule(dark,dialogs+' .primary-button','background:var(--signal-primary) !important;color:#141f39 !important;border-color:var(--signal-primary) !important')
          rule(dark,dialogs+' .danger-text','color:var(--signal-danger) !important')
          rule(dark,dialogs+' :is(.template-row p,.field-card small,.detail-status-label-v146 > span,.eyebrow)','color:var(--signal-muted) !important')
          rule(dark,'#taskDialog #detailBody','background:var(--signal-card) !important;color:var(--signal-text) !important')
          rule(dark,'#taskDialog #taskDialogDetailPanelV319 #detailBody :is(.detail-actions,.task-detail-tabs-v149,.task-comment-compose-v149,.detail-section,.field-card,.detail-status-control-v146,.check-item,.history-item,.comment)','background:var(--signal-subtle) !important;color:var(--signal-text) !important;border-color:var(--signal-border) !important')
          rule(dark,'#taskDialog #taskDialogDetailPanelV319:not([hidden]) > #detailBody > :is(.detail-actions,.task-detail-tabs-v149)','background:var(--signal-subtle) !important;border-color:var(--signal-border) !important')
          rule(dark,'#taskDialog #taskDialogDetailPanelV319:not([hidden]) > #detailBody .task-comment-compose-v149','background:var(--signal-subtle) !important;border-color:var(--signal-border) !important')
          rule(dark,'#taskDialog #detailBody :is(.task-detail-tab-v149,.task-comment-compose-toggle-v320,.related-schedule-card)','background:var(--signal-subtle) !important;color:var(--signal-text) !important;border-color:var(--signal-border) !important')
          rule(dark,'#taskDialog :is(.task-dialog-view-tab-v319.active,.task-detail-tab-v149.active)','background:var(--signal-primary-soft) !important;color:var(--signal-primary-ink) !important;border-color:var(--signal-primary) !important')
          rule(dark,'#taskDialog #detailBody :is(.check-item > span,.history-item strong,.comment strong,.activity-text)','color:var(--signal-text) !important')
          rule(dark,'#taskDialog #detailBody :is(.check-item.done > span,.history-item small,.history-item time,.comment small,.activity-time,.task-comment-compose-v149 p,.related-schedule-card span)','color:var(--signal-muted) !important')
          rule(dark,'#taskDialog .user-badge','background:var(--signal-primary-soft) !important;color:var(--signal-text) !important')
          css+='@media(max-width:860px){'+light+' .main > .hero {min-height:auto !important;padding:16px !important}}\n'
          p=Path('ui-design-d3l-v535.css');p.write_text(p.read_text()+css)
          p=Path('tests/appearance-v536.spec.mjs');s=p.read_text()
          s+='''
          // 実データ構造で主要画面と詳細・編集を検証する。外部通信と本番ルームを遮断する。
          async function secondaryRouteV536(page,width,layout){
            if(width<=860)await page.locator('.work-mobile-menu-button').click();
            else{await page.locator('.sidebar').hover();await expect(page.locator('body')).toHaveAttribute('data-desktop-sidebar-state','expanded');}
            await page.locator(layout==='memo'?'.nav-item[data-work-memo-layout]':`.nav-item[data-layout="${layout}"]`).click();
            if(width<=860)await expect(page.locator('body')).not.toHaveClass(/work-mobile-menu-open/);
            await settleVisualSidebar(page,width,page.viewportSize().height);
          }
          for(const[width,height]of[[1920,1080],[1366,768],[390,844],[320,800]])for(const tone of['bright','midnight']){
            test(`Ver.536 secondary screens and real dialogs in ${tone} at ${width}x${height}`,async({page})=>{
              test.setTimeout(150000);page.setDefaultTimeout(10000);
              const room=`test-v536-secondary-${tone}-${width}`,errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              await page.route('**/*',route=>new URL(route.request().url()).origin==='http://127.0.0.1:4173'?route.continue():route.abort('blockedbyclient'));
              await boot(page,width,room,height);
              await page.evaluate(roomId=>{
                if(!roomId.startsWith('test-v536-secondary-')||new URLSearchParams(location.search).get('room')!==roomId)throw new Error('Fixture room mismatch');
                const owner=localStorage.getItem('systemTaskUser'),now=Date.now();
                const date=offset=>{const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
                const tasks=[{id:'secondary-task',title:'画面確認用タスク',assignee:owner,status:'未着手',category:'PC',priority:'中',dueDate:date(-1),dueTime:'',description:'確認用の手順と補足メモです。',requester:'表示検証',tags:[],checklist:[{text:'未完了の確認項目',done:false},{text:'確認済みの項目',done:true}],comments:[{id:'comment-1',text:'受入検査のコメント',type:'作業メモ',author:owner,createdAt:now}],history:[],revision:1,createdBy:owner,updatedBy:owner,createdAt:now,updatedAt:now}];
                const schedules=[{id:'secondary-schedule',title:'表示確認用の予定',assignee:owner,category:'PC',startAt:date(0)+'T10:00:00',endAt:date(0)+'T11:00:00',location:'会議室',memo:'確認用の補足',relatedTaskId:'secondary-task',revision:1,createdBy:owner,updatedBy:owner,createdAt:now,updatedAt:now}];
                const memos={'secondary-memo':{id:'secondary-memo',title:'表示確認用の業務メモ',body:Array.from({length:30},(_,i)=>`${i+1}. 画面確認用の手順です。`).join(String.fromCharCode(10)),category:'手順',tags:['表示確認'],pinned:true,revision:1,createdBy:owner,updatedBy:owner,createdAt:now,updatedAt:now}};
                localStorage.setItem(`system-task-timeline-start:${roomId}`,date(-2));
                localStorage.setItem(`system-task-tasks:${roomId}`,JSON.stringify(tasks));
                localStorage.setItem(`system-task-schedules:${roomId}`,JSON.stringify(schedules));
                localStorage.setItem(`system-business-memos:${roomId}`,JSON.stringify(memos));
              },room);
              await page.reload({waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.WORK_BOARD_ASSETS_READY===true&&window.WORK_BOARD_APPEARANCE_VERSION==='536');
              const snapshot=()=>page.evaluate(r=>['system-task-tasks:','system-task-schedules:','system-business-memos:'].map(k=>localStorage.getItem(k+r)),room);
              const records=await snapshot();
              await settings(page,width);await page.locator('input[name="wbPreferenceDesign"][value="signal"]').check();
              await page.locator(`input[name="wbPreferenceTone"][value="${tone}"]`).check();await page.locator('#wbCloseSettings').click();
              const dir='test-results/signal-visual-v536';await mkdir(dir,{recursive:true});
              const capture=async name=>{
                await page.evaluate(()=>window.scrollTo(0,0));
                await page.screenshot({path:`${dir}/signal-${tone}-secondary-${name}-${width}x${height}.png`,animations:'disabled'});
                const overflow=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth);
                expect(overflow,name).toBeLessThanOrEqual(1);
              };
              const dialogCheck=async selector=>{
                const dialog=page.locator(selector);await expect(dialog).toBeVisible();
                const bounds=await dialog.evaluate(node=>{const b=node.getBoundingClientRect();return{left:b.left,right:b.right,width:innerWidth,overflow:node.scrollWidth-node.clientWidth};});
                expect(bounds.left).toBeGreaterThanOrEqual(-1);expect(bounds.right).toBeLessThanOrEqual(bounds.width+1);expect(bounds.overflow).toBeLessThanOrEqual(1);
                if(tone==='midnight'){
                  await expect(dialog).toHaveCSS('background-color','rgb(35, 46, 70)');
                  await readableContentV536(dialog.locator('h2').first(),selector);
                  for(const input of await dialog.locator('input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([type=color]),select,textarea').all())if(await input.isVisible())await readableContentV536(input,selector);
                }
              };
              await secondaryRouteV536(page,width,'tasks');await expect(page.locator('#boardView')).toBeVisible();
              if(tone==='midnight')await readableContentV536(page.locator('#boardView .task-title > span:not(.pin)').first(),'.task-card');
              await capture('board');
              await page.locator('#boardView [data-task-id="secondary-task"]').click();
              await page.locator('.detail-panel [data-action="edit"]').click();
              await dialogCheck('#taskDialog');await capture('task-edit');
              await page.locator('#taskDialogDetailTabV319').click();await expect(page.locator('#taskDialogDetailPanelV319')).toBeVisible();
              if(tone==='midnight'){
                await readableContentV536(page.locator('#taskDialog .detail-title'),'#taskDialog');
                await readableContentV536(page.locator('#taskDialog .description').first(),'#taskDialog');
                await readableContentV536(page.locator('#taskDialog .check-item:not(.done) > span').first(),'#taskDialog');
              }
              await capture('task-detail');
              await page.locator('#taskDialog .task-detail-tab-v149[data-tab="comments"]').click();await expect(page.locator('#taskDialog #commentText')).toBeVisible();
              if(tone==='midnight'){
                await readableContentV536(page.locator('#taskDialog #commentText'),'#taskDialog');
                await readableContentV536(page.locator('#taskDialog .activity-text').first(),'#taskDialog');
              }
              await capture('comments');await page.locator('#taskDialogEditTabV319').click();
              await expect(page.locator('#taskTitle')).toHaveValue('画面確認用タスク');
              await page.locator('#closeTaskDialog').click();await expect(page.locator('#taskDialog')).not.toBeVisible();
              if(await page.locator('.detail-panel.open').count())await page.locator('#closeDetail').click();
              for(const[layout,view,text]of[['list','#listView','#listView tbody tr[data-task-id] td:nth-child(3) strong'],['timeline','#timelineView','#timelineView .timeline-task strong']]){
                await page.locator(`[data-task-layout="${layout}"]`).click();await expect(page.locator(view)).toBeVisible();
                if(tone==='midnight')await readableContentV536(page.locator(text).first(),layout==='list'?'td':'.timeline-task');
                await capture(layout);
              }
              await page.locator('[data-stat-layout="dashboard"]').click();await expect(page.locator('#dashboardView')).toBeVisible();
              if(tone==='midnight')await readableContentV536(page.locator('#dashboardView .dashboard-kpi strong').first(),'.dashboard-kpi');
              await capture('dashboard');await secondaryRouteV536(page,width,'schedule');
              await page.locator('#scheduleView [data-schedule-mode="list"]').click();await expect(page.locator('#scheduleView .schedule-list')).toBeVisible();
              await capture('schedule-list');await page.locator('#scheduleView [data-schedule-id="secondary-schedule"]').click();
              await dialogCheck('#scheduleDialog');await capture('schedule-edit');await page.locator('#closeScheduleDialog').click();
              await page.locator('#scheduleView [data-schedule-mode="calendar"]').click();await expect(page.locator('#scheduleView .calendar-schedule').first()).toBeVisible();
              if(tone==='midnight'){
                await readableContentV536(page.locator('#scheduleView .calendar-schedule').first(),'.calendar-schedule');
                await readableContentV536(page.locator('#scheduleView .calendar-cell.saturday .calendar-date').first(),'.calendar-cell');
              }
              await capture('calendar');await secondaryRouteV536(page,width,'memo');
              const card=page.locator('[data-memo-sort-id="secondary-memo"]');await expect(card).toBeVisible();
              if(tone==='midnight')await readableContentV536(card.locator('h4'),'.work-memo-card-v167');
              await capture('memo');await card.locator('[data-memo-edit]').click();
              await dialogCheck('#workMemoDialogV167');await capture('memo-edit');await page.locator('#workMemoDialogV167 [data-memo-close]').first().click();
              await settings(page,width);await capture('settings');await page.locator('input[name="wbPreferenceDesign"][value="classic"]').check();await page.locator('#wbCloseSettings').click();
              expect(await snapshot()).toEqual(records);expect(errors).toEqual([]);
              console.log('SIGNAL_SECONDARY_V536 '+JSON.stringify({width,height,tone,recordsUnchanged:true}));
            });
          }
          '''
          p.write_text('\n'.join(line.rstrip() for line in s.splitlines())+'\n')
          PY
          git diff --check
          node --check tests/appearance-v536.spec.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Static regression
        run: npm run test:protocol > protocol.log 2>&1 || { tail -80 protocol.log; exit 1; }
      - name: Browser acceptance and Classic snapshots
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: secondary-results.json
        run: npx playwright test tests/appearance-v536.spec.mjs tests/workspace-density-v188.spec.mjs tests/task-dialog-polish-v321.spec.mjs tests/task-dialog-followup-v322.spec.mjs --retries=0 --workers=1 --reporter=line,html,json
      - name: Preserve candidate blobs without branch updates
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,base64,hashlib,urllib.request,subprocess
          from pathlib import Path
          result={}
          for name in ['ui-design-d3l-v535.css','tests/appearance-v536.spec.mjs']:
            data=Path(name).read_bytes()
            expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(request,timeout=30) as response: actual=json.load(response)['sha']
            assert actual==expected
            result[name]=actual
          Path('candidate-blobs.json').write_text(json.dumps(result,indent=2))
          subprocess.run(['git','diff','--binary','--output=candidate.patch'],check=True)
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-secondary-${{ github.run_id }}
          path: |
            candidate.patch
            candidate-blobs.json
            secondary-results.json
            protocol.log
            playwright-report/
            test-results/
          retention-days: 3
