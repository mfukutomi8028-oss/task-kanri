name: SIGNAL secondary screen acceptance
on:
  push:
    branches: [qa/signal-d3-today-composition-20261027]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0ca62fd5b1bcc5995fd3f405da46c12cdedd4aa2
          persist-credentials: false
      - name: Correct verified mobile bounds and image sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ui-design-d3l-v535.css');s=p.read_text()
          s+='''
          /* アイコン本体と枠を同じ寸法にする。SVG資産と利用者の色設定は変更しない。 */
          body[data-wb-design="signal"] .main .summary-grid {--wb-summary-icon-size:40px}
          body[data-wb-design="signal"] .hero-room-badge[hidden] {display:none !important}
          @media(max-width:860px){
            body[data-wb-design="signal"] .work-memo-card-head-v167 {flex-wrap:wrap}
            body[data-wb-design="signal"] .work-memo-card-head-v167 > div:first-child {flex:1 0 100%}
            body[data-wb-design="signal"] .work-memo-card-head-v167 > .work-memo-pin-v167 {margin-left:auto}
            /* 管理項目は本文と操作を段分けし、横スクロールで隠れるボタンをなくす。 */
            body[data-wb-design="signal"] :is(#userManageDialog,#statusManageDialog,#categoryManageDialog) form {padding:18px}
            body[data-wb-design="signal"] #userManageDialog .user-add-row {grid-template-columns:minmax(0,1fr) 44px}
            body[data-wb-design="signal"] #userManageDialog .user-add-row > .primary-button {grid-column:1 / -1}
            body[data-wb-design="signal"] #userManageDialog .user-add-row > input {min-width:0;width:100%}
            body[data-wb-design="signal"] #userManageDialog .user-add-row > input[type="color"] {width:44px;height:44px}
            body[data-wb-design="signal"] :is(#statusManageDialog,#categoryManageDialog) :is(.status-add-row,.category-add-row) {grid-template-columns:minmax(0,1fr) auto}
            body[data-wb-design="signal"] :is(#statusManageDialog,#categoryManageDialog) input {min-width:0;max-width:100%}
            body[data-wb-design="signal"] #userManageDialog .user-list-item,
            body[data-wb-design="signal"] :is(#statusManageDialog,#categoryManageDialog) :is(.status-list-item,.category-list-item) {display:grid;grid-template-columns:28px minmax(0,1fr) !important;gap:8px}
            body[data-wb-design="signal"] #userManageDialog .user-list-item .user-badge {justify-self:start;white-space:nowrap}
            body[data-wb-design="signal"] :is(#userManageDialog,#statusManageDialog,#categoryManageDialog) :is(.user-list-actions,.status-list-actions,.category-list-actions) {grid-column:2;display:flex;flex-wrap:wrap;min-width:0;max-width:100%;gap:8px}
            body[data-wb-design="signal"] :is(#userManageDialog,#statusManageDialog,#categoryManageDialog) .mini-button {white-space:nowrap}
          }
          '''
          p.write_text(s)
          p=Path('tests/appearance-v536.spec.mjs');s=p.read_text()
          needle="await capture('board');"
          assert s.count(needle)==1
          replacement='''await expect(page.locator('#roomNameBadge')).toBeHidden();
                        const summaryFits=await page.locator('.main > .summary-grid .summary-card').evaluateAll(cards=>cards.map(card=>{
                          const image=card.querySelector('img').getBoundingClientRect(),text=card.querySelector('div').getBoundingClientRect();
                          return {fits:image.right<=text.left+1,imageWidth:image.width};
                        }));
                        expect(summaryFits).toHaveLength(4);
                        for(const item of summaryFits){expect(item.fits).toBe(true);expect(item.imageWidth).toBe(40);}
                        await capture('board');'''
          s=s.replace(needle,replacement)
          needle="expect(Math.abs(widths.card-widths.grid)).toBeLessThanOrEqual(1);"
          assert s.count(needle)==1
          s=s.replace(needle,needle+'''
                        const headerFit=await card.evaluate(n=>{
                          const heading=n.querySelector('.work-memo-card-head-v167 > div').getBoundingClientRect();
                          const controls=n.querySelector('.work-memo-sort-controls-v531').getBoundingClientRect();
                          return heading.bottom<=controls.top+1;
                        });
                        expect(headerFit).toBe(true);
          ''')
          p.write_text('\n'.join(x.rstrip() for x in s.splitlines())+'\n')
          PY
          git diff --check
          node --check tests/appearance-v536.spec.mjs
      - name: Preserve candidate blobs without branch updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,base64,hashlib,urllib.request,subprocess
          from pathlib import Path
          result={}
          for name in ['ui-design-d3l-v535.css','tests/appearance-v536.spec.mjs']:
            data=Path(name).read_bytes()
            expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(request,timeout=30) as response: actual=json.load(response)['sha']
            assert actual==expected
            result[name]=actual
          Path('candidate-blobs.json').write_text(json.dumps(result,indent=2))
          subprocess.run(['git','diff','--binary','--output=candidate.patch'],check=True)
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: signal-secondary-source-${{ github.run_id }}
          path: |
            candidate.patch
            candidate-blobs.json
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Install identical Chromium without reconfiguring runner packages
        timeout-minutes: 3
        run: npx playwright install chromium
      - name: Static regression
        run: npm run test:protocol > protocol.log 2>&1 || { tail -80 protocol.log; exit 1; }
      - name: Browser acceptance and Classic snapshots
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: secondary-results.json
        run: npx playwright test tests/appearance-v536.spec.mjs tests/workspace-density-v188.spec.mjs tests/task-dialog-polish-v321.spec.mjs tests/task-dialog-followup-v322.spec.mjs --retries=0 --workers=2 --fully-parallel --reporter=line,html,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-secondary-${{ github.run_id }}
          path: |
            candidate.patch
            candidate-blobs.json
            secondary-results.json
            protocol.log
            playwright-report/
            test-results/
          retention-days: 3
