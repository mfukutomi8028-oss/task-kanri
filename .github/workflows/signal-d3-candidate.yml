name: SIGNAL secondary screen acceptance
on:
  push:
    branches: [qa/signal-d3-today-composition-20261027]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2913403227019f90cf01edc6a357de34767f504a
          persist-credentials: false
      - name: Resolve verified mobile room-badge specificity conflict
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ui-design-d3l-v535.css')
          s=p.read_text()
          before='body[data-wb-design="signal"] .hero-room-badge[hidden] {display:none !important}'
          after='body[data-wb-design="signal"] #roomNameBadge.hero-room-badge[hidden] {display:none !important}'
          assert s.count(before)==1
          p.write_text(s.replace(before,after))
          PY
          git diff --check
          node --check tests/appearance-v536.spec.mjs
      - name: Preserve exact candidate blobs without branch updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,base64,hashlib,urllib.request,subprocess
          from pathlib import Path
          result={}
          for name in ['ui-design-d3l-v535.css','tests/appearance-v536.spec.mjs']:
            data=Path(name).read_bytes()
            expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(request,timeout=30) as response: actual=json.load(response)['sha']
            assert actual==expected
            result[name]=actual
          Path('candidate-blobs.json').write_text(json.dumps(result,indent=2))
          subprocess.run(['git','diff','--binary','--output=candidate.patch'],check=True)
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: signal-secondary-source-${{ github.run_id }}
          path: |
            candidate.patch
            candidate-blobs.json
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Install canonical Chromium and rendering dependencies
        run: npx playwright install --with-deps chromium
      - name: Static regression
        run: npm run test:protocol > protocol.log 2>&1 || { tail -80 protocol.log; exit 1; }
      - name: Browser acceptance and unchanged Classic snapshots
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: secondary-results.json
        run: npx playwright test tests/appearance-v536.spec.mjs tests/workspace-density-v188.spec.mjs tests/task-dialog-polish-v321.spec.mjs tests/task-dialog-followup-v322.spec.mjs --retries=0 --workers=2 --fully-parallel --reporter=line,html,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-secondary-${{ github.run_id }}
          path: |
            candidate.patch
            candidate-blobs.json
            secondary-results.json
            protocol.log
            playwright-report/
            test-results/
          retention-days: 3
