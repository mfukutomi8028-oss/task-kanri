name: SIGNAL D3 Today candidate
on:
  push:
    branches: [qa/signal-d3-today-composition-20261027]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8448db736b455089f178e73abcad32bd09f86d5c
          persist-credentials: false
      - name: Correct populated Today presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ui-design-d3l-v535.css');s=p.read_text()
          s+='''
          /* D3実画面確認：旧優先度CSSの白背景と暗色文字の組み合わせを解消する。
           * 優先度の左端色・バッジ・担当者の色は保持する。 */
          body[data-wb-design="signal"].today-mode:not(.work-memo-mode-v167) .hero::after {display:none}
          body[data-wb-design="signal"][data-wb-tone="midnight"] #todayView .task-card {
            background:var(--signal-subtle) !important;
          }
          body[data-wb-design="signal"][data-wb-tone="midnight"] #todayView .task-card.overdue {
            background:var(--signal-danger-soft) !important;
          }
          body[data-wb-design="signal"][data-wb-tone="midnight"] #todayView .task-card.due-today:not(.overdue) {
            background:#413d2b !important;
          }
          body[data-wb-design="signal"][data-wb-tone="midnight"] #todayView .task-card.stale:not(.overdue):not(.due-today) {
            background:#39334d !important;
          }
          body[data-wb-design="signal"][data-wb-tone="midnight"] #todayView .task-card.pinned:not(.overdue):not(.due-today):not(.stale) {
            background:#203c46 !important;
          }
          body[data-wb-design="signal"][data-wb-tone="midnight"] #todayView .user-badge {
            background:var(--signal-primary-soft) !important;
            color:var(--signal-text) !important;
          }
          body[data-wb-design="signal"][data-wb-tone="midnight"] #todayView :is(.due-line,.schedule-time,.schedule-main p) {
            color:var(--signal-muted) !important;
          }
          @media(max-width:860px) {
            body[data-wb-design="signal"] #todayView[data-signal-today-composition="d3"] .activity-actions {
              display:flex !important;flex-wrap:wrap !important;width:100%;max-width:100%;min-width:0;
            }
            body[data-wb-design="signal"] #todayView[data-signal-today-composition="d3"] .activity-actions > button {
              flex:1 1 130px;min-width:0 !important;max-width:100%;white-space:normal !important;
            }
            body[data-wb-design="signal"] #todayView[data-signal-today-composition="d3"] .today-action-divider-v220 {display:none}
          }
          '''
          p.write_text(s)
          p=Path('tests/appearance-v536.spec.mjs');s=p.read_text()
          needle="    await readableContentV536(page.locator('[data-signal-metric=\"overdue\"] strong'),'.signal-today-overview');"
          assert s.count(needle)==1
          extra='''
              // 外側カードの色だけでなく、データが入った要素の実際の文字と背景を検査する。
              const actionBounds = await page.locator('#todayView .activity-actions button').evaluateAll(buttons => buttons.map(button => {
                const b=button.getBoundingClientRect(), parent=button.closest('.activity-panel').getBoundingClientRect();
                return {text:button.textContent, fits:b.width>0&&b.left>=parent.left-1&&b.right<=parent.right+1&&button.scrollWidth<=button.clientWidth+1};
              }));
              expect(actionBounds.filter(button=>!button.fits)).toEqual([]);
              if(tone==='midnight') {
                for(const title of await page.locator('#todayView .task-card .task-title > span:not(.pin)').all())
                  await readableContentV536(title,'.task-card');
                for(const label of await page.locator('#todayView .schedule-time span').all())
                  await readableContentV536(label,'.schedule-card');
                for(const badge of await page.locator('#todayView .user-badge').all())
                  await readableContentV536(badge,'.user-badge');
                const priorityColors=await page.locator('#todayView .task-card').evaluateAll(cards=>cards.map(card=>getComputedStyle(card).borderLeftColor));
                expect(priorityColors.every(color=>color==='rgb(75, 145, 226)')).toBe(true);
              }
          '''
          s=s.replace(needle,needle+'\n'+extra)
          needle="  const custom=['spare','overdue','schedule','due-today','unsorted'];"
          assert s.count(needle)==1
          extra='''
            // 元のパネルを左右列をまたいでドラッグでき、再描画後も保存順が一致する。
            if(width>860){
              await page.evaluate(()=>window.scrollTo(0,0));
              await settleVisualSidebar(page,width,height);
              await page.locator('[data-today-panel-id="overdue"] .today-panel-drag-v531')
                .dragTo(page.locator('[data-today-panel-id="schedule"]'));
              await expect.poll(order).toEqual(['schedule','overdue','due-today','unsorted','spare']);
              expect(JSON.parse(await savedOrder())).toEqual(['schedule','overdue','due-today','unsorted','spare']);
            }
          '''
          s=s.replace(needle,extra+'\n'+needle)
          p.write_text('\n'.join(line.rstrip() for line in s.splitlines())+'\n')
          PY
          git diff --check
          node --check app.js
          node --check tests/appearance-v536.spec.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Static regression
        run: npm run test:protocol
      - name: Browser acceptance and Classic snapshots
        run: npx playwright test tests/appearance-v536.spec.mjs tests/workspace-personal-order-v531.spec.mjs tests/today-sidebar-filters-v375.spec.mjs tests/app-lifecycle-listener-singleton-v508.spec.mjs tests/workspace-density-v188.spec.mjs --retries=0 --workers=1
      - name: Preserve candidate blobs (no branch updates)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,base64,hashlib,subprocess,urllib.request
          from pathlib import Path
          names=['app.js','ui-preferences-v536.js','ui-design-d3l-v535.css','test-harness/today-sidebar-filters-v375.test.mjs','tests/appearance-v536.spec.mjs','docs/SIGNAL_APPEARANCE_V536.md']
          result={}
          for name in names:
            data=Path(name).read_bytes()
            expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(request,timeout=30) as response: actual=json.load(response)['sha']
            assert actual==expected
            result[name]=actual
          Path('candidate-blobs.json').write_text(json.dumps(result,indent=2))
          subprocess.run(['git','diff','--binary','--output=candidate.patch'],check=True)
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-d3-candidate-${{ github.run_id }}
          path: |
            candidate-blobs.json
            candidate.patch
            playwright-report/
            test-results/
          retention-days: 3
