name: SIGNAL secondary screen acceptance
on:
  push:
    branches: [qa/signal-d3-today-composition-20261027]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4f47df7eb4bf913ee06397b1179c5172bd672928
          persist-credentials: false
      - name: Finish screenshot findings and management dialogs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ui-design-d3l-v535.css');s=p.read_text()
          light='body[data-wb-design="signal"]'
          scope=light+'[data-wb-tone="midnight"]'
          manage=':is(#userManageDialog,#statusManageDialog,#categoryManageDialog)'
          extra='\n/* SIGNAL：実画面で残っていた旧配色。操作と保存値は変更しない。 */\n'
          for sel,decl in [
            ('#listView .task-table thead th','background:var(--signal-subtle) !important;color:var(--signal-muted) !important'),
            ('#listView .task-table thead th:is(.active,:hover,:focus-visible)','background:var(--signal-primary-soft) !important;color:var(--signal-primary-ink) !important'),
            (manage+' :is(.user-list-item,.status-list-item,.category-list-item)','background:var(--signal-subtle) !important;border-color:var(--signal-border) !important;color:var(--signal-text) !important'),
            (manage+' .mini-button','background:var(--signal-card) !important;color:var(--signal-text) !important;border-color:var(--signal-border) !important'),
            (manage+' .mini-button.danger','color:var(--signal-danger) !important'),
            (manage+' .dialog-lead','color:var(--signal-muted) !important'),
            (manage+' .user-badge','background:var(--signal-primary-soft) !important;color:var(--signal-text) !important'),
            ('.date-segment-control-v127','background:var(--signal-subtle) !important;color:var(--signal-text) !important;border-color:var(--signal-border) !important'),
            ('.date-segment-control-v127:focus-within','background:var(--signal-subtle) !important;border-color:var(--signal-primary) !important'),
            ('.date-segment-control-v127.is-invalid','border-color:var(--signal-danger) !important'),
            ('.date-segment-control-v127 > :is(.date-segment-separator-v127,button.date-segment-picker-v127)','color:var(--signal-muted) !important'),
            ('.work-mobile-status-tabs','background:var(--signal-canvas) !important'),
            ('.work-mobile-status-tab','background:var(--signal-subtle) !important;color:var(--signal-text) !important;border-color:var(--signal-border) !important'),
            ('.work-mobile-status-tab.active','background:var(--signal-primary-soft) !important;color:var(--signal-primary-ink) !important;border-color:var(--signal-primary) !important'),
            ('#boardView .column-head','background:var(--signal-subtle) !important;color:var(--signal-text) !important;border-color:var(--signal-border) !important'),
            ('#listView .bulk-bar','background:var(--signal-subtle) !important;color:var(--signal-text) !important;border-color:var(--signal-border) !important'),
            ('#timelineView .timeline-cell:is(.holiday,.saturday)','background:var(--signal-subtle) !important'),
            ('#timelineView .timeline-date span','color:var(--signal-muted) !important'),
            ('#timelineView .timeline-date.holiday strong','color:var(--signal-danger) !important'),
            ('#timelineView .timeline-date.saturday strong','color:#a8caff !important'),
            ('#dashboardView .attention-item','background:var(--signal-subtle) !important;border-color:var(--signal-border) !important'),
            ('#dashboardView .attention-item > strong','color:var(--signal-text) !important'),
            ('#workMemoDialogV167 .work-memo-pin-row-v167','background:var(--signal-subtle) !important;border-color:var(--signal-border) !important;color:var(--signal-text) !important'),
            ('#workMemoDialogV167 .work-memo-pin-copy-v168 strong','color:var(--signal-text) !important'),
            ('#workMemoDialogV167 .work-memo-pin-copy-v168 small','color:var(--signal-muted) !important')]:
            extra+=scope+' '+sel+' {'+decl+'}\n'
          extra+=light+' .hero::after {display:none !important}\n'
          extra+=light+' #listView .bulk-bar[hidden] {display:none !important}\n'
          extra+='@media(max-width:860px){'+light+' #workMemoViewV167 .work-memo-grid-v167 {width:100%;grid-template-columns:minmax(0,1fr) !important;justify-items:stretch}'+light+' #workMemoViewV167 .work-memo-card-v167 {width:100%;min-width:0}}\n'
          p.write_text(s+extra)
          p=Path('tests/appearance-v536.spec.mjs');s=p.read_text()
          needle="await capture('settings');await page.locator('input[name=\"wbPreferenceDesign\"][value=\"classic\"]').check();"
          assert s.count(needle)==1
          replacement='''await capture('settings');
                        for(const [button,id,close] of [
                          ['manageUsers','#userManageDialog','#closeUserManage'],
                          ['manageStatuses','#statusManageDialog','#closeStatusManage'],
                          ['manageCategories','#categoryManageDialog','#closeCategoryManage']
                        ]){
                          await page.locator(`[data-wb-existing-setting="${button}"]`).click();
                          await expect(page.locator('#wbSettingsDialog')).not.toBeVisible();
                          await dialogCheck(id);await capture(button);
                          if(tone==='midnight'&&button==='manageUsers')await readableContentV536(page.locator(id+' .user-badge').first(),'.user-badge');
                          await page.locator(close).click();await expect(page.locator(id)).not.toBeVisible();
                          await settings(page,width);
                        }
                        await page.locator('input[name="wbPreferenceDesign"][value="classic"]').check();'''
          s=s.replace(needle,replacement)
          needle="await capture(layout);"
          assert s.count(needle)==1
          s=s.replace(needle,'''if(layout==='list'){
                          await expect(page.locator('#listView .bulk-bar')).toBeHidden();
                          await page.locator('#listView [data-bulk-id="secondary-task"]').check();
                          await expect(page.locator('#listView .bulk-bar')).toBeVisible();
                          await page.locator('#listView [data-bulk-id="secondary-task"]').uncheck();
                          await expect(page.locator('#listView .bulk-bar')).toBeHidden();
                          if(tone==='midnight')await expect(page.locator('#listView th').nth(2)).toHaveCSS('background-color','rgb(41, 56, 82)');
                        }
                        await capture(layout);''')
          needle="await capture('memo');await card.locator('[data-memo-edit]').click();"
          assert s.count(needle)==1
          s=s.replace(needle,'''if(width<=860){
                        const widths=await card.evaluate(n=>({card:n.getBoundingClientRect().width,grid:n.parentElement.getBoundingClientRect().width}));
                        expect(Math.abs(widths.card-widths.grid)).toBeLessThanOrEqual(1);
                      }
                      await capture('memo');await card.locator('[data-memo-edit]').click();''')
          needle="await readableContentV536(dialog.locator('h2').first(),selector);"
          assert s.count(needle)==1
          s=s.replace(needle,needle+'''
                          for(const control of await dialog.locator('.date-segment-control-v127').all())if(await control.isVisible()){
                            await expect(control).toHaveCSS('background-color','rgb(41, 56, 82)');
                            await readableContentV536(control.locator('.date-segment-picker-v127'),selector);
                          }
          ''')
          p.write_text('\n'.join(x.rstrip() for x in s.splitlines())+'\n')
          PY
          git diff --check
          node --check tests/appearance-v536.spec.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Static regression
        run: npm run test:protocol > protocol.log 2>&1 || { tail -80 protocol.log; exit 1; }
      - name: Browser acceptance and Classic snapshots
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: secondary-results.json
        run: npx playwright test tests/appearance-v536.spec.mjs tests/workspace-density-v188.spec.mjs tests/task-dialog-polish-v321.spec.mjs tests/task-dialog-followup-v322.spec.mjs --retries=0 --workers=1 --reporter=line,html,json
      - name: Preserve candidate blobs without branch updates
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,base64,hashlib,urllib.request,subprocess
          from pathlib import Path
          result={}
          for name in ['ui-design-d3l-v535.css','tests/appearance-v536.spec.mjs']:
            data=Path(name).read_bytes()
            expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(request,timeout=30) as response: actual=json.load(response)['sha']
            assert actual==expected
            result[name]=actual
          Path('candidate-blobs.json').write_text(json.dumps(result,indent=2))
          subprocess.run(['git','diff','--binary','--output=candidate.patch'],check=True)
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-secondary-${{ github.run_id }}
          path: |
            candidate.patch
            candidate-blobs.json
            secondary-results.json
            protocol.log
            playwright-report/
            test-results/
          retention-days: 3
