name: SIGNAL D3 Today candidate
on:
  push:
    branches: [qa/signal-d3-today-composition-20261027]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 26621d0bd1d67abde1107852264b8fac4f6f49f7
          persist-credentials: false
      - name: Complete populated announcement coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ui-design-d3l-v535.css');s=p.read_text()
          s+='''
          /* お知らせも空状態だけでなく、登録済み本文・日時・補足を暗色で読めるようにする。 */
          body[data-wb-design="signal"][data-wb-tone="midnight"] #todayView .activity-item {
            background:var(--signal-subtle) !important;color:var(--signal-text) !important;border-color:var(--signal-border) !important;
          }
          body[data-wb-design="signal"][data-wb-tone="midnight"] #todayView .activity-item:hover {
            background:var(--signal-primary-soft) !important;
          }
          body[data-wb-design="signal"][data-wb-tone="midnight"] #todayView .activity-item :is(strong,.activity-change) {
            color:var(--signal-text) !important;
          }
          body[data-wb-design="signal"][data-wb-tone="midnight"] #todayView .activity-item :is(.activity-meta,time) {
            color:var(--signal-muted) !important;
          }
          '''
          p.write_text(s)
          p=Path('tests/appearance-v536.spec.mjs');s=p.read_text()
          needle='const schedules=[owner,other].map((assignee,i)=>'
          assert s.count(needle)==1
          s=s.replace(needle,'''tasks[0].createdBy=other;
                tasks[0].updatedBy=other;
                localStorage.setItem(`system-task-activity-read-at:${roomId}:${owner}`,String(now-20000));
                const schedules=[owner,other].map((assignee,i)=>''')
          needle="    await readableContentV536(page.locator('[data-signal-metric=\"overdue\"] strong'),'.signal-today-overview');"
          assert s.count(needle)==1
          extra='''
              const notice=page.locator('#todayView .activity-item[data-activity-task="overdue"]');
              await expect(notice).toBeVisible();
              if(tone==='midnight'){
                await readableContentV536(notice.locator('strong'),'.activity-item');
                await readableContentV536(notice.locator('time'),'.activity-item');
                await readableContentV536(notice.locator('.activity-meta'),'.activity-item');
              }
          '''
          s=s.replace(needle,needle+'\n'+extra)
          p.write_text('\n'.join(line.rstrip() for line in s.splitlines())+'\n')
          PY
          git diff --check
          node --check app.js
          node --check tests/appearance-v536.spec.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Static regression
        run: npm run test:protocol
      - name: Browser acceptance and Classic snapshots
        run: npx playwright test tests/appearance-v536.spec.mjs tests/workspace-personal-order-v531.spec.mjs tests/today-sidebar-filters-v375.spec.mjs tests/app-lifecycle-listener-singleton-v508.spec.mjs tests/workspace-density-v188.spec.mjs --retries=0 --workers=1
      - name: Preserve candidate blobs (no branch updates)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,base64,hashlib,subprocess,urllib.request
          from pathlib import Path
          names=['app.js','ui-preferences-v536.js','ui-design-d3l-v535.css','test-harness/today-sidebar-filters-v375.test.mjs','tests/appearance-v536.spec.mjs','docs/SIGNAL_APPEARANCE_V536.md']
          result={}
          for name in names:
            data=Path(name).read_bytes()
            expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(request,timeout=30) as response: actual=json.load(response)['sha']
            assert actual==expected
            result[name]=actual
          Path('candidate-blobs.json').write_text(json.dumps(result,indent=2))
          subprocess.run(['git','diff','--binary','--output=candidate.patch'],check=True)
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-d3-candidate-${{ github.run_id }}
          path: |
            candidate-blobs.json
            candidate.patch
            playwright-report/
            test-results/
          retention-days: 3
