          body[data-wb-design="signal"] .signal-today-metric strong {font-size:27px;font-variant-numeric:tabular-nums;line-height:1.2}
          body[data-wb-design="signal"] .signal-today-metric dd span {font-size:11px;color:var(--signal-muted)}
          body[data-wb-design="signal"] [data-signal-metric="overdue"] strong {color:var(--signal-danger)}
          body[data-wb-design="signal"] #todayView[data-signal-today-composition="d3"] :is(.activity-head,.today-todo-preview-head) {display:flex;align-items:flex-start;flex-wrap:wrap;gap:12px;padding:16px}
          body[data-wb-design="signal"] #todayView[data-signal-today-composition="d3"] .activity-head > div:first-child > p {display:none}
