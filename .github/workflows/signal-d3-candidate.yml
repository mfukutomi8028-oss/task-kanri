name: SIGNAL D3 Today candidate
on:
  push:
    branches: [qa/signal-d3-today-composition-20261027]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 399e2596ca7dcc12e7632077fc9fe18ec1d0df44
