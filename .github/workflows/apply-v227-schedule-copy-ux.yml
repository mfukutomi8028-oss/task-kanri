name: Apply Ver227 Schedule Copy UX

on:
  push:
    branches:
      - feature/schedule-copy-validation-ux-v227
    paths:
      - scripts/apply-v227-schedule-copy-ux.mjs
      - .github/workflows/apply-v227-schedule-copy-ux.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/schedule-copy-validation-ux-v227
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: node scripts/apply-v227-schedule-copy-ux.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html ui-schedule-copy-v225.css release-manifest.js test-harness/version-source-v194.test.mjs tests/schedule-copy-v225.spec.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Ver.227 スケジュールコピーの入力保護と大量作成警告を追加 [skip ci]"
          git push origin HEAD:feature/schedule-copy-validation-ux-v227
