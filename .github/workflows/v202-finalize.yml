name: Ver.202 one-shot contract finalizer
on:
  push:
    branches:
      - refactor/today-owner-v202
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v202-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/today-owner-v202
          fetch-depth: 0
      - name: Align Ver.202 release, contracts, and docs
        run: node .github/scripts/v202-finalize.cjs
      - name: Remove one-shot helpers and commit
        run: |
          rm .github/scripts/v202-finalize.cjs
          rm .github/workflows/v202-finalize.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "[v202-finalize] canonicalize Today ownership"
          git push origin HEAD:refactor/today-owner-v202
