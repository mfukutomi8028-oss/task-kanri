name: Ver219 exact source patch

on:
  push:
    branches:
      - refactor/stable-today-data-ownership-v219

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stable-today-data-ownership-v219
          fetch-depth: 0

      - name: Patch app.js exact Today ownership targets
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.js')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'const openTasks = state.tasks.filter(t => !isCompletedStatus(t.status));',
                  'const openTasks = state.tasks.filter(t => !isCompletedStatus(t.status) && normalizeText(t.status) !== normalizeText("保留") && (!scopeHasMine() || isCurrentUserOrGroupAssignee(t.assignee)));',
                  'Today openTasks canonical filter',
              ),
              (
                  '.filter(s => !scopeHasMine() || s.assignee === getCurrentUser())',
                  '.filter(s => !scopeHasMine() || isCurrentUserOrGroupAssignee(s.assignee))',
                  'Today schedule canonical mine predicate',
              ),
              (
                  'const spare = openTasks.filter(t => !t.dueDate && !isUnsortedTask(t)).sort(compareSmartTasks).slice(0, 10);',
                  'const spare = openTasks.filter(t => !t.dueDate && !isUnsortedTask(t) && normalizeText(t.status) !== normalizeText("確認待ち")).sort(compareSmartTasks).slice(0, 10);',
                  'Today spare waiting exclusion',
              ),
          ]

          for before, after, label in replacements:
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 target, got {count}')
              source = source.replace(before, after, 1)

          path.write_text(source, encoding='utf-8')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/_tmp-v219-source-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/_tmp-v219-source-patch.yml
          git diff --cached --check
          git commit -m "Ver.219 Today意味論をapp.js正本へ統合"
          git push origin HEAD:refactor/stable-today-data-ownership-v219
