name: Apply Ver.137 ToDo memo and UI improvements

on:
  push:
    branches:
      - main
    paths:
      - .github/v137-trigger

permissions:
  contents: write

jobs:
  apply-v137:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/v137-patch-part-1.txt \
            .github/v137-patch-part-2.txt \
            .github/v137-patch-part-3.txt \
            .github/v137-patch-part-4.txt \
            > /tmp/v137.patch
          git apply --check /tmp/v137.patch
          git apply /tmp/v137.patch
          # Keep the README shown by GitHub aligned with the complete root history.
          cp README.md .github/README.md

      - name: Run syntax and protocol tests
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check todo-sync-v136.js
          node --test test-harness/todo-protocol.test.mjs test-harness/delete-protocol.test.mjs

      - name: Verify Ver.137 release consistency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          manifest = (root / 'release-manifest.js').read_text(encoding='utf-8-sig')
          assert 'version: "137"' in manifest
          html = (root / 'index.html').read_text(encoding='utf-8-sig')
          assert 'Ver.137' in html
          assert '未整理タスクをクイック追加' in html
          assert '未整理の正式タスクをクイック追加' not in html
          assert '>クイック追加</button>' in html
          versions = re.findall(r'\?v=(\d+)', html)
          assert versions and set(versions) == {'137'}, set(versions)
          for name in ['README.md', '.github/README.md', 'release-notes.md']:
              text = (root / name).read_text(encoding='utf-8-sig')
              assert '137' in text, name
          app = (root / 'app.js').read_text(encoding='utf-8-sig')
          for token in ['todayTodoMemo', 'updateTodoDetails', "description: todo.memo || ''"]:
              assert token in app, token
          protocol = (root / 'todo-sync-v136.js').read_text(encoding='utf-8-sig')
          assert 'TODO_MEMO_MAX_LENGTH = 1000' in protocol
          css = (root / 'style.css').read_text(encoding='utf-8-sig')
          for token in ['Ver.137', '.todo-promote-button', 'minmax(104px, max-content)']:
              assert token in css, token
          print('Ver.137 release consistency: OK')
          PY

      - name: Commit Ver.137 and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/v137-patch-part-1.txt \
            .github/v137-patch-part-2.txt \
            .github/v137-patch-part-3.txt \
            .github/v137-patch-part-4.txt \
            .github/v137-trigger \
            .github/workflows/apply-v137-todo-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Ver.137 ToDo memo and UI improvements"
          git push origin HEAD:main
