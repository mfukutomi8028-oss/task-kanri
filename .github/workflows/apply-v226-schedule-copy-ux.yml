name: Apply Ver226 schedule copy UX
on:
  push:
    branches:
      - feature/schedule-copy-ux-v226
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply product changes
        run: python .github/scripts/apply-v226-schedule-copy-ux.py
      - name: Verify syntax
        run: |
          node --check app.js
          node --check release-manifest.js
          git diff --check
      - name: Commit product changes and remove temporary files
        run: |
          rm .github/workflows/apply-v226-schedule-copy-ux.yml
          rm .github/scripts/apply-v226-schedule-copy-ux.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Ver.226 スケジュールコピーを方法別ガイドUIへ改善"
          git push origin HEAD:feature/schedule-copy-ux-v226
