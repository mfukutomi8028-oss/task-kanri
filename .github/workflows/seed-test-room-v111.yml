          JST = ZoneInfo("Asia/Tokyo")
          now = datetime.now(JST)
          now_ms = int(now.timestamp() * 1000)

          def day(offset):
              return (now.date() + timedelta(days=offset)).isoformat()

          def at(offset, hour, minute=0):
              dt = datetime.combine(now.date() + timedelta(days=offset), datetime.min.time(), JST)
              return dt.replace(hour=hour, minute=minute).isoformat()

          def ms_ago(days=0, hours=0, minutes=0):
              return int((now - timedelta(days=days, hours=hours, minutes=minutes)).timestamp() * 1000)

          def change(label, summary, details):
              return {"label": label, "summary": summary, "details": details}

          request = urllib.request.Request(DB_URL, method="GET")
          with urllib.request.urlopen(request, timeout=30) as response:
              current = json.load(response) or {}

          if int((current.get("meta") or {}).get("testSeedVersion") or 0) >= 1:
              print("Test room is already seeded. Existing data was preserved.")
