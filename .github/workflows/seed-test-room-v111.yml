name: Seed test room and bump v111

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/seed-test-room-v111.yml

permissions:
  contents: write

jobs:
  seed-and-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

