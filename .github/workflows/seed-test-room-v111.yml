          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = index.replace("?v=110", "?v=111")
          index = index.replace("Ver.110", "Ver.111")
          index_path.write_text(index, encoding="utf-8")

          config_path = Path("config.js")
          config = config_path.read_text(encoding="utf-8")
          config = config.replace("// v110:", "// v111:", 1)
          config = config.replace('const VERSION = "110";', 'const VERSION = "111";', 1)
          config = config.replace("mobile-base-v110", "mobile-base-v111")
          config = config.replace("stable-v110", "stable-v111")
          config_path.write_text(config, encoding="utf-8")

          stable_path = Path("stable-fixes-v108.js")
          stable = stable_path.read_text(encoding="utf-8")
          stable = stable.replace("// v110:", "// v111:", 1)
          stable = stable.replace('const VERSION = "110";', 'const VERSION = "111";', 1)
          stable_path.write_text(stable, encoding="utf-8")

          mobile_path = Path("mobile-fixes.js")
          mobile = mobile_path.read_text(encoding="utf-8")
          mobile = mobile.replace("// v110:", "// v111:", 1)
          mobile = mobile.replace('const VERSION = "110";', 'const VERSION = "111";', 1)
          mobile_path.write_text(mobile, encoding="utf-8")
          PY

