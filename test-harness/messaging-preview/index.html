<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Origin メッセージ試験画面</title><meta name="description" content="架空データによる業務メッセージ画面の隔離プレビュー"><link rel="stylesheet" href="origin-messaging.css"><style>
:root{--origin-font-sans:Inter,"Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;--bg:#f5f5f3;--paper:#fff;--sidebar:#fff;--ink:#252b37;--ink-soft:#526071;--muted:#626e80;--line:#e6e9ed;--line-soft:#eff1f4;--accent:#535fd0;--accent-dark:#3948b8;--accent-bg:#eff0fc;--on-accent:#fff;--hover:#f7f8fc;--shadow:0 12px 42px rgba(33,43,70,.06);--warn:#98502b;--warn-bg:#fff3eb;--red:#a53c4c;--red-bg:#fff0f1}
:root[data-theme=dark]{color-scheme:dark;--bg:#151920;--paper:#1d222b;--sidebar:#1b2028;--ink:#ebedf4;--ink-soft:#bdc4d2;--muted:#8f99ac;--line:#333b48;--line-soft:#29313d;--accent:#a3abff;--accent-dark:#bac0ff;--accent-bg:#2e3559;--on-accent:#151920;--hover:#272e3a;--shadow:0 16px 46px rgba(0,0,0,.12);--warn:#e8a578;--warn-bg:#423125;--red:#e695a0;--red-bg:#402a31}
html,body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--origin-font-sans);min-height:100%}*{box-sizing:border-box}.preview-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 28px;max-width:1490px;margin:auto;height:76px}.preview-brand{font-size:23px;font-weight:820;letter-spacing:-.06em}.preview-brand span{color:var(--accent)}.preview-note{font-size:12px;color:var(--muted)}#app{padding:0 24px 24px}.preview-detail{color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;max-width:calc(100% - 24px);padding:20px}.preview-detail button{min-height:44px;padding:8px 16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}.preview-detail button:focus-visible{outline:3px solid var(--accent)}@media(max-width:760px){.preview-header{padding:8px 16px;height:62px}.preview-brand{font-size:20px}#app{padding:0 8px 8px}.preview-note{font-size:11px}}
</style></head><body><header class="preview-header"><div class="preview-brand">origin<span>.</span></div><span class="preview-note">隔離プレビュー（架空データのみ）</span></header><div id="app"><noscript>JavaScriptを有効にして試験画面を確認してください。</noscript></div><dialog class="preview-detail"><h2></h2><p>この画面では架空の業務データのみを表示します。</p><button type="button">会話に戻る</button></dialog><script type="module" src="preview-fixture.js"></script></body></html>
