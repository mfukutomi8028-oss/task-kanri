<!doctype html>
<html lang="ja" data-palette="ink">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Modern v2 | 業務メモ（読取専用検証）</title>
  <link rel="stylesheet" href="../palettes.css">
  <link rel="stylesheet" href="../layout.css">
  <style>
    [hidden]{display:none!important}
    .readonly-flag{display:inline-flex;align-items:center;gap:6px;color:var(--accent-text);background:var(--accent-soft);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700}
    .readonly-context{color:var(--muted);font-size:12px;line-height:1.75;margin:0 0 17px;overflow-wrap:anywhere}
    .readonly-failure{padding:20px;color:var(--muted);line-height:1.8;font-size:12px}
    .readonly-rail-label{padding:12px;color:var(--rail-muted);font-size:10px;line-height:1.7}
    .readonly-count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin:0 0 15px;line-height:1.8}
    .readonly-count strong{color:var(--ink)}
    .readonly-select{min-height:35px;max-width:180px}
    .readonly-memo-head{display:flex;align-items:center;justify-content:space-between;gap:9px;min-width:0}
    .readonly-memo-head h2{overflow-wrap:anywhere}
    .readonly-category{white-space:normal;overflow-wrap:anywhere}
    .readonly-pinned{border-color:var(--accent)}
    .readonly-pin-label{font-size:10px;color:var(--accent-text);background:var(--accent-soft);border-radius:5px;padding:4px 7px;white-space:nowrap;font-weight:700}
    .readonly-no-pin{font-size:10px;color:var(--muted)}
    .readonly-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:11px}
    .readonly-tag{display:inline-block;padding:3px 7px;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;overflow-wrap:anywhere}
    .readonly-copy{font-family:inherit;display:block;max-height:220px;min-height:75px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;overscroll-behavior:contain;scrollbar-width:thin}
    .readonly-copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .readonly-bottom{font-size:10px;color:var(--muted);padding-top:12px;margin-top:16px;border-top:1px solid var(--line);line-height:1.7;overflow-wrap:anywhere}
    .readonly-empty{padding:26px 20px;color:var(--muted);font-size:12px;line-height:1.8}
    .readonly-mobile-note{display:none}
    @media(max-width:860px){
      .heading{flex-wrap:wrap}
      .readonly-select{max-width:none;width:100%}
      .readonly-copy{max-height:175px}
      .readonly-mobile-note{display:block;padding:12px;text-align:center;color:var(--muted);font-size:11px}
    }
  </style>
  <script type="module" src="./memo-list-v555.mjs"></script>
</head>
<body data-view="memo">
  <a class="skip" href="#main">本文へ</a>
  <div class="shell" id="shell">
    <aside class="rail" aria-label="検証用ナビゲーション">
      <div class="brand"><img src="../../assets/brand-v184.svg" alt="業務管理ボード"><div class="brand-word">業務管理ボード<small>MODERN v2</small></div></div>
      <nav class="rail-nav" aria-label="現在の画面">
        <span class="nav-button" aria-current="page"><img src="../../assets/nav-memo-v168.svg" alt=""><span class="nav-label">業務メモ</span></span>
      </nav>
      <div class="rail-bottom"><p class="readonly-rail-label">閲覧専用の検証画面です。保存・固定変更・並べ替え・削除はできません。</p></div>
    </aside>
    <header class="topbar">
      <div class="top-left"><div class="crumb"><strong>業務管理ボード</strong><span>/</span><span>業務メモ</span></div><span class="preview-tag">TEST ONLY</span></div>
      <div class="top-right"><button id="closeV555" type="button" class="btn small">クラシックへ戻る</button></div>
    </header>
    <main id="main" class="content" tabindex="-1">
      <section class="heading"><div><div class="eyebrow">SHARED REFERENCE / MODERN v2</div><h1>業務メモ</h1><p>手順や連絡先など、共有ルームの情報をすぐ確認</p></div><span class="readonly-flag">閲覧専用</span></section>
      <div class="toolbar">
        <label class="search-field"><span aria-hidden="true">⌕</span><input id="memoSearchV555" type="search" placeholder="タイトル・本文・分類・タグで検索" aria-label="業務メモを検索"></label>
        <label for="memoCategoryV555">分類</label>
        <select id="memoCategoryV555" class="readonly-select" aria-label="分類で絞り込む"><option value="">すべての分類</option></select>
        <button id="refreshV555" type="button" class="btn">正本を再読込</button>
      </div>
      <p id="sourceV555" role="status" aria-live="polite" class="readonly-context">共有ルームの業務メモを確認中です。</p>
      <p id="countV555" class="readonly-count" aria-live="polite"></p>
      <div id="failureV555" class="panel readonly-failure" role="status" hidden></div>
      <section id="memoV555" aria-label="共有ルームの業務メモ" hidden>
        <div id="memoGridV555" class="memo-grid"></div>
        <div id="memoEmptyV555" class="panel readonly-empty" role="status" hidden>表示条件に合う業務メモはありません。</div>
      </section>
      <p class="readonly-mobile-note">Modern v2 / 共有業務メモの閲覧のみ。固定・編集・並べ替えはクラシックで行ってください。</p>
    </main>
  </div>
</body>
</html>
