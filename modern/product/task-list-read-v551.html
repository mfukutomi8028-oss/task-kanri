<!doctype html>
<html lang="ja" data-palette="ink">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Modern v2 | タスク</title>
  <link rel="stylesheet" href="../palettes.css?v=318">
  <link rel="stylesheet" href="../layout.css?v=318">
  <style>
    .read-only-flag {display:inline-flex;align-items:center;gap:6px;color:var(--accent-text);background:var(--accent-soft);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:var(--type-small);font-weight:700}
    .readonly-copy {color:var(--muted);font-size:var(--type-body);line-height:1.7;margin:0 0 16px}
    .readonly-copy[hidden],.readonly-empty[hidden] {display:none}
    .readonly-empty {padding:25px;color:var(--muted);font-size:var(--type-strong)}
    .readonly-empty strong {display:block;color:var(--ink);margin-bottom:4px}
    .readonly-dot {font-size:var(--type-section);line-height:1;color:var(--accent)}
    .readonly-title {display:block;min-width:175px;font-weight:650;overflow-wrap:anywhere}
    .readonly-subtitle {display:block;color:var(--muted);margin-top:4px;font-size:var(--type-caption)}
    .readonly-cell {white-space:nowrap}
    .readonly-bar {display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0;color:var(--muted);font-size:var(--type-small)}
    .readonly-bar strong {color:var(--ink)}
    .readonly-rail-label {padding:12px;color:var(--rail-muted);font-size:var(--type-caption);line-height:1.7}
    .readonly-mobile-label {display:none}
    .task-edit-v560{margin-top:7px;white-space:nowrap;font-size:var(--type-small);padding:5px 9px}
    .task-row-tools-v561{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px}
    .task-row-tools-v561 .task-edit-v560{margin-top:0}
    .task-row-tools-v561 .btn{white-space:nowrap;padding:5px 9px;font-size:var(--type-small)}
    .task-delete-v561{color:#b42332}
    .task-row-tools-v561 .btn:disabled{opacity:.5;cursor:not-allowed}
    .task-status-v560{min-width:112px;max-width:160px;width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:var(--type-body)}
    .task-status-v560:disabled{opacity:.6}
    #taskNewV560[hidden],#taskActionStatusV560[hidden]{display:none!important}
    .task-layout-picker-v318{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0}
    .task-layout-picker-v318 strong{color:var(--muted);font-size:var(--type-body);margin-right:4px}
    .task-layout-picker-v318 .btn{min-height:44px;padding:9px 14px}
    .task-layout-picker-v318 [aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent)}
    .task-layout-v318[hidden]{display:none!important}
    .task-modern-grid-v318{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px;align-items:start}
    .task-modern-group-v318{min-width:0;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface)}
    .task-modern-group-head-v318{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
    .task-modern-group-head-v318 h2{font-size:var(--type-subtitle);line-height:1.5;overflow-wrap:anywhere}
    .task-modern-count-v318{flex:0 0 auto;color:var(--muted);font-size:var(--type-body)}
    .task-modern-cards-v318{display:grid;gap:12px}
    .task-modern-card-v318{min-width:0;padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--card,var(--surface));overflow-wrap:anywhere}
    .task-modern-card-v318.is-overdue{border-inline-start:4px solid var(--danger)}
    .task-modern-title-v318{display:block;color:var(--ink);font-weight:700;font-size:var(--type-strong);line-height:1.5;margin-bottom:8px}
    .task-modern-meta-v318{display:grid;gap:5px;color:var(--muted);font-size:var(--type-body);line-height:1.6}
    .task-modern-card-v318 .task-status-v560{max-width:none;min-height:44px;margin-top:10px}
    .task-modern-card-v318 .task-row-tools-v561{margin-top:12px}
    .task-modern-card-v318 .task-row-tools-v561 .btn,.task-modern-card-v318 .task-edit-v560{min-height:44px}
    .task-modern-card-v318 .status{margin-top:10px;display:inline-block}
    .task-modern-timeline-v318{display:grid;gap:16px}
    .task-modern-timeline-v318 .task-modern-group-v318{width:100%}
    .task-modern-timeline-v318 .task-modern-cards-v318{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
    .task-modern-empty-v318{margin:0;color:var(--muted);font-size:var(--type-body);line-height:1.7}
    @media(max-width:580px){.task-modern-grid-v318{grid-template-columns:minmax(0,1fr)}.task-layout-picker-v318 .btn{flex:1 1 auto}}
    #taskActionStatusV560{padding:9px 12px;border-inline-start:3px solid var(--accent);background:var(--surface);color:var(--ink);font-size:var(--type-body)}
    #taskActionStatusV560[data-error="true"]{border-inline-start-color:#b91c2b}
    @media(max-width:860px) {
      .readonly-title {min-width:0}
      .readonly-mobile-label {display:block;background:var(--surface);padding:11px 14px;color:var(--muted);text-align:center;font-size:var(--type-small)}
      .heading {flex-wrap:wrap;align-items:flex-start}
      .heading .read-only-flag {margin-left:0}
    }
  </style>
  <script type="module" src="./task-list-v551.mjs?v=318"></script>
</head>
<body data-view="tasks">
  <a class="skip" href="#main">本文へ</a>
  <div class="shell" id="shell">
    <aside class="rail" aria-label="検証用ナビゲーション">
      <div class="brand"><img src="../../assets/brand-v184.svg" alt="業務管理ボード"><div class="brand-word">業務管理ボード<small>MODERN v2</small></div></div>
      <nav class="rail-nav" aria-label="現在の画面">
        <span class="nav-button" aria-current="page"><img src="../../assets/nav-task-v169.svg" alt=""><span class="nav-label">タスク一覧</span></span>
      </nav>
      <div class="rail-bottom"><p class="readonly-rail-label">読み取り専用の検証画面です。保存・削除はできません。</p></div>
    </aside>
    <header class="topbar">
      <div class="top-left"><div class="crumb"><strong>業務管理ボード</strong><span>/</span><span>タスク一覧</span></div><span class="preview-tag">TEST ONLY</span></div>
      <div class="top-right"><button id="closeReadonly" type="button" class="btn small" aria-label="検証画面を閉じてクラシックへ戻る">クラシックへ戻る</button></div>
    </header>
    <main class="content" id="main" tabindex="-1">
      <section class="heading">
        <div><div class="eyebrow">TEAM WORK / MODERN v2</div><h1>タスク一覧</h1><p>クラシックのデータと保存処理を共有するタスク画面</p></div>
        <span class="read-only-flag">閲覧専用</span>
      </section>
      <div class="toolbar">
        <label class="search-field"><span aria-hidden="true">⌕</span><input id="taskSearchV551" type="search" placeholder="名称・分類・担当・状態を検索" aria-label="タスクを検索"></label>
        <label for="taskStatusV551">状態</label>
        <select id="taskStatusV551" aria-label="状態で絞り込む"><option value="all">すべて</option></select>
        <button class="btn" id="refreshV551" type="button">正本を再読込</button>
        <button class="btn" id="taskNewV560" type="button" hidden>タスクを新規作成</button>
      </div>
      <p class="readonly-copy" id="sourceV551" role="status" aria-live="polite">既存データの接続状態を確認中です。</p>
      <p id="taskActionStatusV560" role="status" aria-live="polite" hidden></p>
      <div class="readonly-bar"><span id="countV551" aria-live="polite"></span><span id="taskWriteNoteV560">保存・編集・削除はできません</span></div>
      <div class="task-layout-picker-v318" role="group" aria-label="タスクの表示形式">
        <strong>表示形式</strong>
        <button type="button" class="btn" data-task-mode-v318="list" aria-pressed="true">一覧</button>
        <button type="button" class="btn" data-task-mode-v318="board" aria-pressed="false">ボード</button>
        <button type="button" class="btn" data-task-mode-v318="timeline" aria-pressed="false">タイムライン（期限別）</button>
      </div>
      <section class="task-table-wrap task-layout-v318" id="taskTableV318" aria-label="タスク一覧">
        <table class="task-table" aria-label="タスク一覧">
          <thead><tr><th class="select-cell"></th><th>タスク</th><th class="owner-cell">担当</th><th>状態</th><th class="priority-cell">優先度</th><th>期限</th></tr></thead>
          <tbody id="taskRowsV551"></tbody>
        </table>
        <div class="readonly-empty" id="emptyV551" role="status"><strong>読込状況を確認中です</strong><span>この画面は開発用です。</span></div>
      </section>
      <section id="taskBoardV318" class="task-modern-grid-v318 task-layout-v318" aria-label="状態別タスクボード" hidden></section>
      <section id="taskTimelineV318" class="task-modern-timeline-v318 task-layout-v318" aria-label="期限別タスク一覧" hidden></section>
      <p class="readonly-mobile-label">Modern v2 / 一覧・状態別ボード・期限別タイムラインを切り替えられます。編集はClassicの既存保存処理を使用します。</p>
    </main>
  </div>
</body>
</html>
